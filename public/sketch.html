<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;--red3: #000;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--red2);border-radius:2px}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,248,243,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:76px;gap:0}
.nav-logo{font-family:'Bristol','Caveat',cursive;font-size:44px;letter-spacing:0;color:var(--ink);line-height:0.9;font-weight:400;cursor:pointer;white-space:nowrap;flex:1}
.nav-icons{display:flex;gap:6px;align-items:center}
.nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);font-size:14px;border-radius:2px;transition:all 0.15s}
.nav-icon:hover{color:var(--red2);background:var(--bg3)}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--red2);cursor:pointer;margin-left:4px;letter-spacing:0.05em;overflow:hidden}
.nav-avatar img{width:100%;height:100%;object-fit:cover}

.wrap{max-width:820px;margin:0 auto;padding:78px 20px 80px}
.hero{background:var(--bg2);border:1px solid var(--border);position:relative;overflow:hidden}
.hero img{width:100%;max-height:80vh;object-fit:contain;display:block;background:#000}
.hero-kind{position:absolute;top:12px;left:12px;font-size:10px;letter-spacing:0.18em;padding:4px 10px;background:rgba(0,0,0,0.78);color:#fff}
.hero-price{position:absolute;top:12px;right:12px;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:18px;letter-spacing:0.06em;padding:6px 12px;background:var(--red2);color:var(--bg);line-height:1}
.hero-thumbs{display:none;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.hero-thumbs::-webkit-scrollbar{display:none}
.hero-thumb{flex:0 0 auto;width:80px;height:80px;background:var(--bg3);cursor:pointer;border:2px solid var(--border);padding:0;transition:border-color 0.15s;overflow:hidden}
.hero-thumb:hover{border-color:var(--txt3)}
.hero-thumb.active{border-color:var(--red2)}
.hero-thumb img{width:100%;height:100%;object-fit:cover;display:block}

.info{padding:24px 4px;display:flex;flex-direction:column;gap:18px}
.caption{font-size:14px;color:var(--txt);line-height:1.7;letter-spacing:0.03em;white-space:pre-wrap}
.caption.empty{color:var(--txt3);font-style:italic}
.meta-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt3);letter-spacing:0.06em}
.meta-row .dot{width:3px;height:3px;border-radius:50%;background:var(--txt3)}

.artist-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg2);border:1px solid var(--border);transition:border-color 0.15s}
.artist-card:hover{border-color:var(--border2)}
.artist-avatar{width:54px;height:54px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--red2);overflow:hidden;flex-shrink:0;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;letter-spacing:0.08em}
.artist-avatar img{width:100%;height:100%;object-fit:cover}
.artist-info{flex:1;min-width:0}
.artist-info .name{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:20px;letter-spacing:0.12em;color:var(--red2)}
.artist-info .meta{font-size:11px;color:var(--txt3);letter-spacing:0.06em;margin-top:4px}
.rating-inline{display:inline-flex;align-items:center;gap:3px;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;color:#e8c87f;letter-spacing:0.04em;margin-left:8px;vertical-align:middle}
.rating-inline .rating-cnt{color:var(--txt3);font-size:10px}

/* Price block — výrazný, pod caption */
.price-block{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:18px 20px;background:var(--bg2);border:1px solid var(--border2);flex-wrap:wrap}
.price-main{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:36px;letter-spacing:0.06em;color:var(--red2);line-height:1}
.price-meta{font-size:11px;color:var(--txt3);letter-spacing:0.08em;text-transform:uppercase;line-height:1.5}
.price-meta b{color:var(--txt);font-weight:400}

/* Artist actions — message btn next to profile link */
.artist-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0}
.artist-actions .btn-msg{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:11px;letter-spacing:0.08em;padding:7px 12px;background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);cursor:pointer;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;white-space:nowrap}
.artist-actions .btn-msg:hover{border-color:var(--red2);color:var(--red2)}
.artist-actions .profile-link{font-size:10px;letter-spacing:0.1em;color:var(--txt3);text-transform:uppercase}
.artist-cta{font-size:11px;letter-spacing:0.08em;color:var(--txt3)}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn-primary{flex:1;min-width:200px;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:13px;letter-spacing:0.1em;padding:14px 22px;background:var(--red2);color:var(--bg);border:none;cursor:pointer;text-transform:uppercase;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.actions .btn-primary:hover{background:var(--red3)}
.actions .btn-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);background:transparent;color:var(--txt2);cursor:pointer;font-size:16px;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;transition:all 0.15s}
.actions .btn-icon > *{pointer-events:none}
.actions .btn-icon:hover{border-color:var(--red2);color:var(--red2)}
.actions .btn-icon.liked{color:#e58787;border-color:#e58787}
.actions .btn-icon .cnt{font-size:11px;margin-left:4px;letter-spacing:0.04em}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);font-size:13px;letter-spacing:0.06em;padding:10px 20px;z-index:300;opacity:0;transition:all 0.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.skeleton{background:var(--bg3);height:480px;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:11px;letter-spacing:0.1em}

.slots-block{display:flex;flex-direction:column;gap:10px}
.slots-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.slots-head .label{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:16px;letter-spacing:0.16em;color:var(--red2)}
.slots-head .cnt{font-size:11px;letter-spacing:0.06em;color:var(--txt3)}
.slot-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);text-decoration:none;color:inherit;transition:border-color 0.15s,background 0.15s}
.slot-row:hover:not(.disabled){border-color:var(--red2);background:var(--bg3)}
.slot-row.disabled{opacity:0.5;cursor:not-allowed}
.slot-date{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:18px;letter-spacing:0.06em;min-width:150px;color:var(--txt)}
.slot-meta{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--txt2);min-width:0}
.slot-meta .price{color:var(--txt)}
.slot-meta .dep{color:var(--txt3);font-size:11px;letter-spacing:0.04em}
.slot-cta{font-size:11px;letter-spacing:0.1em;color:var(--red2);white-space:nowrap;text-transform:uppercase}
.slot-more{text-align:center;padding:10px;font-size:11px;letter-spacing:0.08em;color:var(--txt3);text-transform:uppercase;border:1px dashed var(--border2);text-decoration:none}
.slot-more:hover{color:var(--red2);border-color:var(--red2)}
.slots-empty{padding:16px;background:var(--bg2);border:1px solid var(--border);text-align:center;font-size:12px;color:var(--txt3);letter-spacing:0.04em;line-height:1.6}
@media(max-width:560px){.slot-row{flex-direction:column;align-items:flex-start;gap:8px}.slot-date{min-width:0}.slot-cta{align-self:flex-end}}
</style>
</head>

<nav>
  <a class="nav-logo" href="/">inklink</a>
  <div class="nav-icons">

    <button class="nav-icon" onclick="location.href='/?search=1'" title="Hledat" style="background:none;border:none"><svg class="icon"><use href="#i-search"/></svg></button>    <a class="nav-icon" id="navCalendar" href="/my-bookings" title="Kalendář"><svg class="icon"><use href="#i-bookmark"/></svg></a>

    <div class="nav-avatar" id="navAvatar" title="Profil" onclick="goToProfile()">??</div>

<div class="wrap">
  <div class="hero" id="hero">
    <div class="skeleton">NAČÍTÁM…</div>
  </div>
  <div class="hero-thumbs" id="heroThumbs"></div>

  <div class="info" id="info"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const ITEM_ID = {{ITEM_ID}};
let me = null, item = null;

function escapeHtml(s){return(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function init() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);

  const navAvatar = document.getElementById('navAvatar');
  if (me) {
    if (me.avatar_url) navAvatar.innerHTML = `<img src="${escapeHtml(me.avatar_url)}" alt="">`;
    else navAvatar.textContent = (me.display_name || me.username || '?').slice(0,2).toUpperCase();
    document.getElementById('navLiked').style.display = 'flex';
  } else {
    navAvatar.outerHTML = '<a href="/login" class="btn" style="margin-left:6px;font-size:11px;letter-spacing:0.08em;padding:7px 14px;border:1px solid var(--red2);color:var(--red2);text-transform:uppercase">Přihlásit</a>';
  }

  const r = await fetch('/api/sketch/' + ITEM_ID);
  if (!r.ok) { location.href = '/'; return; }
  item = await r.json();
  render();
}

function render() {
  const p = item;
  const u = p.user;
  const isSketch = p.kind === 'sketch';
  const kindLabel = isSketch ? 'SKETCH' : 'HEALED';
  const priced = isSketch && p.price_kc;
  const priceTxt = priced
    ? `${(+p.price_kc).toLocaleString('cs-CZ')} Kč${p.estimated_hours?` · ${(+p.estimated_hours).toString().replace(/\.0$/,'')}h`:''}`
    : '';

  const images = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
  document.getElementById('hero').innerHTML = `
    <img id="heroImg" src="/uploads/${escapeHtml(images[0] || '')}" alt="${escapeHtml(p.caption || kindLabel)}">
    <div class="hero-kind">${kindLabel}</div>
    ${priced ? `<div class="hero-price">${priceTxt}</div>` : ''}
  `;
  // Thumbnail strip pokud má víc fotek
  const thumbsEl = document.getElementById('heroThumbs');
  if (thumbsEl) {
    if (images.length > 1) {
      thumbsEl.style.display = 'flex';
      thumbsEl.innerHTML = images.map((img, i) => `
        <button class="hero-thumb${i === 0 ? ' active' : ''}" onclick="switchHero(${i}, this)" aria-label="Fotka ${i+1}">
          <img src="/uploads/${escapeHtml(img)}" alt="" loading="lazy">
        </button>
      `).join('');
    } else {
      thumbsEl.style.display = 'none';
    }
  }

  const av = u.avatar
    ? `<img src="${escapeHtml(u.avatar)}" alt="">`
    : escapeHtml(u.initials || '?');
  const studioCity = [u.studio, u.city].filter(Boolean).join(' · ') || 'tatér';
  const styles = (p.styles || u.styles || '').trim();

  const priceBlock = priced
    ? `<div class="price-block">
         <div class="price-main">${priceTxt}</div>
         <div class="price-meta">${isSketch ? 'Cena za <b>celý sketch</b> včetně realizace' : 'Healed — referenční cena'}</div>
       </div>`
    : '';

  document.getElementById('info').innerHTML = `
    <div class="caption ${p.caption?'':'empty'}">${escapeHtml(p.caption || (isSketch ? 'Sketch bez popisu.' : 'Healed bez popisu.'))}</div>

    ${styles ? `<div class="meta-row"><span>${escapeHtml(styles)}</span></div>` : ''}

    ${priceBlock}

    <div class="artist-card">
      <a href="/profile/${escapeHtml(u.username)}" style="display:flex;align-items:center;gap:14px;flex:1;min-width:0;color:inherit;text-decoration:none">
        <div class="artist-avatar">${av}</div>
        <div class="artist-info">
          <div class="name">${escapeHtml(u.display_name)}${u.rating_count > 0 ? ` <span class="rating-inline">★ ${u.rating_avg.toFixed(1)} <span class="rating-cnt">(${u.rating_count})</span></span>` : ''}</div>
          <div class="meta">${escapeHtml(studioCity)}</div>
        </div>
      </a>
      <div class="artist-actions">
        <a class="btn-msg" href="/messages?to=${encodeURIComponent(u.username)}"><svg class="icon icon-sm" style="vertical-align:-2px;margin-right:4px"><use href="#i-message"/></svg> Zpráva</a>
        <a class="profile-link" href="/profile/${escapeHtml(u.username)}">Profil →</a>
      </div>
    </div>

    <div id="slotsMount"></div>

    <div class="actions">
      <button class="btn-icon ${p.liked?'liked':''}" id="likeBtn" onclick="toggleLike()" title="${p.liked?'Odebrat z lajků':'Lajknout'}"><svg class="icon icon-sm" style="vertical-align:-2px;margin-right:3px"><use href="#i-heart"/></svg><span class="cnt" id="likeCnt">${p.like_count}</span></button>
      <button class="btn-icon" onclick="shareSketch()" title="Sdílet odkaz">↗</button>
      <button class="btn-icon" id="storyBtn" onclick="shareStory()" title="Sdílet jako Instagram Story">▢</button>
    </div>
  `;

  loadSlots(u.username);
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('cs-CZ', {day:'numeric', month:'short'})
         + ' · ' + d.toLocaleTimeString('cs-CZ', {hour:'2-digit', minute:'2-digit'});
  } catch { return iso; }
}

function fmtPrice(min, max, unit) {
  const suffix = unit === 'flat' ? ' Kč' : ' Kč/h';
  if (!min && !max) return 'cena dle dohody';
  if (min && max && min !== max) return `${min.toLocaleString('cs-CZ')}–${max.toLocaleString('cs-CZ')}${suffix}`;
  return `${(min||max).toLocaleString('cs-CZ')}${suffix}`;
}

async function loadSlots(username) {
  const mount = document.getElementById('slotsMount');
  const u = item.user;
  let profile;
  try {
    profile = await fetch('/api/profile/' + encodeURIComponent(username)).then(r => r.json());
  } catch {
    mount.innerHTML = '';
    return;
  }

  const slots = (profile.slots || []).filter(s => {
    const totalH = (new Date(s.end_at) - new Date(s.start_at)) / 36e5;
    const occH = (s.occupied || []).reduce((sum, o) => sum + (new Date(o.end_at) - new Date(o.start_at)) / 36e5, 0);
    const freeH = Math.max(0, totalH - occH);
    return freeH >= (s.min_duration_hours || 1) - 0.01;
  });

  if (!slots.length) {
    mount.innerHTML = `
      <div class="slots-empty">
        Tatér zatím nemá vypsané volné termíny.<br>
        <a href="/profile/${escapeHtml(u.username)}" style="color:var(--red2);text-decoration:underline">Jdi na profil tatéra</a> a napiš mu zprávu.
      </div>`;
    return;
  }

  const visible = slots.slice(0, 4);
  const more = slots.length - visible.length;
  const canBook = item.kind === 'sketch' && u.can_book;
  const bookHash = item.kind === 'sketch' ? `#book-${item.id}` : '';

  mount.innerHTML = `
    <div class="slots-block">
      <div class="slots-head">
        <span class="label">Volné termíny</span>
        <span class="cnt">${slots.length} ${slots.length === 1 ? 'termín' : (slots.length < 5 ? 'termíny' : 'termínů')}</span>
      </div>
      ${visible.map(s => {
        const totalH = (new Date(s.end_at) - new Date(s.start_at)) / 36e5;
        return `
        <a class="slot-row" href="/profile/${escapeHtml(u.username)}${bookHash}">
          <div class="slot-date">${fmtDate(s.start_at)}</div>
          <div class="slot-meta">
            <span class="price">${fmtPrice(s.price_min, s.price_max, s.price_unit)} · záloha ${s.deposit_pct}%</span>
            <span class="dep">${totalH.toFixed(1).replace(/\.0$/,'')} h blok</span>
            ${s.note ? `<span class="dep">${escapeHtml(s.note)}</span>` : ''}
          </div>
          <span class="slot-cta">${canBook ? 'Rezervovat →' : 'Detail →'}</span>
        </a>`;
      }).join('')}
      ${more > 0 ? `<a class="slot-more" href="/profile/${escapeHtml(u.username)}">+ ${more} dalších termínů na profilu →</a>` : ''}
    </div>
  `;
}

async function shareStory() {
  const btn = document.getElementById('storyBtn');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '…';

  // Zkopíruj URL hned na začátku — když pak ve Story editoru klepneš
  // na link sticker, OS nabídne paste.
  let copied = false;
  try {
    await navigator.clipboard.writeText(location.href);
    copied = true;
  } catch {}

  try {
    const r = await fetch(`/sketch/${ITEM_ID}/story.png`);
    if (!r.ok) throw new Error('story fetch failed');
    const blob = await r.blob();
    const file = new File([blob], `inklink-sketch-${ITEM_ID}.png`, { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'InkLink' });
        showToast(copied
          ? 'Vlož přes link sticker — odkaz je zkopírovaný'
          : 'Otevři ve Story a přidej link sticker s URL');
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }

    // Fallback: stáhnout soubor
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `inklink-sketch-${ITEM_ID}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(copied
      ? 'Obrázek stažen, odkaz zkopírován'
      : 'Obrázek stažen — odkaz si zkopíruj z adresního řádku');
  } catch (e) {
    showToast('Nepodařilo se vygenerovat Story obrázek');
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

let _likeBusy = false;
async function toggleLike() {
  if (!me) { location.href = '/login'; return; }
  if (_likeBusy) return;
  _likeBusy = true;
  const btn = document.getElementById('likeBtn');
  btn.disabled = true;
  try {
    const r = await fetch(`/api/portfolio/${ITEM_ID}/like`, {method:'POST'}).then(r=>r.json()).catch(()=>null);
    if (!r) return;
    item.liked = r.liked;
    item.like_count = r.like_count;
    btn.classList.toggle('liked', r.liked);
    btn.title = r.liked ? 'Odebrat z lajků' : 'Lajknout';
    document.getElementById('likeCnt').textContent = r.like_count;
  } finally {
    _likeBusy = false;
    btn.disabled = false;
  }
}

async function shareSketch() {
  const url = location.href;
  const title = document.title;
  if (navigator.share) {
    try {
      await navigator.share({ title, url });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Odkaz zkopírován');
  } catch {
    showToast('Zkopíruj URL z adresního řádku');
  }
}

function switchHero(i, btn) {
  if (!item || !item.images || !item.images[i]) return;
  const img = document.getElementById('heroImg');
  if (img) img.src = '/uploads/' + item.images[i];
  document.querySelectorAll('.hero-thumb').forEach((el, j) => el.classList.toggle('active', i === j));
}

function goToProfile() {
  if (me && me.username) location.href = '/profile/' + me.username;
  else location.href = '/login';
}

init();
