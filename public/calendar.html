<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<style>html,body{background:#faf8f3;margin:0}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#faf8f3">
<meta name="robots" content="noindex">
<title>Calendar — InkLink</title>
<script>document.documentElement.dataset.theme='paper';try{localStorage.setItem('hmo_theme','paper')}catch(e){}</script>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;--red3: #000;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
  --accent:#0a84ff;            /* iOS blue accent */
  --ok:#30d158;
  --r-md:8px;
  --r-lg:14px;
  --ease:cubic-bezier(0.32,0.72,0,1);
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(14,14,16,0.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:76px;gap:0}
.nav-logo{font-family:'Bristol','Caveat',cursive;font-size:44px;letter-spacing:0;color:var(--ink);line-height:0.9;font-weight:400;cursor:pointer;white-space:nowrap;flex:1}
.nav-icons{display:flex;gap:6px;align-items:center}
.nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);border-radius:6px;transition:all 0.15s}
.nav-icon:hover{color:var(--red2);background:var(--bg3)}
.nav-icon.active{color:var(--red2);background:var(--bg3)}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--red2);cursor:pointer;margin-left:4px;letter-spacing:0.05em;overflow:hidden}
.nav-avatar img{width:100%;height:100%;object-fit:cover}

/* LAYOUT */
.wrap{max-width:1240px;margin:0 auto;padding:80px 24px 100px}
@media(max-width:560px){.wrap{padding:72px 16px 100px}}

/* HERO */
.cal-hero{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.cal-hero h1{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:clamp(22px,3vw,30px);letter-spacing:0.02em;line-height:1.1;color:var(--txt);font-weight:500}
.cal-hero .sub{font-size:12px;color:var(--txt3);letter-spacing:0.08em;margin-top:6px;text-transform:uppercase}

/* WEEK NAV (Apple-style segmented) */
.week-nav{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);padding:4px}
.week-nav button{background:transparent;border:none;color:var(--txt2);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;letter-spacing:0.04em}
.week-nav button:hover{background:var(--bg3);color:var(--txt)}
.week-nav button.today{background:var(--bg3);color:var(--txt);font-weight:500;padding:6px 12px}
.week-nav .label{font-size:12px;color:var(--txt);letter-spacing:0.06em;padding:0 8px;min-width:140px;text-align:center}
.week-nav .icon{width:14px;height:14px}

/* WEEK GRID */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px}
@media(max-width:760px){.week-grid{grid-template-columns:1fr;gap:6px}}
.day-col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 12px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:border-color 0.15s,background 0.15s}
.day-col.today{background:linear-gradient(180deg, rgba(10,132,255,0.05) 0%, var(--bg2) 100%);border-color:rgba(10,132,255,0.3)}
.day-col.past{opacity:0.5}
.day-col:hover{border-color:var(--border2)}
.day-head{display:flex;flex-direction:column;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:4px}
.day-name{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:13px;letter-spacing:0.16em;color:var(--txt3);text-transform:uppercase}
.day-num{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:24px;letter-spacing:0.02em;color:var(--txt);line-height:1;margin-top:2px}
.day-col.today .day-num{color:var(--accent)}
.day-col.today .day-name{color:var(--accent)}

.slot-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:all 0.15s;position:relative}
.slot-pill:hover{border-color:var(--txt3);background:var(--bg4);transform:translateY(-1px)}
.slot-pill .t{font-size:11px;color:var(--txt);letter-spacing:0.04em;font-weight:500}
.slot-pill .p{font-size:10px;color:var(--txt3);letter-spacing:0.02em}
.slot-pill.booked{border-color:rgba(48,209,88,0.4);background:rgba(48,209,88,0.06)}
.slot-pill.booked .t{color:var(--ok)}
/* Akce — vlastní barva, ať se v mřížce neplete se slotem ani s blokací.
   Plná levá linka místo přerušovaného rámečku blokace. */
.slot-pill.event{border-color:rgba(175,82,222,0.42);background:rgba(175,82,222,0.07);border-left:3px solid #af52de}
.slot-pill.event .t{color:#8e44ad;text-transform:uppercase;letter-spacing:0.1em}
.slot-pill.event .p{color:var(--txt2)}
.slot-pill .del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.4);border:none;color:var(--txt3);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;font-size:10px;line-height:1}
.slot-pill:hover .del{display:flex}
.slot-pill .del:hover{background:var(--ac-r,#ff453a);color:#fff}
.add-event-link{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid rgba(175,82,222,0.5);border-radius:var(--r-md);color:#8e44ad;font-size:12px;letter-spacing:0.06em;background:rgba(175,82,222,0.06);transition:all 0.15s;white-space:nowrap}
.add-event-link:hover{background:rgba(175,82,222,0.14);border-color:#af52de}
.day-col .empty-day{color:var(--txt3);font-size:10px;letter-spacing:0.06em;text-align:center;padding:20px 0;border:1px dashed var(--border);border-radius:8px;cursor:pointer;transition:all 0.15s;text-transform:uppercase}
.day-col .empty-day:hover{border-color:var(--accent);color:var(--accent);background:rgba(10,132,255,0.05)}

/* FAB ADD */
.fab-add-slot{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:var(--txt,#0a0a0a);color:var(--bg,#faf8f3);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;box-shadow:0 12px 32px rgba(20,16,8,0.18),0 2px 6px rgba(20,16,8,0.08);transition:transform 0.18s var(--ease),box-shadow 0.18s;z-index:200;border:none;font-family:'Bristol','Caveat',cursive;font-size:54px;line-height:1;padding:0;overflow:hidden}
.fab-add-slot > span{display:block;line-height:1;transform:translateY(0.02em)}
.fab-add-slot:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 16px 40px rgba(20,16,8,0.24),0 4px 10px rgba(20,16,8,0.10)}
.fab-add-slot:active{transform:translateY(0) scale(0.96)}
@media(max-width:760px){.fab-add-slot{bottom:80px;right:20px}}

/* SHEET MODAL — Apple-style slide up */
#slotSheet{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:500;opacity:0;pointer-events:none;transition:opacity 0.2s var(--ease)}
#slotSheet.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:0;display:flex;flex-direction:column;max-height:90vh;transition:transform 0.34s var(--ease);box-shadow:0 -24px 60px rgba(20,16,8,0.18)}
@media(min-width:761px){
  .sheet{border-radius:var(--r-lg);bottom:auto;top:50%;transform:translate(-50%, -40%);max-height:85vh}
  #slotSheet.show .sheet{transform:translate(-50%, -50%)}
}
@media(max-width:760px){
  #slotSheet.show .sheet{transform:translateX(-50%) translateY(0)}
}
.sheet-handle{width:44px;height:5px;background:var(--border2);border-radius:3px;margin:8px auto 0}
@media(min-width:761px){.sheet-handle{display:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);flex:0 0 auto}
.sheet-head h3{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:20px;letter-spacing:0.14em;color:var(--txt);font-weight:400}
.sheet-close{background:transparent;border:none;color:var(--txt3);cursor:pointer;padding:6px;border-radius:6px;transition:all 0.12s;display:flex;align-items:center;justify-content:center}
.sheet-close:hover{background:var(--bg3);color:var(--txt)}
.sheet-body{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex:1 1 auto;min-height:0}

/* FIELDS */
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-size:10px;letter-spacing:0.14em;color:var(--txt3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.fld label .hint{font-size:9px;color:var(--txt3);text-transform:none;letter-spacing:0.04em;font-weight:300}
.fld input[type="date"],.fld input[type="time"],.fld input[type="number"],.fld input[type="text"],.fld select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:14px;padding:11px 14px;border-radius:8px;outline:none;transition:all 0.12s;letter-spacing:0.02em;-webkit-appearance:none;-moz-appearance:none;appearance:none}
.fld input::-webkit-calendar-picker-indicator,.fld input::-webkit-date-and-time-value{filter:invert(0.7)}
.fld input:focus,.fld select:focus{border-color:var(--accent);background:var(--bg4);box-shadow:0 0 0 4px rgba(10,132,255,0.15)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.row2{grid-template-columns:1fr}}

/* SEGMENTED CONTROL (iOS-style) */
.segmented{display:grid;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:3px;gap:0;position:relative}
.segmented[data-count="2"]{grid-template-columns:1fr 1fr}
.segmented[data-count="3"]{grid-template-columns:1fr 1fr 1fr}
.segmented label{cursor:pointer;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:11px;letter-spacing:0.06em;padding:8px 10px;border-radius:6px;text-align:center;color:var(--txt2);transition:all 0.18s var(--ease);text-transform:uppercase;background:transparent}
.segmented input{position:absolute;opacity:0;pointer-events:none}
.segmented input:checked + label{background:var(--bg);color:var(--txt);box-shadow:0 1px 3px rgba(20,16,8,0.08)}
.segmented label:hover{color:var(--txt)}

/* DAY PICKER (recurrence) */
.day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-picker button{background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:11px;padding:10px 0;border-radius:6px;cursor:pointer;transition:all 0.12s;letter-spacing:0.04em;text-transform:uppercase}
.day-picker button:hover{border-color:var(--txt3);color:var(--txt)}
.day-picker button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* QUICK BUTTONS */
.quick-row{display:flex;gap:6px;flex-wrap:wrap}
.quick-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:10px;padding:6px 11px;border-radius:999px;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;transition:all 0.12s}
.quick-btn:hover{border-color:var(--txt3);color:var(--txt)}

.sheet-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:var(--bg2);flex:0 0 auto}
.sheet-foot .btn{flex:1;padding:13px 16px;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);color:var(--txt);transition:all 0.12s;font-weight:500}
.sheet-foot .btn:hover{background:var(--bg4)}
.sheet-foot .btn.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);flex:1.5}
.sheet-foot .btn.btn-primary:hover{background:#0a7aff}
.sheet-foot .btn[disabled]{opacity:0.5;cursor:not-allowed}

.flash{padding:11px 14px;border-radius:8px;font-size:12px;letter-spacing:0.04em;text-align:center}
.flash.ok{background:rgba(48,209,88,0.12);color:var(--ok);border:1px solid rgba(48,209,88,0.25)}
.flash.err{background:rgba(255,69,58,0.12);color:#ff453a;border:1px solid rgba(255,69,58,0.25)}

.empty-state{text-align:center;padding:60px 24px;color:var(--txt3);font-size:13px;line-height:1.7;letter-spacing:0.04em;background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--r-lg)}
.empty-state svg{color:var(--txt3);margin-bottom:12px}
.empty-state h3{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:20px;letter-spacing:0.14em;color:var(--txt);margin-bottom:8px;font-weight:400}

.gate-msg{text-align:center;padding:80px 24px;color:var(--txt3);font-size:13px;line-height:1.7}
.gate-msg a{color:var(--accent);border-bottom:1px solid currentColor}
</style>
</head>
<body data-theme="dark">

<nav>
  <a class="nav-logo" href="/">inklink</a>
  <div class="nav-icons">
    <a class="nav-icon" href="/" title="Back"><svg class="icon"><use href="#i-arrow-left"/></svg></a>
  </div>
</nav>

<div class="wrap">

  <div id="gate" class="gate-msg" style="display:none">
    This page is artist-only.<br>
    <a href="/artist-setup" data-i18n="cal.becomeArtist">Become an artist →</a>
  </div>

  <div id="cal" style="display:none">
    <div class="cal-hero">
      <div>
        <h1 data-i18n="cal.pageTitle">My calendar</h1>
        <div class="sub" id="weekRange" data-i18n="cal.loading">Loading…</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <!-- Akce se zakládají na /events, kde je celý formulář (místo, mapa,
             fotky). Duplikovat ho sem by znamenalo dvě místa k opravě. -->
        <a class="add-event-link" href="/events" data-i18n="cal.addEvent">+ Event</a>
        <div class="week-nav">
          <button onclick="shiftWeek(-1)" data-i18n-attr="cal.prevWeek:title" title="Previous week"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
          <span class="label" id="weekLabel" data-i18n="cal.week">Week</span>
          <button class="today" onclick="goToToday()" data-i18n="cal.today">Today</button>
          <button onclick="shiftWeek(1)" data-i18n-attr="cal.nextWeek:title" title="Next week"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
        </div>
      </div>
    </div>

    <div class="week-grid" id="weekGrid"></div>

    <div id="emptyHint" class="empty-state" style="display:none">
      <svg class="icon icon-xl" style="width:32px;height:32px"><use href="#i-calendar"/></svg>
      <h3 data-i18n="cal.emptyTitle">No slots</h3>
      <p><span data-i18n="cal.emptyBody">You have no open slots this week. Add them with the + button at the bottom right.</span></p>
    </div>
  </div>
</div>

<button class="fab-add-slot" id="fabAddSlot" onclick="openSlotSheet()" data-i18n-attr="cal.addSlot:title,cal.addSlot:aria-label" title="Add slot" aria-label="Add slot"><span>+</span></button>

<!-- Sheet Modal — Apple-style -->
<div id="slotSheet" onclick="if(event.target===this)closeSlotSheet()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3 id="ssTitle">NOVÝ TERMÍN</h3>
      <button class="sheet-close" type="button" onclick="closeSlotSheet()" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <form id="slotSheetForm" class="sheet-body">
      <!-- Termín = tady se dá rezervovat. Blokace = tady nejsem. -->
      <div class="fld">
        <div class="segmented" data-count="2">
          <input type="radio" name="sheetMode" id="modeSlot" value="slot" checked>
          <label for="modeSlot" data-i18n="cal.freeSlot">Open slot</label>
          <input type="radio" name="sheetMode" id="modeBlock" value="block">
          <label for="modeBlock" data-i18n="cal.blockTime">Time off</label>
        </div>
      </div>

      <div class="fld">
        <label>Date</label>
        <input type="date" id="ssDate" required>
      </div>

      <div class="row2">
        <div class="fld">
          <label>Od</label>
          <input type="time" id="ssFrom" required value="10:00" step="900">
        </div>
        <div class="fld">
          <label>Do</label>
          <input type="time" id="ssTo" required value="18:00" step="900">
        </div>
      </div>

      <div class="quick-row">
        <button type="button" class="quick-btn" onclick="setTimes('09:00','13:00')" data-i18n="cal.morning">Morning</button>
        <button type="button" class="quick-btn" onclick="setTimes('13:00','18:00')" data-i18n="cal.afternoon">Afternoon</button>
        <button type="button" class="quick-btn" onclick="setTimes('09:00','18:00')">All day</button>
        <button type="button" class="quick-btn" onclick="setTimes('17:00','21:00')">Evening</button>
      </div>

      <!-- Blokace: jen důvod, žádné ceny ani opakování -->
      <div id="blockOnlyFields" style="display:none">
        <div class="fld">
          <label><span data-i18n="cal.fReason">Reason</span> <span class="hint" data-i18n="cal.reasonHint">— optional, only you see it</span></label>
          <input type="text" id="ssBlockReason" maxlength="200" data-i18n-attr="cal.reasonPh:placeholder" placeholder="Holiday, doctor, personal">
        </div>
      </div>

      <div id="slotOnlyFields">
      <div class="row2">
        <div class="fld">
          <label>Rate from (CZK/h)</label>
          <input type="number" id="ssPriceMin" min="0" placeholder="1200">
        </div>
        <div class="fld">
          <label>Rate to (CZK/h)</label>
          <input type="number" id="ssPriceMax" min="0" placeholder="1800">
        </div>
      </div>

      <div class="row2">
        <div class="fld">
          <label data-i18n="cal.fMinBooking">Min. booking (h)</label>
          <input type="number" id="ssMinDur" min="1" max="12" value="1">
        </div>
        <div class="fld">
          <label><span data-i18n="cal.fDeposit">Deposit %</span> <span class="hint" data-i18n="cal.optional">— optional</span></label>
          <input type="number" id="ssDeposit" min="0" max="100" placeholder="30">
        </div>
      </div>

      <div class="fld">
        <label><span data-i18n="cal.fNote">Note</span> <span class="hint" data-i18n="cal.optional">— optional</span></label>
        <input type="text" id="ssNote" maxlength="200" data-i18n-attr="cal.notePh:placeholder" placeholder="Realism, consultation first">
      </div>

      <!-- Recurrence -->
      <div class="fld">
        <label data-i18n="cal.repeat">Repeat</label>
        <div class="segmented" data-count="2">
          <input type="radio" name="recurType" id="recurNone" value="none" checked>
          <label for="recurNone" data-i18n="cal.repeatOnce">One-off</label>
          <input type="radio" name="recurType" id="recurWeekly" value="weekly">
          <label for="recurWeekly" data-i18n="cal.repeatWeekly">Weekly</label>
        </div>
      </div>

      <div id="recurOptions" style="display:none;flex-direction:column;gap:14px">
        <div class="fld">
          <label data-i18n="cal.weekdays">Days of the week</label>
          <div class="day-picker" id="recurDays">
            <button type="button" data-day="0">PO</button>
            <button type="button" data-day="1">ÚT</button>
            <button type="button" data-day="2">ST</button>
            <button type="button" data-day="3">ČT</button>
            <button type="button" data-day="4">PÁ</button>
            <button type="button" data-day="5">SO</button>
            <button type="button" data-day="6">NE</button>
          </div>
        </div>
        <div class="quick-row">
          <button type="button" class="quick-btn" onclick="setRecurDays([0,1,2,3,4])" data-i18n="cal.workdays">Weekdays</button>
          <button type="button" class="quick-btn" onclick="setRecurDays([5,6])" data-i18n="cal.weekend">Weekend</button>
          <button type="button" class="quick-btn" onclick="setRecurDays([0,1,2,3,4,5,6])" data-i18n="cal.wholeWeek">Whole week</button>
        </div>
        <div class="fld">
          <label data-i18n="cal.repeatUntil">Repeat until</label>
          <input type="date" id="recurUntil">
        </div>
      </div>

      <details style="margin-top:2px">
        <summary style="cursor:pointer;font-size:12px;letter-spacing:0.08em;color:var(--txt3);text-transform:uppercase" data-i18n="cal.advanced">Advanced</summary>
        <div class="row2" style="margin-top:12px">
          <div class="fld">
            <label data-i18n="cal.bufBefore">Buffer before (min)</label>
            <input type="number" id="ssBufBefore" min="0" max="240" value="0">
          </div>
          <div class="fld">
            <label data-i18n="cal.bufAfter">Buffer after (min)</label>
            <input type="number" id="ssBufAfter" min="0" max="240" value="0">
          </div>
        </div>
        <div class="hint" style="margin-top:-6px" data-i18n="cal.bufHint">Gap between bookings — time to clean up and set up.</div>
      </details>
      </div><!-- /slotOnlyFields -->

      <div id="ssFlash"></div>
    </form>

    <div class="sheet-foot">
      <button type="button" class="btn" onclick="closeSlotSheet()">Cancel</button>
      <button type="button" class="btn btn-primary" id="ssSubmit" onclick="submitSlot()" data-i18n="cal.save">Save slot</button>
    </div>
  </div>
</div>

<script>
let me = null;
let weekStart = startOfWeek(new Date());  // monday
const t = k => window.InkLinkI18N ? window.InkLinkI18N.t(k) : k;
function locale(){ return (window.InkLinkI18N ? InkLinkI18N.get() : 'en') === 'cs' ? 'cs-CZ' : 'en-GB'; }
// Mřížka se skládá v JS — po přepnutí jazyka ji musíme překreslit.
document.addEventListener('il-i18n-applied', () => { if (typeof render === 'function' && slotsData) render(); });

let slotsData = [];
let blocksData = [];
let eventsData = [];

function escapeHtml(s){return(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function startOfWeek(d){
  const dt = new Date(d);
  const day = dt.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDate(d){
  // Lokální datum, ne UTC: toISOString() převede lokální půlnoc na UTC a
  // u kladného offsetu (Praha +1/+2) vrátí předchozí den — týdenní mřížka
  // pak řadila termíny o sloupec vedle a "dnes" se po 22:00 předvyplnilo na včerejšek.
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtDayNum(d){ return d.getDate().toString().padStart(2,'0'); }
function dayName(d){ return d.toLocaleDateString(locale(), {weekday:'short'}).replace('.','').toUpperCase(); }
function csMonth(d){ return d.toLocaleDateString(locale(), {month:'long'}); }
function fmtTime(iso){ const d = new Date(iso); return d.toTimeString().slice(0,5); }

async function init() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);
  if (!me) { location.href = '/login'; return; }
  // #navAvatar itself is owned by nav-avatar.js (InkLinkNavAvatar.init()) — don't touch it here.
  if (!me.is_artist) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('fabAddSlot').style.display = 'none';
    return;
  }
  document.getElementById('cal').style.display = 'block';

  // Default form date = today
  document.getElementById('ssDate').value = fmtDate(new Date());

  // Recurrence toggle
  document.querySelectorAll('input[name="recurType"]').forEach(r => {
    r.addEventListener('change', () => {
      document.getElementById('recurOptions').style.display = r.value === 'weekly' ? 'flex' : 'none';
    });
  });
  // Day picker click
  document.querySelectorAll('#recurDays button').forEach(b => {
    b.addEventListener('click', () => b.classList.toggle('on'));
  });

  await loadWeek();
}

async function loadWeek() {
  // Akce se narozdíl od slotů a blokací tahají po týdnech — proto se
  // loadWeek() volá i při přepnutí týdne, ne jen při startu.
  const from = fmtDate(weekStart), to = fmtDate(addDays(weekStart, 6));
  const [rSlots, rBlocks, rEvents] = await Promise.all([
    fetch('/api/me/slots'),
    fetch('/api/me/blocked-time'),
    fetch(`/api/events?from=${from}&to=${to}`),
  ]);
  slotsData = rSlots.ok ? await rSlots.json() : [];
  blocksData = rBlocks.ok ? await rBlocks.json() : [];
  // V mřížce tatéra jen jeho vlastní akce. Cizí akce jsou na /events —
  // tady by z kalendáře udělaly nástěnku.
  eventsData = rEvents.ok ? (await rEvents.json()).filter(e => e.is_own) : [];
  render();
}

function render() {
  const grid = document.getElementById('weekGrid');
  const weekEnd = addDays(weekStart, 6);
  const today = new Date(); today.setHours(0,0,0,0);

  document.getElementById('weekLabel').textContent = `${weekStart.getDate()}.${weekStart.getMonth()+1}. – ${weekEnd.getDate()}.${weekEnd.getMonth()+1}.`;
  document.getElementById('weekRange').textContent = `${csMonth(weekStart)} ${weekStart.getFullYear()}`;

  const slotsByDay = {};
  for (const s of slotsData) {
    const dayKey = s.start_at.slice(0,10);
    (slotsByDay[dayKey] = slotsByDay[dayKey] || []).push(s);
  }
  const blocksByDay = {};
  for (const b of blocksData) {
    const dayKey = b.start_at.slice(0,10);
    (blocksByDay[dayKey] = blocksByDay[dayKey] || []).push(b);
  }
  const eventsByDay = {};
  for (const e of eventsData) {
    (eventsByDay[e.date] = eventsByDay[e.date] || []).push(e);
  }

  grid.innerHTML = '';
  let totalSlots = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i);
    const key = fmtDate(d);
    const isToday = d.getTime() === today.getTime();
    const isPast = d < today;
    const daySlots = (slotsByDay[key] || []).sort((a,b) => a.start_at.localeCompare(b.start_at));
    const dayBlocks = (blocksByDay[key] || []).sort((a,b) => a.start_at.localeCompare(b.start_at));
    const dayEvents = (eventsByDay[key] || []).sort((a,b) => (a.time||'').localeCompare(b.time||''));
    totalSlots += daySlots.length;
    const blockPills = dayBlocks.map(b => `
              <div class="slot-pill blocked" style="opacity:0.72;border-style:dashed">
                <span class="t">${fmtTime(b.start_at)}–${fmtTime(b.end_at)}</span>
                <span class="p">${b.reason ? escapeHtml(b.reason) : t('cal.block')}</span>
                <button class="del" onclick="event.stopPropagation();delBlock(${b.id})" title="${t('cal.deleteBlock')}">×</button>
              </div>`).join('');
    const eventPills = dayEvents.map(e => `
              <div class="slot-pill event" onclick="location.href='/events'" title="${escapeHtml(e.title)}${e.venue ? ' · ' + escapeHtml(e.venue) : ''}">
                <span class="t">${e.time ? escapeHtml(e.time.slice(0,5)) : t('cal.event')}</span>
                <span class="p">${escapeHtml(e.title)}</span>
              </div>`).join('');
    grid.innerHTML += `
      <div class="day-col${isToday ? ' today' : ''}${isPast ? ' past' : ''}">
        <div class="day-head">
          <div class="day-name">${dayName(d)}</div>
          <div class="day-num">${fmtDayNum(d)}</div>
        </div>
        ${eventPills}
        ${blockPills}
        ${daySlots.length
          ? daySlots.map(s => `
              <div class="slot-pill ${s.status==='booked'?'booked':''}">
                <span class="t">${fmtTime(s.start_at)}–${fmtTime(s.end_at)}</span>
                <span class="p">${s.price_min || s.price_max ? `${s.price_min||0}–${s.price_max||0} CZK/h` : t('cal.priceOnRequest')}</span>
                ${s.status === 'free' ? `<button class="del" onclick="event.stopPropagation();delSlot(${s.id})" title="${t('cal.delete')}">×</button>` : ''}
              </div>`).join('')
          : ((dayBlocks.length || dayEvents.length) ? '' : (isPast
              ? '<div style="color:var(--txt4);font-size:10px;text-align:center;padding:8px 0;letter-spacing:0.06em">—</div>'
              : `<div class="empty-day" onclick="openSlotSheetForDay('${key}')">${t('cal.slotEmptyDay')}</div>`))
        }
      </div>`;
  }
  document.getElementById('emptyHint').style.display = totalSlots === 0 ? 'block' : 'none';
}

function shiftWeek(dir) {
  weekStart = addDays(weekStart, dir * 7);
  loadWeek();
}
function goToToday() {
  weekStart = startOfWeek(new Date());
  loadWeek();
}

function openSlotSheet() {
  document.getElementById('slotSheet').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function openSlotSheetForDay(dateStr) {
  document.getElementById('ssDate').value = dateStr;
  openSlotSheet();
}
function closeSlotSheet() {
  document.getElementById('slotSheet').classList.remove('show');
  document.body.style.overflow = '';
  document.getElementById('ssFlash').innerHTML = '';
}

function setTimes(from, to) {
  document.getElementById('ssFrom').value = from;
  document.getElementById('ssTo').value = to;
}
function setRecurDays(arr) {
  document.querySelectorAll('#recurDays button').forEach(b => {
    const day = parseInt(b.dataset.day);
    b.classList.toggle('on', arr.includes(day));
  });
}

function currentSheetMode() {
  const el = document.querySelector('input[name="sheetMode"]:checked');
  return el ? el.value : 'slot';
}

function applySheetMode() {
  const isBlock = currentSheetMode() === 'block';
  document.getElementById('slotOnlyFields').style.display = isBlock ? 'none' : '';
  document.getElementById('blockOnlyFields').style.display = isBlock ? '' : 'none';
  document.getElementById('ssTitle').textContent = isBlock ? t('cal.blockTime') : t('cal.newSlot');
  document.getElementById('ssSubmit').textContent = isBlock ? t('cal.saveBlock') : t('cal.save');
}

async function submitSlot() {
  const flash = document.getElementById('ssFlash');
  const btn = document.getElementById('ssSubmit');
  const date = document.getElementById('ssDate').value;
  const from = document.getElementById('ssFrom').value;
  const to = document.getElementById('ssTo').value;
  if (!date || !from || !to) {
    flash.innerHTML = `<div class="flash err">${t('cal.needDateTime')}</div>`; return;
  }
  if (from >= to) {
    flash.innerHTML = `<div class="flash err">${t('cal.endAfterStart')}</div>`; return;
  }
  if (currentSheetMode() === 'block') { return submitBlock(); }

  btn.disabled = true; btn.textContent = t('cal.saving');
  const start_at = `${date}T${from}:00`;
  const end_at = `${date}T${to}:00`;

  const body = {
    start_at, end_at,
    price_min: document.getElementById('ssPriceMin').value || 0,
    price_max: document.getElementById('ssPriceMax').value || 0,
    deposit_pct: document.getElementById('ssDeposit').value || null,
    min_duration_hours: document.getElementById('ssMinDur').value || 1,
    price_unit: 'hour',
    note: document.getElementById('ssNote').value || '',
    buffer_before_minutes: document.getElementById('ssBufBefore').value || 0,
    buffer_after_minutes: document.getElementById('ssBufAfter').value || 0,
  };

  // Recurrence
  const recurType = document.querySelector('input[name="recurType"]:checked').value;
  if (recurType === 'weekly') {
    const days = Array.from(document.querySelectorAll('#recurDays button.on')).map(b => parseInt(b.dataset.day));
    const until = document.getElementById('recurUntil').value;
    if (!days.length || !until) {
      flash.innerHTML = `<div class="flash err">${t('cal.needRecurDays')}</div>`;
      btn.disabled = false; btn.textContent = t('cal.save');
      return;
    }
    body.recur = { days, until };
  }

  try {
    const r = await fetch('/api/slots', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (r.ok) {
      const j = await r.json();
      const warns = j.holiday_warnings || [];
      const warnTxt = warns.length
        ? `<div class="flash" style="margin-top:6px">${t('cal.holidayWarn')
             .replace('{names}', warns.map(w => escapeHtml(w.name)).join(', '))}</div>`
        : '';
      const n = j.created || 1;
      const okTxt = n === 1 ? t('cal.createdOne') : t('cal.createdMany').replace('{n}', n);
      flash.innerHTML = `<div class="flash ok">${okTxt}</div>${warnTxt}`;
      setTimeout(() => {
        closeSlotSheet();
        // Reset
        document.querySelector('input[name="recurType"][value="none"]').checked = true;
        document.getElementById('recurOptions').style.display = 'none';
        document.querySelectorAll('#recurDays button.on').forEach(b => b.classList.remove('on'));
        document.getElementById('ssNote').value = '';
        loadWeek();
      }, warns.length ? 2600 : 700);  // varování o svátku si musí stihnout přečíst
    } else {
      const j = await r.json().catch(() => ({}));
      flash.innerHTML = `<div class="flash err">${escapeHtml(j.error || t('cal.errSave'))}</div>`;
    }
  } catch {
    flash.innerHTML = `<div class="flash err">${t('cal.errNetwork')}</div>`;
  }
  btn.disabled = false; btn.textContent = t('cal.save');
}

async function submitBlock() {
  const flash = document.getElementById('ssFlash');
  const btn = document.getElementById('ssSubmit');
  const date = document.getElementById('ssDate').value;
  const from = document.getElementById('ssFrom').value;
  const to = document.getElementById('ssTo').value;

  btn.disabled = true; btn.textContent = t('cal.saving');
  try {
    const r = await fetch('/api/blocked-time', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        start_at: `${date}T${from}:00`,
        end_at: `${date}T${to}:00`,
        reason: document.getElementById('ssBlockReason').value || '',
      }),
    });
    if (r.ok) {
      flash.innerHTML = `<div class="flash ok">${t('cal.okBlock')}</div>`;
      setTimeout(() => {
        closeSlotSheet();
        document.getElementById('ssBlockReason').value = '';
        loadWeek();
      }, 700);
    } else {
      const j = await r.json().catch(() => ({}));
      flash.innerHTML = `<div class="flash err">${escapeHtml(j.error || t('cal.errBlock'))}</div>`;
    }
  } catch {
    flash.innerHTML = `<div class="flash err">${t('cal.errNetwork')}</div>`;
  }
  btn.disabled = false;
  applySheetMode();
}

async function delSlot(id) {
  if (!confirm(t('cal.confirmDelSlot'))) return;
  const r = await fetch('/api/slots/' + id, {method:'DELETE'});
  if (r.ok) await loadWeek();
  else alert((await r.json()).error || t('cal.errDelete'));
}

async function delBlock(id) {
  if (!confirm(t('cal.confirmDelBlock'))) return;
  const r = await fetch('/api/blocked-time/' + id, {method:'DELETE'});
  if (r.ok) await loadWeek();
  else alert((await r.json().catch(() => ({}))).error || t('cal.errDelete'));
}

document.querySelectorAll('input[name="sheetMode"]').forEach(el => {
  el.addEventListener('change', applySheetMode);
});

init();
</script>

</body>
