<title>InkLink — Sign in</title>
<meta name="description" content="Sign in or create your InkLink account — find an artist, book an appointment, pay safely.">
<meta property="og:title" content="InkLink — Tattoo Booking Network">
<meta property="og:description" content="Find an artist, browse portfolios, book with a deposit.">

<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;--red3: #000;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--red)}

.brand{display:block;height:70px;width:auto;margin:0 auto 4px;object-fit:contain}
.brand-sub{font-size:10px;color:var(--txt3);letter-spacing:0.15em;text-align:center;margin-bottom:40px;text-transform:uppercase}

.card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border2)}

.tabs{display:flex;border-bottom:1px solid var(--border2)}
.tab{flex:1;padding:14px;text-align:center;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--txt3);cursor:pointer;transition:all 0.15s;border:none;background:none;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif}
.tab.active{color:var(--red2);border-bottom:2px solid var(--red2)}
.tab:hover:not(.active){color:var(--txt2)}

.form{padding:28px;display:none;flex-direction:column;gap:16px}
.form.active{display:flex}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--txt3)}
.field input,.field select{background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;padding:10px 14px;letter-spacing:0.05em;outline:none;transition:border-color 0.2s;width:100%}
.field input::placeholder{color:var(--txt3)}
.field input:focus{border-color:var(--red)}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.submit-btn{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:15px;letter-spacing:0.15em;padding:14px;background:var(--red2);color:white;border:none;cursor:pointer;transition:all 0.15s;margin-top:4px}
.submit-btn:hover{background:var(--red3)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}

.error-msg{font-size:11px;color:#e58787;letter-spacing:0.04em;padding:10px 14px;background:rgba(204,68,68,0.1);border:1px solid rgba(204,68,68,0.3);display:none}
.error-msg.visible{display:block}
.submit-btn{background:var(--red2);color:var(--bg)}
.submit-btn:hover{background:var(--red3)}

.hint{font-size:9px;color:var(--txt3);letter-spacing:0.04em;line-height:1.6;text-align:center;margin-top:8px}

.auth-back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border2);border-radius:50%;color:var(--txt2);text-decoration:none;z-index:100;transition:background 0.15s,color 0.15s,border-color 0.15s;-webkit-tap-highlight-color:transparent}
.auth-back:hover{background:var(--bg3);color:var(--txt);border-color:var(--txt3)}
.auth-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div id="il-brand-splash" aria-hidden="true"><img src="/img/ink-logo.png" alt=""></div>
<style>#il-brand-splash{position:fixed;inset:0;background:#faf8f3;z-index:2147483000;display:flex;align-items:flex-start;justify-content:center;padding-top:34vh;pointer-events:none;transition:opacity .3s ease}#il-brand-splash img{width:40vmin;max-width:280px;max-height:30vh;object-fit:contain}#il-brand-splash.hide{opacity:0}html:not(.capacitor-app) #il-brand-splash{display:none}</style>
<a class="auth-back" href="/landing" aria-label="Back to home">
  <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<img class="brand" src="/img/inklink-logo.png" alt="inklink">

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign in</button>
    <button class="tab" onclick="switchTab('register')">Register</button>
  </div>

  <!-- LOGIN -->
  <form class="form active" id="loginForm" onsubmit="doLogin(event)">
    <div class="error-msg" id="loginError"></div>
    <div class="field">
      <label>Email, phone, or username</label>
      <input type="text" id="loginUsername" placeholder="you@email.com" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password" required>
    </div>
    <button class="submit-btn" type="submit" id="loginBtn">SIGN IN</button>
    <div class="hint"><a href="/forgot-password" style="color:var(--txt3)">Forgot password?</a></div>
  </form>

  <!-- REGISTER -->
  <form class="form" id="registerForm" onsubmit="doRegister(event)">
    <div class="error-msg" id="registerError"></div>
    <div id="refBanner" style="display:none;background:#0e0e0e;border:1px solid #2a2a2a;border-left:3px solid #c62828;padding:12px 14px;margin-bottom:14px;font-size:12px;color:#bbb;letter-spacing:0.03em;line-height:1.6">
      <span style="color:#eee">Invited by <b id="refBy">—</b></span> · they get a 300 CZK bonus after your first booking.
    </div>
    <div class="field">
      <label>Username *</label>
      <input type="text" id="regUsername" placeholder="letters and numbers only" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Name *</label>
      <input type="text" id="regDisplayName" placeholder="How others will see you" required>
    </div>
    <div class="field">
      <label>Email *</label>
      <input type="email" id="regEmail" placeholder="you@email.com" autocomplete="email" required>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Phone (optional)</label>
        <input type="tel" id="regPhone" placeholder="+420 xxx xxx xxx" autocomplete="tel">
      </div>
      <div class="field">
        <label>City (optional)</label>
        <input type="text" id="regCity" placeholder="Prague, Brno…">
      </div>
    </div>
    <div class="field">
      <label>Password * (min 6 chars)</label>
      <input type="password" id="regPassword" placeholder="••••••" autocomplete="new-password" required>
    </div>
    <div class="field" style="flex-direction:row;align-items:flex-start;gap:10px">
      <input type="checkbox" id="regTerms" required style="width:auto;margin-top:2px;accent-color:var(--red2)">
      <label for="regTerms" style="font-size:10px;color:var(--txt3);letter-spacing:0.04em;line-height:1.6;text-transform:none;cursor:pointer">I agree to the <a href="/terms" style="color:var(--txt2)" target="_blank">terms</a> and <a href="/privacy" style="color:var(--txt2)" target="_blank">privacy policy</a></label>
    </div>
    <button class="submit-btn" type="submit" id="registerBtn">CREATE ACCOUNT</button>
    <div class="hint" id="registerHint">You can become an artist later in Artist settings (after login).</div>
  </form>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='login')));
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');
}

// Read ?ref= from URL — show banner + remember for register POST.
const refFromUrl = (new URLSearchParams(location.search).get('ref') || '').trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,30);
if (refFromUrl) {
  document.getElementById('refBy').textContent = '@' + refFromUrl;
  document.getElementById('refBanner').style.display = 'block';
  // Auto-switch to register tab when arriving with a ref link.
  try { switchTab('register'); } catch {}
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('visible');
}
function hideError(id) {
  document.getElementById(id).classList.remove('visible');
}

// Kam po přihlášení. Bereme jen cestu na vlastním webu — „//zlo.cz" a
// „https://zlo.cz" jsou platné hodnoty pro prohlížeč, ne pro nás.
function nextAfterLogin() {
  const n = new URLSearchParams(location.search).get('next');
  return (n && n.startsWith('/') && !n.startsWith('//')) ? n : '/';
}

async function doLogin(e) {
  e.preventDefault();
  hideError('loginError');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'SIGNING IN…';

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('loginUsername').value,
      password: document.getElementById('loginPassword').value
    })
  });
  const data = await res.json();

  if (data.ok) {
    window.location.href = nextAfterLogin();
  } else {
    showError('loginError', data.error || 'Sign in failed');
    btn.disabled = false;
    btn.textContent = 'SIGN IN';
  }
}

async function doRegister(e) {
  e.preventDefault();
  hideError('registerError');
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.textContent = 'CREATING…';

  const res = await fetch('/api/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username:     document.getElementById('regUsername').value,
      display_name: document.getElementById('regDisplayName').value,
      email:        document.getElementById('regEmail').value,
      phone:        document.getElementById('regPhone').value,
      city:         document.getElementById('regCity').value,
      password:     document.getElementById('regPassword').value,
      ref:          refFromUrl || ''
    })
  });
  const data = await res.json();

  if (data.ok) {
    try { localStorage.setItem('inklink_show_welcome', '1'); } catch {}
    window.location.href = data.verify ? '/verify' : '/';
  } else {
    showError('registerError', data.error || 'Registrace selhala');
    btn.disabled = false;
    btn.textContent = 'CREATE ACCOUNT';
  }
}
</script>
