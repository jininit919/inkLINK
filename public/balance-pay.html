<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<style>html,body{background:#faf8f3;margin:0}</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#faf8f3">
<meta name="apple-mobile-web-app-title" content="InkLink — Balance">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tattoo balance — InkLink</title>
<meta name="robots" content="noindex">
<script>document.documentElement.dataset.theme='paper';try{localStorage.setItem('hmo_theme','paper')}catch(e){}</script>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
  --ok:#7fd391;--err:#e58787;--warn:#e8c87f;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px}
.brand{display:block;height:56px;width:auto;margin:24px auto 4px;object-fit:contain}
.brand-sub{font-size:10px;color:var(--txt3);letter-spacing:0.15em;text-align:center;margin-bottom:48px}

.card{width:100%;max-width:440px;background:var(--bg2);border:1px solid var(--border)}
.card-head{padding:24px;border-bottom:1px solid var(--border)}
.card-head h1{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:24px;letter-spacing:0.12em;margin-bottom:6px}
.card-head .sub{font-size:12px;color:var(--txt3);letter-spacing:0.05em}
.card-body{padding:24px}

.who{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--bg4);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--red2);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.who-info .n{font-size:14px;color:var(--txt)}
.who-info .s{font-size:11px;color:var(--txt3);letter-spacing:0.04em}

.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:12px;border-bottom:1px solid var(--border2);letter-spacing:0.04em}
.kv .k{color:var(--txt3)}
.kv .v{color:var(--txt)}

.amount{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:48px;letter-spacing:0.04em;color:var(--red2);text-align:center;margin:24px 0;line-height:1}
.amount .unit{font-size:18px;color:var(--txt3);margin-left:6px}

.note{margin-top:14px;padding:12px;background:var(--bg3);border-left:2px solid var(--red);font-size:12px;color:var(--txt2);line-height:1.5;letter-spacing:0.03em;white-space:pre-wrap;word-break:break-word}

.btn{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:16px;letter-spacing:0.15em;padding:14px;background:var(--red2);color:var(--bg);border:none;cursor:pointer;width:100%;margin-top:18px}
.btn:hover{filter:brightness(0.92)}
.btn:disabled{opacity:0.5;cursor:not-allowed}

.demo-banner{background:rgba(232,200,127,0.1);border:1px solid rgba(232,200,127,0.3);padding:10px 14px;color:var(--warn);font-size:11px;letter-spacing:0.04em;margin-top:14px;line-height:1.5}
.success-banner{background:rgba(127,211,145,0.08);border:1px solid rgba(127,211,145,0.3);padding:14px;color:var(--ok);font-size:13px;letter-spacing:0.04em;text-align:center;margin-top:14px}

.foot-link{margin-top:24px;font-size:11px;color:var(--txt3);letter-spacing:0.04em;text-align:center}
.foot-link a{color:var(--txt3)}

.loading{text-align:center;padding:60px 20px;color:var(--txt3);font-size:13px}
.error-card{padding:24px;text-align:center;color:var(--err)}
</style>
</head>
<body>

<img class="brand" src="/img/inklink-logo.png" alt="inklink">
<div class="brand-sub">Tattoo balance</div>

<div class="card" id="card">
  <div class="il-loading-row"><span class="il-spinner"></span> Loading details…</div>
</div>

<div class="foot-link">
  <a href="/"><svg class="icon icon-sm" style="vertical-align:-2px;margin-right:5px"><use href="#i-arrow-left"/></svg>Back to InkLink</a>
</div>

<script>
const bid = parseInt(location.pathname.replace(/^\/balance-pay\//, '').split('/')[0] || '0');

function fmtKc(c) { return c ? `${(c/100).toLocaleString('cs-CZ')} CZK` : '0 CZK'; }
function fmtDt(iso){
  try { const d = new Date(iso);
    return d.toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'})
         + ' · ' + d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
  } catch { return iso || ''; }
}
function escapeHtml(s){return(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function load() {
  if (!bid) return showError('Missing booking ID.');
  const r = await fetch('/api/balance-pay/' + bid);
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    return showError(j.error || 'Balance not found.');
  }
  const d = await r.json();
  render(d);
}

function showError(msg) {
  document.getElementById('card').innerHTML = `<div class="error-card">${escapeHtml(msg)}</div>`;
}

function render(d) {
  const ava = d.artist_avatar_url
    ? `<img src="${escapeHtml(d.artist_avatar_url)}" alt="">`
    : escapeHtml((d.artist_name || '?').slice(0,2).toUpperCase());

  const isPaid = d.already_paid_in_full;
  const amount = isPaid ? d.paid_cents : d.amount_cents;
  const headLabel = isPaid ? 'BALANCE PAID' : 'TATTOO BALANCE';

  document.getElementById('card').innerHTML = `
    <div class="card-head">
      <h1>${headLabel}</h1>
      <div class="sub">Booking #${d.id}</div>
    </div>
    <div class="card-body">
      <div class="who">
        <div class="avatar">${ava}</div>
        <div class="who-info">
          <div class="n">${escapeHtml(d.artist_name || '')}</div>
          <div class="s">${escapeHtml(d.artist_studio || 'artist')}</div>
        </div>
      </div>
      <div class="kv"><span class="k">Date</span><span class="v">${fmtDt(d.when)}</span></div>
      ${d.design_note ? `<div class="note">${escapeHtml(d.design_note)}</div>` : ''}
      <div class="amount">${fmtKc(amount)}</div>
      ${isPaid
        ? `<div class="success-banner">✓ Balance already paid. Thank you!</div>
           <a href="/my-bookings" class="btn" style="display:block;text-align:center;text-decoration:none;background:transparent;border:1px solid var(--border2);color:var(--txt2)">My bookings</a>`
        : `<button class="btn" id="payBtn" onclick="pay()">${d.is_demo ? 'Confirm (demo mode)' : 'Pay by card'}</button>
           ${d.is_demo
             ? `<div class="demo-banner">⚠ Demo mode — Stripe not connected. Click just marks the balance as paid, no real money is charged.</div>`
             : `<div class="demo-banner" style="background:rgba(232,232,232,0.04);border-color:var(--border2);color:var(--txt3)">Stripe Elements checkout renders here (M2). After payment, the balance in the artist report is automatically updated via webhook.</div>`}
        `}
    </div>
  `;
}

async function pay() {
  const btn = document.getElementById('payBtn');
  btn.disabled = true; btn.textContent = 'Processing…';
  const r = await fetch(`/api/balance-pay/${bid}/demo-confirm`, {method:'POST'});
  if (r.ok) {
    location.reload();  // znovunačte → success state
  } else {
    btn.disabled = false;
    btn.textContent = 'Try again';
    alert((await r.json()).error || 'Failed');
  }
}

load();
</script>
<script src="/icons.js?v=2"></script>
<script src="/ink-trail.js?v=1"></script>
<script src="/cookie-consent.js?v=1"></script>
<script src="/native.js?v=1"></script>
</body>
</html>
