<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Black shadow underlay (offset down-right for soft drop) -->
  <g fill="#000" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.55">
    <line x1="3.2" y1="3.2" x2="9.8" y2="9.8"/>
    <polygon points="6.5,9.5 10.5,5.5 18.5,13.5 14.5,17.5"/>
    <rect x="14.5" y="13.5" width="12" height="11" rx="1.5"/>
    <circle cx="19.5" cy="18.5" r="1.2"/>
    <rect x="15.5" y="24.5" width="10" height="5" rx="1.2"/>
    <path d="M 24.5 27 Q 29.5 30 30 27.5 Q 31.5 24.5 29.5 23.5" fill="none"/>
  </g>
  <!-- White foreground (the machine itself) -->
  <g fill="#fff" stroke="#fff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Needle from upper-left -->
    <line x1="2.5" y1="2.5" x2="9" y2="9" stroke-width="1.7"/>
    <!-- Tube/grip parallelogram -->
    <polygon points="6,9 10,5 18,13 14,17"/>
    <!-- Body of machine -->
    <rect x="14" y="13" width="12" height="11" rx="1.5"/>
    <!-- Adjustment knob (outline only, contrast) -->
    <circle cx="19" cy="18" r="1.2" fill="none" stroke-width="0.8"/>
    <!-- Motor cap at bottom -->
    <rect x="15" y="24" width="10" height="5" rx="1.2"/>
    <!-- Cord exiting down-right corner -->
    <path d="M 24 26.5 Q 29 29.5 29.5 27 Q 31 24 29 23" fill="none" stroke-width="1.3"/>
  </g>
</svg>
