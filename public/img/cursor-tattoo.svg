<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Drop shadow for visibility -->
  <defs>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0.6" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#s)" fill="#fff" stroke="#0a0a0c" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top motor / coil cap -->
    <rect x="15" y="2" width="9" height="5" rx="1.2"/>
    <!-- Main body of machine (rounded rectangle) -->
    <rect x="14" y="7" width="11" height="10" rx="1.4"/>
    <!-- Adjustment screw / detail on body -->
    <circle cx="19.5" cy="12" r="1.2"/>
    <!-- Tube going down-left from body -->
    <path d="M 14 13 L 7 22 L 10 25 L 17 16 Z"/>
    <!-- Needle protruding at tip (hotspot) -->
    <line x1="8" y1="24" x2="3" y2="30" stroke-width="1.5"/>
    <line x1="9" y1="25" x2="4" y2="31" stroke-width="0.7" opacity="0.6"/>
    <!-- Cord/cable exiting back-right -->
    <path d="M 22 4 Q 28 -1 30 3 Q 31 5 29 5" fill="none" stroke-width="1.1"/>
  </g>
</svg>
