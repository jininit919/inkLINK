<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lajknuté — InkLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e10;--bg2:#141416;--bg3:#1c1c1f;--bg4:#26262a;
  --red:#3a3a3e;--red2:#e8e8e8;--red3:#fff;
  --txt:#f5f5f7;--txt2:#a8a8ac;--txt3:#6e6e73;
  --border:#1c1c1f;--border2:#2a2a2e;
}
body{background:var(--bg);color:var(--txt);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--red2);border-radius:2px}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:54px;gap:0}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.2em;color:var(--red2);cursor:pointer;white-space:nowrap;flex:1}
.nav-icons{display:flex;gap:6px;align-items:center}
.nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);font-size:14px;border-radius:2px;transition:all 0.15s}
.nav-icon:hover{color:var(--red2);background:var(--bg3)}
.nav-icon.active{color:var(--red2)}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--red2);cursor:pointer;margin-left:4px;letter-spacing:0.05em;overflow:hidden}
.nav-avatar img{width:100%;height:100%;object-fit:cover}

.layout{display:grid;grid-template-columns:240px 1fr;gap:0;padding-top:54px;min-height:100vh;max-width:1200px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar-left{display:none !important}}

.sidebar-left{padding:24px 16px;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.sidebar-section{margin-bottom:26px}
.sidebar-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.18em;color:var(--txt3);margin-bottom:10px}
.sidebar-link{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt2);padding:6px 8px;cursor:pointer;letter-spacing:0.04em;border-radius:2px;text-decoration:none}
.sidebar-link:hover{background:var(--bg3);color:var(--red2)}
.sidebar-link.active{color:var(--red2);background:var(--bg3)}
.sidebar-link .icon{font-size:13px;width:16px;display:inline-block;text-align:center}

main{padding:24px 24px 80px;min-width:0}
.page-head{margin-bottom:18px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:0.18em;color:var(--red2);display:flex;align-items:center;gap:12px}
.page-title .heart{color:#e58787}
.page-sub{font-size:11px;letter-spacing:0.1em;color:var(--txt3);margin-top:6px}

.feed-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed-tabs::-webkit-scrollbar{display:none}
.feed-tab{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.18em;padding:12px 22px;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.feed-tab.active{color:var(--red2);border-bottom-color:var(--red2)}
.feed-tab:hover:not(.active){color:var(--txt)}
.feed-tab .tab-hint{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.05em;color:var(--txt3);text-transform:none}

/* Masonry feed — Pinterest-style */
.feed-grid{column-count:3;column-gap:10px}
@media(max-width:1100px){.feed-grid{column-count:2}}
@media(max-width:560px){.feed-grid{column-count:2;column-gap:6px}}

.card{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;margin-bottom:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;position:relative;overflow:hidden;cursor:pointer;transition:transform 0.25s cubic-bezier(0.32,0.72,0,1),box-shadow 0.25s,border-color 0.15s;display:block}
.card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,0.5)}
.card .img{background:var(--bg4);overflow:hidden;position:relative}
.card .img img{width:100%;height:auto;display:block;transition:transform 0.5s cubic-bezier(0.32,0.72,0,1)}
.card:hover .img img{transform:scale(1.03)}
.card-price{position:absolute;top:10px;right:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.04em;padding:5px 10px;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:6px;line-height:1.2}
.card-kind{position:absolute;top:10px;left:10px;font-size:9px;letter-spacing:0.16em;padding:4px 8px;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:4px}
.card-imgs-badge{position:absolute;bottom:10px;left:10px;font-size:10px;letter-spacing:0.06em;padding:3px 7px;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:4px;display:flex;align-items:center;gap:4px}
.card-bookcta{position:absolute;bottom:10px;right:10px;padding:8px 12px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#000;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;gap:5px;opacity:0;transform:translateY(4px);transition:opacity 0.2s,transform 0.2s;font-weight:500}
.card:hover .card-bookcta{opacity:1;transform:translateY(0)}
.card-bookcta:hover{background:#fff}
.card-bookcta .icon{width:12px;height:12px}
@media(hover:none){.card-bookcta{opacity:1;transform:none}}
.card-foot{padding:10px 12px;display:flex;align-items:center;gap:10px}
.card-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--red2);overflow:hidden;flex-shrink:0}
.card-avatar img{width:100%;height:100%;object-fit:cover}
.card-who{flex:1;min-width:0;font-size:12px;line-height:1.3}
.card-who .name{color:var(--txt);font-weight:400}
.card-who .meta{color:var(--txt3);font-size:11px;letter-spacing:0.04em}
.card-rating{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:#e8c87f;letter-spacing:0.04em;margin-left:6px;vertical-align:middle}
.card-like{font-size:14px;color:#e58787;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;padding:8px 6px;margin:-8px -6px;min-height:36px}
.card-share{font-size:14px;color:var(--txt3);cursor:pointer;display:flex;align-items:center;font-family:'DM Mono',monospace;padding:8px 8px;margin:-8px -8px;min-height:36px;transition:color 0.15s}
.card-share:hover{color:var(--red2)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);font-size:13px;letter-spacing:0.06em;padding:10px 20px;z-index:300;opacity:0;transition:all 0.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:80px 20px;color:var(--txt3);font-size:13px;letter-spacing:0.04em;line-height:1.7}
.empty .b{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.16em;color:var(--red2);display:block;margin-bottom:10px}
.empty a{color:var(--red2);text-decoration:underline}

.btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;padding:7px 14px;background:transparent;border:1px solid var(--red2);color:var(--red2);cursor:pointer;text-transform:uppercase;display:inline-block}
.btn:hover{background:var(--red2);color:var(--bg)}
</style>
</head>
<body data-theme="dark">

<nav>
  <a class="nav-logo" href="/"><svg viewBox="0 0 240 180" style="height:22px;width:auto;vertical-align:middle;margin-right:9px;display:inline-block" fill="currentColor" aria-hidden="true"><rect x="44" y="4" width="12" height="8" rx="2"/><rect x="30" y="12" width="40" height="110" rx="8"/><polygon points="38,122 62,122 54,148 46,148"/><rect x="49" y="148" width="2" height="18" rx="1"/><path fill-rule="evenodd" d="M86 10L134 10L134 130L196 130L196 158L86 158ZM93 20h14v100h-14zM113 20h14v100h-14z"/><rect x="196" y="143" width="22" height="2" rx="1"/></svg>INKLINK</a>
  <div class="nav-icons">
    <a class="nav-icon" href="/my-bookings" title="Moje rezervace"><svg class="icon"><use href="#i-bookmark"/></svg></a>
    <a class="nav-icon active" href="/liked" title="Lajknuté"><svg class="icon"><use href="#i-heart"/></svg></a>
    <div id="notifMount"></div>
    <div class="nav-avatar" id="navAvatar" title="Profil" onclick="goToProfile()">??</div>
  </div>
</nav>
<script src="/notifs.js?v=5"></script>
<script src="/mobile-nav.js?v=7"></script>
<script src="/cookie-banner.js?v=5"></script>
<script>InkLinkNotifs.init(); InkLinkMobileNav.init(); InkLinkCookieBanner.init();</script>

<div class="layout">

  <aside class="sidebar-left">
    <div class="sidebar-section">
      <div class="sidebar-label">Menu</div>
      <a class="sidebar-link" href="/"><span class="icon">⌂</span> Feed</a>
      <a class="sidebar-link" id="menuMyProfile" href="#"><svg class="icon"><use href="#i-bookmark"/></svg> Můj profil</a>
      <a class="sidebar-link active" href="/liked"><svg class="icon"><use href="#i-heart"/></svg> Lajknuté</a>
      <a class="sidebar-link" href="/artist-setup"><span class="icon">⚙</span> Nastavení tatéra</a>
      <a class="sidebar-link" href="/my-bookings"><svg class="icon"><use href="#i-calendar"/></svg> Moje rezervace</a>
      <a class="sidebar-link" href="/events"><span class="icon">◳</span> Eventy</a>
      <a class="sidebar-link" href="/messages"><svg class="icon"><use href="#i-message"/></svg> Zprávy</a>
    </div>
    <div class="sidebar-section">
      <a class="sidebar-link" onclick="doLogout()" style="cursor:pointer"><svg class="icon icon-sm" style="margin-right:8px"><use href="#i-log-out"/></svg> Odhlásit</a>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <h1 class="page-title"><svg class="icon icon-lg" style="vertical-align:-3px;margin-right:6px"><use href="#i-heart"/></svg> Lajknuté</h1>
      <div class="page-sub">Tvoje uložené skicy a hotové práce</div>
    </div>

    <div class="feed-tabs">
      <div class="feed-tab active" data-kind="">Vše <span class="tab-hint" id="cntAll"></span></div>
      <div class="feed-tab" data-kind="sketch">Skicy <span class="tab-hint" id="cntSketch"></span></div>
      <div class="feed-tab" data-kind="done">Hotové <span class="tab-hint" id="cntDone"></span></div>
    </div>

    <div id="feed" class="feed-grid"></div>
    <div id="emptyState" class="empty" style="display:none">
      <span class="b">ZATÍM ŽÁDNÉ LAJKY</span>
      <span>Projdi si <a href="/">feed</a> a klikni na ♥ u skic a prací,<br>které tě baví — najdeš je tady kdykoli zpátky.</span>
    </div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
let me = null, items = [], kindFilter = '';

function escapeHtml(s){return(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function init() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);
  if (!me) { location.href = '/login'; return; }

  const navAvatar = document.getElementById('navAvatar');
  if (me.avatar_url) navAvatar.innerHTML = `<img src="${escapeHtml(me.avatar_url)}" alt="">`;
  else navAvatar.textContent = (me.display_name || me.username || '?').slice(0,2).toUpperCase();
  document.getElementById('menuMyProfile').href = '/profile/' + me.username;

  document.querySelectorAll('.feed-tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.feed-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    kindFilter = t.dataset.kind;
    render();
  }));

  await loadLiked();
}

async function loadLiked() {
  const grid = document.getElementById('feed');
  grid.innerHTML = '<div class="il-loading-row"><span class="il-spinner"></span> Načítám lajknuté…</div>';
  try {
    const r = await fetch('/api/liked');
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    items = await r.json();
    render();
  } catch (e) {
    items = [];
    grid.innerHTML = `<div class="il-error-banner">
      <span>Nepodařilo se načíst lajknuté (${escapeHtml(e.message || 'chyba sítě')}).</span>
      <button onclick="loadLiked()">Zkusit znovu</button>
    </div>`;
    document.getElementById('emptyState').style.display = 'none';
  }
}

function render() {
  const grid = document.getElementById('feed');
  const empty = document.getElementById('emptyState');

  const filtered = kindFilter ? items.filter(p => p.kind === kindFilter) : items;

  const cAll = items.length;
  const cSk  = items.filter(p => p.kind === 'sketch').length;
  const cDn  = items.filter(p => p.kind === 'done').length;
  document.getElementById('cntAll').textContent    = cAll ? cAll : '';
  document.getElementById('cntSketch').textContent = cSk  ? cSk  : '';
  document.getElementById('cntDone').textContent   = cDn  ? cDn  : '';

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(p => {
    const u = p.user;
    const av = u.avatar ? `<img src="${escapeHtml(u.avatar)}" alt="">` : escapeHtml(u.initials || '?');
    const kindLabel = p.kind === 'sketch' ? 'SKICA' : 'HOTOVÉ';
    const priced = p.kind === 'sketch' && p.price_kc;
    const priceTxt = priced
      ? `${(+p.price_kc).toLocaleString('cs-CZ')} Kč${p.estimated_hours?` · ${(+p.estimated_hours).toString().replace(/\.0$/,'')}h`:''}`
      : '';
    return `
      <article class="card" data-id="${p.id}">
        <div class="img" onclick="openProfile('${escapeHtml(u.username)}', ${p.id})">
          <img src="/uploads/${escapeHtml(p.image)}" alt="" loading="lazy">
          <div class="card-kind">${kindLabel}</div>
          ${(p.images && p.images.length > 1) ? `<div class="card-imgs-badge">⧉ +${p.images.length - 1}</div>` : ''}
          ${priced ? `<div class="card-price">${priceTxt}</div>` : ''}
          ${priced ? `<div class="card-bookcta" onclick="event.stopPropagation();goBookSketch('${escapeHtml(u.username)}',${p.id})">Rezervovat tento návrh →</div>` : ''}
        </div>
        <div class="card-foot">
          <a class="card-avatar" href="/profile/${escapeHtml(u.username)}" onclick="event.stopPropagation()">${av}</a>
          <a class="card-who" href="/profile/${escapeHtml(u.username)}" onclick="event.stopPropagation()">
            <div class="name">${escapeHtml(u.display_name)}${u.rating_count > 0 ? ` <span class="card-rating" title="${u.rating_count} ${u.rating_count===1?'recenze':(u.rating_count<5?'recenze':'recenzí')}">★ ${u.rating_avg.toFixed(1)}</span>` : ''}</div>
            <div class="meta">${escapeHtml([u.studio, u.city].filter(Boolean).join(' · ') || 'tatér')}</div>
          </a>
          <span class="card-like" onclick="event.stopPropagation(); unlike(${p.id})" title="Odebrat z lajků"><svg class="icon icon-sm"><use href="#i-heart"/></svg> <span>${p.like_count}</span></span>
          <span class="card-share" onclick="event.stopPropagation(); shareSketch(${p.id})" title="Sdílet">↗</span>
        </div>
      </article>
    `;
  }).join('');
}

const _unlikeBusy = new Set();
async function unlike(id) {
  if (_unlikeBusy.has(id)) return;
  _unlikeBusy.add(id);
  try {
    const r = await fetch(`/api/portfolio/${id}/like`, {method:'POST'}).then(r=>r.json()).catch(()=>null);
    if (!r) return;
    if (!r.liked) {
      items = items.filter(p => p.id !== id);
      render();
    }
  } finally {
    _unlikeBusy.delete(id);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function shareSketch(id) {
  const url = location.origin + '/sketch/' + id;
  if (navigator.share) {
    try { await navigator.share({ title: 'InkLink', url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Odkaz zkopírován');
  } catch {
    showToast('Zkopíruj URL: ' + url);
  }
}

function openProfile(username, sketchId) {
  location.href = `/profile/${encodeURIComponent(username)}#book-${sketchId}`;
}

function goBookSketch(username, sketchId) {
  location.href = `/profile/${encodeURIComponent(username)}#book-${sketchId}`;
}

function goToProfile() {
  if (me && me.username) location.href = '/profile/' + me.username;
  else location.href = '/login';
}

async function doLogout() {
  await fetch('/api/logout', {method:'POST'}).catch(()=>null);
  location.href = '/';
}

init();
</script>
