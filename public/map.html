<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script>document.documentElement.dataset.theme='paper';try{localStorage.setItem('hmo_theme','paper')}catch(e){}</script>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;--red3: #000;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh;overflow:hidden}
a{color:inherit;text-decoration:none}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,248,243,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:76px;gap:0}
.nav-logo{font-family:'Bristol','Caveat',cursive;font-size:44px;letter-spacing:0;color:var(--ink);line-height:0.9;font-weight:400;cursor:pointer;white-space:nowrap;flex:1}
.nav-icons{display:flex;gap:6px;align-items:center}
.nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);font-size:14px;border-radius:2px;transition:all 0.15s}
.nav-icon:hover{color:var(--red2);background:var(--bg3)}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--red2);cursor:pointer;margin-left:4px;letter-spacing:0.05em;overflow:hidden}
.nav-avatar img{width:100%;height:100%;object-fit:cover}

#map{position:fixed;top:54px;left:0;right:0;bottom:0;background:#0a0a0a}
@media(max-width:768px){#map{bottom:62px}}

.leaflet-container{background:#0a0a0a !important}
/* Z světlých OSM dlaždic děláme tmavou mapu: invert prohodí podklad
   s cestami, grayscale sundá barvy. Markery a popupy jsou v jiné vrstvě,
   takže se jich filtr netýká. */
.leaflet-tile-pane{filter:invert(1) grayscale(1) brightness(0.92) contrast(1.1)}
.leaflet-control-attribution{background:rgba(0,0,0,0.7) !important;color:#888 !important;font-size:10px !important}
.leaflet-control-attribution a{color:#aaa !important}
.leaflet-control-zoom a{background:var(--bg3) !important;color:var(--txt) !important;border-color:var(--border2) !important}
.leaflet-control-zoom a:hover{background:var(--bg4) !important}

/* Custom marker — avatar circle */
.artist-marker{position:relative;width:42px;height:42px;cursor:pointer}
.artist-marker .av{position:absolute;inset:0;border-radius:50%;background:var(--bg4);border:2px solid var(--red2);display:flex;align-items:center;justify-content:center;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:14px;color:var(--red2);overflow:hidden;box-shadow:0 4px 12px rgba(20,16,8,0.10);transition:transform 0.15s}
.artist-marker .av img{width:100%;height:100%;object-fit:cover}
.artist-marker:hover .av{transform:scale(1.08)}
.artist-marker .rating-badge{position:absolute;bottom:-4px;right:-6px;background:#e8c87f;color:#000;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:9px;padding:2px 5px;font-weight:700;border-radius:8px;letter-spacing:0.04em;line-height:1}

/* Custom popup */
.leaflet-popup-content-wrapper{background:var(--bg2) !important;color:var(--txt) !important;border:1px solid var(--border2) !important;border-radius:0 !important;box-shadow:0 12px 32px rgba(20,16,8,0.14) !important;padding:0 !important}
.leaflet-popup-tip{background:var(--bg2) !important;border:1px solid var(--border2) !important}
.leaflet-popup-content{margin:0 !important;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif !important;width:240px !important}
.leaflet-popup-close-button{color:var(--txt3) !important;padding:8px 10px !important}

.artist-pop{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.artist-pop-head{display:flex;align-items:center;gap:10px}
.artist-pop-avatar{width:42px;height:42px;border-radius:50%;background:var(--bg4);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:14px;color:var(--red2);overflow:hidden;flex-shrink:0}
.artist-pop-avatar img{width:100%;height:100%;object-fit:cover}
.artist-pop-info{flex:1;min-width:0}
.artist-pop-info .name{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:18px;letter-spacing:0.1em;color:var(--red2);line-height:1.2}
.artist-pop-info .meta{font-size:11px;color:var(--txt3);letter-spacing:0.04em;margin-top:3px}
.artist-pop-rating{font-size:11px;color:#e8c87f;letter-spacing:0.04em;margin-top:6px}
.artist-pop-styles{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.artist-pop-style-chip{font-size:9px;padding:2px 6px;background:var(--bg3);border:1px solid var(--border2);color:var(--txt3);letter-spacing:0.06em;text-transform:uppercase}
.artist-pop-cta{display:block;text-align:center;padding:10px;background:var(--red2);color:var(--bg);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;margin-top:4px;transition:background 0.15s}
.artist-pop-cta:hover{background:var(--red3)}

/* Oba plovoucí panely leží na tmavé mapě, ne na papírovém pozadí webu.
   Barvy si proto nesou vlastní — dokud braly --txt2 ze světlého motivu,
   byl text tmavý na tmavém a přečíst se dal jen při najetí myší. */
#mapInfo{position:fixed;top:66px;left:12px;z-index:500;background:rgba(18,16,13,0.92);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.14);border-radius:8px;padding:10px 14px;font-size:11px;letter-spacing:0.06em;color:#ece7dc;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px)}
#mapInfo .il-spinner{margin-right:2px}

#geoBar{position:fixed;top:66px;right:12px;z-index:500;background:rgba(18,16,13,0.92);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.14);border-radius:8px;padding:6px;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.06em}
/* Okruh jako přepínač, ne rozbalovací nabídka: čtyři možnosti se vejdou
   vedle sebe a odpadne nativní ovládací prvek, který na tmavém panelu
   vypadal jako cizí těleso. */
.geo-radius{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.06);border-radius:6px;padding:2px}
.geo-radius button{background:transparent;border:none;border-radius:4px;color:rgba(236,231,220,0.62);padding:5px 9px;font-size:11px;font-family:inherit;letter-spacing:0.04em;cursor:pointer;transition:background 0.12s,color 0.12s}
.geo-radius button:hover{color:#ece7dc;background:rgba(255,255,255,0.08)}
.geo-radius button.on{background:#6d4fc4;color:#fff}
.geo-unit{color:rgba(236,231,220,0.5);padding:0 6px 0 3px;font-size:10px;letter-spacing:0.1em}
#geoBtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,0.22);border-radius:6px;color:#ece7dc;padding:6px 11px;font-size:11px;letter-spacing:0.08em;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all 0.15s;white-space:nowrap}
#geoBtn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.42)}
#geoBtn.active{background:#6d4fc4;color:#fff;border-color:#6d4fc4}
#geoBtn .icon{width:13px;height:13px;flex:none}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#geoBar.busy{opacity:0.6;pointer-events:none}
/* Leaflet staví ovládání zoomu do levého horního rohu — přesně tam, kde
   sedí panel s počtem tatérů, takže se pod ním schovávalo. A světlé
   tlačítko na tmavé mapě svítilo jako cizí prvek. */
.leaflet-top.leaflet-left{margin-top:48px}
.leaflet-control-zoom{border:1px solid rgba(255,255,255,0.14)!important;border-radius:8px!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a{background:rgba(18,16,13,0.92)!important;color:#ece7dc!important;border-bottom:1px solid rgba(255,255,255,0.12)!important;backdrop-filter:blur(8px)}
.leaflet-control-zoom a:hover{background:rgba(52,46,38,0.95)!important;color:#fff!important}
/* Atribuci OpenStreetMap vyžaduje licence dlaždic, takže nesmí zůstat
   schovaná pod spodní lištou. */
@media(max-width:720px){.leaflet-bottom.leaflet-right{bottom:64px}}
@media(max-width:520px){#geoBar{top:auto;bottom:74px;right:8px;flex-direction:column;gap:6px;padding:6px}#geoBar .geo-radius{width:100%;justify-content:center}#geoBtn{width:100%;justify-content:center}}

.geo-marker{width:18px;height:18px;border-radius:50%;background:#4a9eff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(74,158,255,0.25),0 4px 10px rgba(0,0,0,0.4)}
</style>
</head>
<body data-theme="dark">

<nav>
  <a class="nav-logo" href="/">inklink</a>
  <div class="nav-icons">
    <a class="nav-icon" href="/" title="Back"><svg class="icon"><use href="#i-arrow-left"/></svg></a>
  </div>
</nav>

<div id="mapInfo"><span class="il-spinner"></span> <span id="mapInfoText" data-i18n="mp.loading">Loading artists…</span></div>
<div id="geoBar">
  <div class="geo-radius" role="group" data-i18n-attr="mp.radius:aria-label" aria-label="Radius">
    <button type="button" data-km="5">5</button>
    <button type="button" data-km="25" class="on">25</button>
    <button type="button" data-km="50">50</button>
    <button type="button" data-km="100">100</button>
    <span class="geo-unit">km</span>
  </div>
  <button id="geoBtn" type="button" onclick="toggleGeo()">
    <svg class="icon"><use href="#i-map-pin"/></svg>
    <span id="geoBtnLabel" data-i18n="mp.nearMe">Near me</span>
  </button>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/i18n.js?v=21"></script>
<script src="/notifs.js?v=19"></script>
<script src="/mobile-nav.js?v=30"></script>
<script>InkLinkNotifs.init(); InkLinkMobileNav.init();</script>

<script>
let me = null;
const tr = k => window.InkLinkI18N ? window.InkLinkI18N.t(k) : k;

// Ikona v tlačítku musí přežít změnu popisku, proto se přepisuje jen text
// uvnitř <span>, ne celé tlačítko.
function setGeoBtn(key) {
  document.getElementById('geoBtnLabel').textContent = tr(key);
}

function currentRadius() {
  const on = document.querySelector('.geo-radius button.on');
  return parseInt(on && on.dataset.km, 10) || 25;
}

function escapeHtml(s){return(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function initNav() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);
  // #navAvatar and #navLiked don't exist on this page — owned by nav-avatar.js
  // / not present here respectively. Just populate `me` for goToProfile().
}

function goToProfile() {
  if (me && me.username) location.href = '/profile/' + me.username;
  else location.href = '/login';
}

function buildMarker(a) {
  const avHtml = a.avatar_url
    ? `<img src="${escapeHtml(a.avatar_url)}" alt="">`
    : escapeHtml(a.initials || '?');
  const rating = a.rating_count > 0
    ? `<span class="rating-badge">★ ${a.rating_avg.toFixed(1)}</span>`
    : '';
  return L.divIcon({
    className: '',
    html: `<div class="artist-marker"><div class="av">${avHtml}</div>${rating}</div>`,
    iconSize: [42, 42],
    iconAnchor: [21, 21],
  });
}

function buildPopup(a) {
  const avHtml = a.avatar_url
    ? `<img src="${escapeHtml(a.avatar_url)}" alt="">`
    : escapeHtml(a.initials || '?');
  const meta = [a.studio, a.city].filter(Boolean).map(escapeHtml).join(' · ') || 'artist';
  const styles = (a.styles || '').split(',').filter(Boolean).slice(0, 4)
    .map(s => `<span class="artist-pop-style-chip">${escapeHtml(s.trim())}</span>`).join('');
  const rating = a.rating_count > 0
    ? `<div class="artist-pop-rating">★ ${a.rating_avg.toFixed(1)} <span style="color:var(--txt3)">(${a.rating_count} ${a.rating_count === 1 ? 'review' : (a.rating_count < 5 ? 'review' : 'reviews')})</span></div>`
    : '';
  return `
    <div class="artist-pop">
      <div class="artist-pop-head">
        <div class="artist-pop-avatar">${avHtml}</div>
        <div class="artist-pop-info">
          <div class="name">${escapeHtml(a.display_name)}</div>
          <div class="meta">${meta}</div>
        </div>
      </div>
      ${rating}
      ${styles ? `<div class="artist-pop-styles">${styles}</div>` : ''}
      <a class="artist-pop-cta" href="/profile/${escapeHtml(a.username)}">Open profile →</a>
    </div>
  `;
}

let mapInstance = null;
let allArtists = [];           // all artists from /api/artists/map
let artistMarkers = new Map(); // id → Leaflet marker
let geoState = { active: false, lat: null, lng: null, marker: null, circle: null };

// Čeština má tři tvary, angličtina dva. Dřív se to míchalo v jedné větě:
// „1 artist", ale „3 tatéři".
function countLabel(n) {
  const key = n === 1 ? 'mp.n1' : (n < 5 ? 'mp.n24' : 'mp.n5');
  return tr(key).replace('{n}', n);
}

// Panel drží buď hotový text, nebo funkci, která si ho složí. Ta druhá
// možnost je tu kvůli přepnutí jazyka: počet tatérů se musí přeložit znovu,
// jinak by po přepnutí zůstalo „1 artist" v české verzi.
let _infoThunk = null;

function setMapInfo(text, busy=false) {
  const el = document.getElementById('mapInfoText');
  // Do prvního výsledku drží text překladač („Načítám tatéry…"), od téhle
  // chvíle obsah řídí JS. Bez odebrání atributu by přepnutí jazyka vrátilo
  // hlášku o načítání místo počtu tatérů.
  el.removeAttribute('data-i18n');
  _infoThunk = (typeof text === 'function') ? text : null;
  el.textContent = _infoThunk ? _infoThunk() : text;
  document.querySelector('#mapInfo .il-spinner').style.display = busy ? '' : 'none';
}

function renderAllMarkers() {
  // Zobraz všechny tatéři (žádný filter)
  artistMarkers.forEach(m => m.setOpacity(1));
}

function filterByRadius(centerLat, centerLng, km) {
  // Spočítej distance lokálně; markeři mimo okruh se zprůhlední
  let inside = 0;
  artistMarkers.forEach((marker, id) => {
    const a = allArtists.find(x => x.id === id);
    if (!a) { marker.setOpacity(0); return; }
    const d = haversineKm(centerLat, centerLng, a.lat, a.lng);
    if (d <= km) { marker.setOpacity(1); inside++; }
    else { marker.setOpacity(0); }
  });
  return inside;
}

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371.0;
  const rad = Math.PI / 180;
  const p1 = lat1 * rad, p2 = lat2 * rad;
  const dp = (lat2 - lat1) * rad;
  const dl = (lng2 - lng1) * rad;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function toggleGeo() {
  const bar = document.getElementById('geoBar');
  const btn = document.getElementById('geoBtn');
  if (geoState.active) {
    // Vypni filtr
    if (geoState.marker) { mapInstance.removeLayer(geoState.marker); geoState.marker = null; }
    if (geoState.circle) { mapInstance.removeLayer(geoState.circle); geoState.circle = null; }
    geoState.active = false;
    geoState.lat = geoState.lng = null;
    btn.classList.remove('active');
    setGeoBtn('mp.nearMe');
    renderAllMarkers();
    setMapInfo(() => countLabel(allArtists.length));
    return;
  }
  if (!navigator.geolocation) {
    alert(tr('mp.geoUnavailable'));
    return;
  }
  bar.classList.add('busy');
  setGeoBtn('mp.finding');
  navigator.geolocation.getCurrentPosition(
    pos => {
      bar.classList.remove('busy');
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      const km = currentRadius();
      applyGeoFilter(lat, lng, km);
    },
    err => {
      bar.classList.remove('busy');
      setGeoBtn('mp.nearMe');
      const msg = tr(err && err.code === err.PERMISSION_DENIED
                     ? 'mp.geoDenied' : 'mp.geoFailed');
      alert(msg);
    },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
  );
}

function applyGeoFilter(lat, lng, km) {
  geoState.active = true;
  geoState.lat = lat;
  geoState.lng = lng;

  // Marker tvé polohy
  if (geoState.marker) mapInstance.removeLayer(geoState.marker);
  const icon = L.divIcon({ className:'', html: '<div class="geo-marker"></div>', iconSize: [18,18], iconAnchor: [9,9] });
  geoState.marker = L.marker([lat, lng], { icon, interactive: false }).addTo(mapInstance);

  // Kruh poloměru
  if (geoState.circle) mapInstance.removeLayer(geoState.circle);
  geoState.circle = L.circle([lat, lng], {
    radius: km * 1000,
    color: '#4a9eff', weight: 1.5, fillColor: '#4a9eff', fillOpacity: 0.08,
    interactive: false,
  }).addTo(mapInstance);

  const inside = filterByRadius(lat, lng, km);
  mapInstance.fitBounds(geoState.circle.getBounds(), { padding: [40, 40], maxZoom: 12 });

  const btn = document.getElementById('geoBtn');
  btn.classList.add('active');
  setGeoBtn('mp.clearFilter');
  setMapInfo(() => tr('mp.withinKm').replace('{label}', countLabel(inside))
                                    .replace('{km}', km));
}

// Přepnutí jazyka překreslí i to, co si panel spočítal sám.
document.addEventListener('il-i18n-applied', () => {
  if (_infoThunk) {
    document.getElementById('mapInfoText').textContent = _infoThunk();
  }
});

document.querySelectorAll('.geo-radius button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.geo-radius button')
            .forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    if (geoState.active) {
      applyGeoFilter(geoState.lat, geoState.lng, currentRadius());
    }
  });
});

async function init() {
  initNav();

  // Map default: ČR centrovaný (Praha), zoom 7 (vidět celé Česko)
  mapInstance = L.map('map', {
    center: [49.8, 15.5],
    zoom: 7,
    zoomControl: true,
    attributionControl: true,
  });

  // CARTO svoje basemapy uzavřelo za API klíč — dlaždice se pořád načtou,
  // ale přes celou mapu jde vodoznak „API KEY REQUIRED". Standardní OSM
  // dlaždice jsou bez klíče; jsou světlé, tak je níž obracíme filtrem.
  // Podmínkou OSM je identifikující se provoz a atribuce, obojí splňujeme.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(mapInstance);

  try {
    const r = await fetch('/api/artists/map');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    allArtists = await r.json();
    if (!allArtists.length) {
      setMapInfo(() => tr('mp.noArtists'));
      return;
    }
    const bounds = [];
    // Kdo nevyplnil adresu studia, dostane souřadnice svého města — a
    // všichni z Prahy by tak seděli na jednom bodě, kde jde kliknout jen
    // na posledního. Duplicity rozsejeme do spirály zlatým úhlem, ať jsou
    // rozeznatelné; první kruh je zhruba padesát metrů, takže to nikoho
    // neposune do jiné čtvrti.
    const seen = new Map();
    allArtists.forEach(a => {
      const key = a.lat.toFixed(5) + ',' + a.lng.toFixed(5);
      const n = seen.get(key) || 0;
      seen.set(key, n + 1);
      let lat = a.lat, lng = a.lng;
      if (n > 0) {
        const ang = n * 2.399963;
        const rad = 0.00045 * Math.sqrt(n);
        lat += rad * Math.cos(ang);
        lng += rad * Math.sin(ang) / Math.max(0.2, Math.cos(a.lat * Math.PI / 180));
      }
      const marker = L.marker([lat, lng], { icon: buildMarker(a) }).addTo(mapInstance);
      marker.bindPopup(buildPopup(a), { maxWidth: 240, autoPan: true });
      artistMarkers.set(a.id, marker);
      bounds.push([lat, lng]);
    });
    if (allArtists.length > 1) {
      mapInstance.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });
    } else if (allArtists.length === 1) {
      mapInstance.setView(bounds[0], 12);
    }
    setMapInfo(() => countLabel(allArtists.length));
  } catch (e) {
    setMapInfo(() => tr('mp.loadFailed'));
  }
}

init();
</script>
