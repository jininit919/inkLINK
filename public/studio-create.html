<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<style>html,body{background:#faf8f3;margin:0}</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title data-i18n="studioCreate.pageTitle">Create studio — InkLink</title>
<meta name="robots" content="noindex">
<script>document.documentElement.dataset.theme='paper';try{localStorage.setItem('hmo_theme','paper')}catch(e){}</script>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;--red3: #000;--ink: #0a0a0a;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,248,243,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:76px;gap:12px}
.nav-logo{font-family:'Bristol','Caveat',cursive;font-size:44px;letter-spacing:0;color:var(--ink);line-height:0.9;font-weight:400;flex:1}
.nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);border-radius:2px;font-size:14px}
.nav-icon:hover{color:var(--red2);background:var(--bg3)}

.wrap{max-width:640px;margin:0 auto;padding:100px 24px 80px}
.page-title{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:42px;letter-spacing:0.06em;margin-bottom:8px}
.lede{color:var(--txt2);font-size:14px;line-height:1.6;letter-spacing:0.02em;margin-bottom:28px;max-width:520px}

.card{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:28px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:11px;letter-spacing:0.08em;color:var(--txt3);text-transform:uppercase}
.field input,.field textarea{background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-family:inherit;font-size:13px;padding:11px 14px;border-radius:6px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--red2)}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:11px;color:var(--txt3);margin-top:2px;letter-spacing:0.02em}

.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--red2);color:#000;border:none;font-family:inherit;font-size:12px;letter-spacing:0.08em;padding:13px 26px;border-radius:6px;cursor:pointer;text-transform:uppercase;font-weight:500;margin-top:12px}
.btn:hover{background:var(--red3)}
.btn:disabled{opacity:0.5;cursor:not-allowed}

.err{background:rgba(229,135,135,0.1);border:1px solid #e58787;color:#e58787;padding:12px 14px;border-radius:6px;font-size:12px;margin-bottom:14px;letter-spacing:0.02em}

.info-box{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:14px 16px;margin-bottom:20px;font-size:12px;color:var(--txt2);line-height:1.6}
.info-box b{color:var(--txt)}

@media (max-width:640px){
  .row{grid-template-columns:1fr}
  .wrap{padding:92px 16px 60px}
  .page-title{font-size:32px}
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">INKLINK</a>
  <a href="/feed" class="nav-icon" title="Back"><i data-lucide="arrow-left"></i></a>
</nav>

<div class="wrap" id="root">
  <div style="color:var(--txt3);padding:40px 0;text-align:center" data-i18n="studioCreate.loading">Loading…</div>
</div>

<script src="/i18n.js?v=16"></script>
<script>
const root = document.getElementById('root');

async function init(){
  // Check auth + existing studio
  try {
    const me = await fetch('/api/me').then(r=>r.json());
    if(!me){
      location.href = '/login?return=/studio-create';
      return;
    }
    if(!me.is_artist){
      root.innerHTML = `
        <div class="page-title" data-i18n="studioCreate.notArtistTitle">Become an artist first</div>
        <div class="lede" data-i18n="studioCreate.notArtistBody">Only artists can create studios. Create an artist profile and come back.</div>
        <a class="btn" href="/artist-setup" data-i18n="studioCreate.becomeArtist">Become an artist</a>
      `;
      window.applyI18n && window.applyI18n();
      return;
    }
    const myStudio = await fetch('/api/me/studio').then(r=>r.json());
    if(myStudio.studio){
      location.href = '/studio-admin';
      return;
    }
    renderForm();
  } catch(e){
    console.error(e);
    root.innerHTML = `<div class="err" data-i18n="studioCreate.loadError">Something went wrong. Zkus to znovu.</div>`;
    window.applyI18n && window.applyI18n();
  }
}

function renderForm(){
  root.innerHTML = `
    <div class="page-title" data-i18n="studioCreate.title">Create studio</div>
    <div class="lede" data-i18n="studioCreate.lede">A studio groups your team of artists under one brand. As founder you're admin — invite others by email.</div>

    <div class="info-box">
      <b data-i18n="studioCreate.infoTitle">What stays the same:</b>
      <span data-i18n="studioCreate.infoBody">Each artist keeps their Stripe account, payouts and bookings. The studio just groups portfolios and has a public page.</span>
    </div>

    <div class="card">
      <div id="formErr"></div>
      <form onsubmit="submitForm(event)">
        <div class="field">
          <label data-i18n="studioCreate.name">Studio name *</label>
          <input id="f_name" required minlength="2" maxlength="80" placeholder="Black Rose Tattoo">
        </div>
        <div class="field">
          <label data-i18n="studioCreate.description">Short description</label>
          <textarea id="f_description" maxlength="2000" placeholder="About the studio, atmosphere, what you do…"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label data-i18n="studioCreate.city">City</label>
            <input id="f_city" maxlength="80" placeholder="Praha">
          </div>
          <div class="field">
            <label data-i18n="studioCreate.country">Country</label>
            <input id="f_country" maxlength="80" placeholder="Czechia">
          </div>
        </div>
        <div class="field">
          <label data-i18n="studioCreate.address">Adresa</label>
          <input id="f_address" maxlength="200" placeholder="Národní 12">
        </div>
        <div class="row">
          <div class="field">
            <label>Instagram</label>
            <input id="f_instagram" maxlength="80" placeholder="blackrose_tattoo">
          </div>
          <div class="field">
            <label data-i18n="studioCreate.website">Web</label>
            <input id="f_website" maxlength="200" placeholder="https://">
          </div>
        </div>
        <button class="btn" type="submit" data-i18n="studioCreate.submit">Create studio</button>
      </form>
    </div>
  `;
  window.applyI18n && window.applyI18n();
}

async function submitForm(e){
  e.preventDefault();
  const errBox = document.getElementById('formErr');
  errBox.innerHTML = '';
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  const body = {
    name: document.getElementById('f_name').value,
    description: document.getElementById('f_description').value,
    city: document.getElementById('f_city').value,
    country: document.getElementById('f_country').value,
    address: document.getElementById('f_address').value,
    instagram: document.getElementById('f_instagram').value,
    website: document.getElementById('f_website').value,
  };
  try {
    const r = await fetch('/api/studios', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const d = await r.json();
    if(r.ok){
      location.href = '/studio-admin';
    } else {
      errBox.innerHTML = `<div class="err">${(d.error||'Chyba').replace(/[<>]/g,'')}</div>`;
      btn.disabled = false;
    }
  } catch(e){
    errBox.innerHTML = `<div class="err">Network error.</div>`;
    btn.disabled = false;
  }
}

init();
</script>
<script src="/icons.js?v=16"></script>
<script src="/ink-trail.js?v=16"></script>
<script src="/cookie-consent.js?v=16"></script>
<script src="/native.js?v=16"></script>
</body>
</html>
