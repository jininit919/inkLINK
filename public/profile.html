<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;--red3: #000;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,248,243,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:76px;gap:12px}
.nav-logo{font-family:'Bristol','Caveat',cursive;font-size:44px;letter-spacing:0;color:var(--ink);line-height:0.9;font-weight:400;flex:1}
.nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);border-radius:2px;font-size:14px}
.nav-icon:hover{color:var(--red2);background:var(--bg3)}

.wrap{max-width:960px;margin:0 auto;padding:100px 24px 80px}

.head{display:flex;gap:24px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:24px}
.avatar{width:120px;height:120px;border-radius:50%;background:var(--bg4);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:42px;color:var(--red2);overflow:hidden;flex-shrink:0;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
/* Klikatelný avatar (vlastní profil) — hover overlay s kamerou */
.avatar.avatar-editable{cursor:pointer;transition:border-color 0.2s,transform 0.2s}
.avatar.avatar-editable:hover{border-color:var(--txt);transform:scale(1.02)}
.avatar.avatar-editable::after{
  content:'';
  position:absolute;inset:0;
  border-radius:50%;
  background:rgba(20,16,8,0.45) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='%23faf8f3' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z'/><circle cx='12' cy='13' r='3.5'/></svg>") center/32px no-repeat;
  opacity:0;transition:opacity 0.2s var(--ease);
  pointer-events:none;
}
.avatar.avatar-editable:hover::after{opacity:1}
.avatar.avatar-editable.uploading::after{opacity:1;background:rgba(20,16,8,0.6)}
.head-info{flex:1;min-width:0}
.dname{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:36px;letter-spacing:0.05em;line-height:1.1}
.uname{color:var(--txt3);font-size:13px;letter-spacing:0.06em;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:14px;font-size:12px;color:var(--txt2);letter-spacing:0.04em}
.meta b{color:var(--txt);font-weight:400}
.bio{margin-top:14px;font-size:13px;color:var(--txt2);line-height:1.5;white-space:pre-wrap;max-width:560px}
.trust-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.trust-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:0.05em;padding:5px 10px;background:var(--bg3);border:1px solid var(--border2);color:var(--txt2)}
.trust-badge.verified{border-color:#5b8c5b;color:#9bc89b}
.trust-badge .icon{font-size:11px}
.trust-badge b{color:var(--txt);font-weight:400}

.similar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:720px){.similar-grid{grid-template-columns:repeat(2,1fr)}}
.similar-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;background:var(--bg2);border:1px solid var(--border);text-align:center;text-decoration:none;color:inherit;transition:border-color 0.15s}
.similar-card:hover{border-color:var(--red2)}
.similar-avatar{width:64px;height:64px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:20px;color:var(--red2);overflow:hidden}
.similar-avatar img{width:100%;height:100%;object-fit:cover}
.similar-name{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:16px;letter-spacing:0.08em;color:var(--red2);line-height:1.2}
.similar-meta{font-size:10px;color:var(--txt3);letter-spacing:0.04em;line-height:1.4}
.similar-rating{font-size:11px;color:#e8c87f;letter-spacing:0.04em}
.styles{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.style-chip{font-size:11px;padding:3px 10px;border:1px solid var(--border2);color:var(--txt2);letter-spacing:0.05em}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;letter-spacing:0.08em;padding:8px 16px;background:transparent;border:1px solid var(--red2);color:var(--red2);cursor:pointer;text-transform:uppercase}
.btn:hover{background:var(--red2);color:var(--bg)}
.btn.muted{border-color:var(--border2);color:var(--txt3)}
.btn.muted:hover{background:transparent;color:var(--txt2);border-color:var(--txt3)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border:1px solid var(--red);color:var(--red2);letter-spacing:0.1em;margin-left:8px;vertical-align:middle}

.rating-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--border2);font-size:11px;color:var(--txt2);letter-spacing:0.04em;margin-left:8px;vertical-align:middle}
.rating-pill .stars{color:#e8c87f;font-size:12px;letter-spacing:0.02em;line-height:1}
.rating-pill .num{color:var(--txt);font-weight:400}
.rating-pill .cnt{color:var(--txt3);font-size:10px}
.star-static{display:inline-flex;gap:1px;font-size:13px;color:#e8c87f;letter-spacing:0.02em;line-height:1}
.star-static .empty{color:var(--border2)}

.review-list{display:flex;flex-direction:column;gap:14px}
.review-item{padding:16px;background:var(--bg3);border:1px solid var(--border2);position:relative}
.review-report-btn{position:absolute;bottom:8px;right:10px;background:none;border:none;color:var(--txt3);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:9px;letter-spacing:0.06em;cursor:pointer;padding:4px 6px;text-transform:uppercase;opacity:0.5;transition:opacity 0.15s,color 0.15s}
.review-report-btn:hover{opacity:1;color:#e58787}
.review-report-btn:disabled{cursor:default;opacity:0.6}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.review-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg4);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--red2);overflow:hidden;flex-shrink:0}
.review-avatar img{width:100%;height:100%;object-fit:cover}
.review-who{font-size:12px;color:var(--txt);flex:1}
.review-who .meta{color:var(--txt3);font-size:10px;letter-spacing:0.05em;margin-top:2px}
.review-rating{font-size:12px;color:#e8c87f}
.review-text{font-size:13px;color:var(--txt2);line-height:1.6;letter-spacing:0.02em;white-space:pre-wrap;word-break:break-word}
.review-resp{margin-top:12px;padding:10px 12px;background:var(--bg2);border-left:2px solid var(--red);font-size:12px;color:var(--txt2);line-height:1.5;letter-spacing:0.02em}
.review-resp b{color:var(--txt);font-weight:400}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:16px;letter-spacing:0.18em;padding:12px 20px;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--red2);border-bottom-color:var(--red2)}
.tab:hover{color:var(--txt)}
@media(max-width:560px){
  .wrap{padding:92px 14px 80px !important}
  .head{flex-direction:column;gap:14px;align-items:center;text-align:center}
  .avatar{width:96px;height:96px;font-size:34px}
  .dname{font-size:28px !important}
  .head-info{width:100%}
  .meta{justify-content:center}
  .trust-row{justify-content:center}
  .styles{justify-content:center}
  .actions{justify-content:center}
  .bio{margin-left:auto;margin-right:auto;text-align:center}
}
.empty{text-align:center;padding:60px 20px;color:var(--txt3);font-size:13px;letter-spacing:0.05em}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{aspect-ratio:1;background:var(--bg3);position:relative;cursor:pointer;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s}
.tile:hover img{transform:scale(1.04)}
.tile-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;opacity:0;transition:opacity 0.2s;background:linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%)}
.tile-imgs-badge{position:absolute;bottom:6px;left:6px;font-size:10px;letter-spacing:0.06em;padding:2px 6px;background:rgba(0,0,0,0.78);color:#fff;line-height:1.4}
.tile:hover .tile-overlay{opacity:1}
.tile-meta{font-size:11px;color:#fff;letter-spacing:0.04em}
.tile-kind{position:absolute;top:6px;left:6px;font-size:9px;letter-spacing:0.15em;padding:2px 6px;background:rgba(0,0,0,0.7);color:#fff}
.tile-price{position:absolute;top:6px;right:6px;font-size:10px;letter-spacing:0.06em;padding:3px 8px;background:var(--red2);color:var(--bg);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:13px;line-height:1}
.tile-bookbtn{position:absolute;bottom:6px;left:6px;right:6px;padding:6px 10px;background:var(--red2);color:var(--bg);border:none;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity 0.15s}
.tile:hover .tile-bookbtn{opacity:0.95}
.tile-bookbtn:hover{opacity:1!important}

.slots-list{display:flex;flex-direction:column;gap:8px}
.slot-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg3);border:1px solid var(--border2)}
.slot-date{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:18px;letter-spacing:0.06em;min-width:140px}
.slot-meta{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--txt2)}
.slot-price{color:var(--txt);font-weight:400}
.slot-deposit{color:var(--txt3);font-size:11px}
.slot-note{font-size:11px;color:var(--txt3);font-style:italic;margin-top:2px}
.slot-book{margin-left:auto}
@media(max-width:560px){.slot-row{flex-direction:column;align-items:flex-start;gap:8px}.slot-book{margin-left:0;width:100%}.slot-book .btn{width:100%}}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.94);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:84vh;object-fit:contain}
#lightbox-close{position:absolute;top:16px;right:16px;color:#fff;font-size:24px;cursor:pointer;background:none;border:none;padding:8px;line-height:1;z-index:2}
#lightbox-close:hover{color:var(--red2)}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.2);width:46px;height:46px;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:background 0.15s;z-index:2}
.lb-arrow.show{display:flex}
.lb-arrow:hover{background:rgba(20,16,8,0.55);border-color:var(--red2)}
#lb-prev{left:16px}#lb-next{right:16px}
#lb-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:11px;letter-spacing:0.1em;padding:6px 12px;background:rgba(0,0,0,0.7);display:none}
#lb-counter.show{display:block}
@media(max-width:560px){.lb-arrow{width:40px;height:40px;font-size:16px}#lb-prev{left:8px}#lb-next{right:8px}}

#bookModal{position:fixed;inset:0;background:rgba(20,16,8,0.55);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#bookModal.show{display:flex}
.book-card{max-width:560px;width:100%;background:var(--bg2);border:1px solid var(--border);padding:28px;max-height:90vh;overflow-y:auto}
@media(max-width:560px){#bookModal{padding:0}.book-card{max-height:100vh;height:100vh;padding:18px;border:none}}
.book-card h3{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:24px;letter-spacing:0.12em;margin-bottom:8px}
.book-card .when{color:var(--txt2);font-size:13px;margin-bottom:6px}
.book-card .price{color:var(--txt3);font-size:12px;letter-spacing:0.05em;margin-bottom:18px}
.book-card label{display:block;font-size:11px;letter-spacing:0.1em;color:var(--txt3);margin-bottom:6px;text-transform:uppercase;margin-top:14px}
.book-card label:first-of-type{margin-top:0}
.book-card textarea, .book-card select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:13px;padding:10px 12px;outline:none}
.book-card textarea{min-height:100px;resize:vertical}
.book-card textarea:focus, .book-card select:focus{border-color:var(--red2)}

.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(max-width:560px){.size-grid{grid-template-columns:repeat(2,1fr)}}
.size-pill{padding:10px 6px;border:1px solid var(--border2);text-align:center;cursor:pointer;background:var(--bg3);transition:all 0.15s}
.size-pill:hover{border-color:var(--txt3)}
.size-pill.on{border-color:var(--red2);background:var(--bg4)}
.size-pill .h{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:18px;letter-spacing:0.1em;color:var(--red2);line-height:1}
.size-pill .lbl{font-size:9px;color:var(--txt3);letter-spacing:0.04em;margin-top:4px;line-height:1.3}
.size-pill.on .lbl{color:var(--txt2)}

.start-options{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.start-pill{padding:6px 12px;border:1px solid var(--border2);background:var(--bg3);font-size:12px;letter-spacing:0.04em;cursor:pointer;color:var(--txt2)}
.start-pill:hover{border-color:var(--txt3)}
.start-pill.on{border-color:var(--red2);color:var(--red2);background:var(--bg4)}
.no-slots{font-size:11px;color:#e58787;letter-spacing:0.04em;padding:8px 0}

.book-card .deposit-info{margin:14px 0 0;padding:12px 14px;background:var(--bg3);border-left:2px solid var(--red2);font-size:11px;color:var(--txt2);letter-spacing:0.04em;line-height:1.6}
.book-card .deposit-info b{color:var(--txt);font-weight:400}
.book-card .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.flash-modal{padding:10px 14px;margin:10px 0;font-size:12px;letter-spacing:0.04em}
.flash-modal.err{background:rgba(204,68,68,0.1);color:#e58787;border:1px solid rgba(204,68,68,0.3)}
.flash-modal.ok{background:rgba(76,175,80,0.1);color:#7fd391;border:1px solid rgba(76,175,80,0.3)}
</style>
</head>
<body data-theme="dark">

<nav>
  <a class="nav-logo" href="/">inklink</a>
  <a class="nav-icon" id="navCalendar" href="/my-bookings" title="Calendar"><svg class="icon"><use href="#i-calendar"/></svg></a>
  <a class="nav-icon" href="/messages" title="Messages"><svg class="icon"><use href="#i-message"/></svg></a>
  <a class="nav-icon" id="setupLink" href="/artist-setup" title="Edit profile" style="display:none"><svg class="icon"><use href="#i-settings"/></svg></a>
</nav>
<script src="/notifs.js?v=5"></script>
<script src="/i18n.js"></script>
<script src="/mobile-nav.js?v=14"></script>
<script>InkLinkNotifs.init(); InkLinkMobileNav.init();</script>

<div class="wrap">
  <div id="loading" class="il-loading-row"><span class="il-spinner"></span> Loading profil…</div>
  <div id="profile" style="display:none">
    <div class="head">
      <div class="avatar" id="avatar">??</div>
      <input type="file" id="avatarUploadInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadAvatar(event)">
      <div class="head-info">
        <div class="dname" id="dname"></div>
        <div class="uname"><span id="uname"></span></div>
        <div class="meta">
          <span id="cityRow" style="display:none">⌖ <b id="city"></b></span>
          <span id="studioRow" style="display:none">◫ <b id="studio"></b></span>
          <span id="instaRow" style="display:none">@<a id="insta" target="_blank" rel="noopener" style="color:var(--txt);text-decoration:underline"></a></span>
        </div>
        <div class="trust-row" id="trustRow"></div>
        <div class="styles" id="stylesRow"></div>
        <div class="bio" id="bio"></div>
        <div class="actions" id="actions"></div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="portfolio"><span data-i18n="pf.portfolio">Portfolio</span> <span id="portfolioCount" style="color:var(--txt3);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;letter-spacing:0.05em;margin-left:6px"></span></div>
      <div class="tab" data-tab="slots" id="slotsTab"><span data-i18n="pf.calendar">Calendar</span> <span id="slotsCount" style="color:var(--txt3);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;letter-spacing:0.05em;margin-left:6px"></span></div>
      <div class="tab" data-tab="reviews" id="reviewsTab"><span data-i18n="pf.reviews">Reviews</span> <span id="reviewsCount" style="color:var(--txt3);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;letter-spacing:0.05em;margin-left:6px"></span></div>
    </div>

    <div id="tab-portfolio">
      <div class="grid" id="grid"></div>
      <div class="empty" id="portfolioEmpty" style="display:none" data-i18n="pf.noPortfolio">No portfolio items.</div>
    </div>

    <div id="tab-slots" style="display:none">
      <div id="profileEvents" style="display:none;margin-bottom:26px">
        <div style="font-size:12px;letter-spacing:0.16em;color:var(--txt3);text-transform:uppercase;margin-bottom:12px" data-i18n="pf.upcomingEvents">Upcoming events</div>
        <div id="profileEventsList"></div>
      </div>
      <div class="slots-list" id="slots"></div>
      <div class="empty" id="slotsEmpty" style="display:none" data-i18n="pf.noSlots">No available slots.</div>
    </div>

    <div id="tab-reviews" style="display:none">
      <div id="reviewsHead" style="margin-bottom:18px;font-size:13px;color:var(--txt2);letter-spacing:0.04em"></div>
      <div class="review-list" id="reviews"></div>
      <div class="empty" id="reviewsEmpty" style="display:none" data-i18n="pf.noReviews">Reviews appear here after the first completed session.</div>
    </div>

    <div id="similarBlock" style="display:none;margin-top:60px;border-top:1px solid var(--border);padding-top:32px">
      <div style="font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:18px;letter-spacing:0.18em;color:var(--red2);margin-bottom:18px" data-i18n="pf.similarArtists">Similar artists</div>
      <div id="similarList" class="similar-grid"></div>
    </div>
  </div>
</div>

<div id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()" aria-label="Close">×</button>
  <button id="lb-prev" class="lb-arrow" onclick="lbPrev()" aria-label="Previous">◀</button>
  <img id="lightbox-img" src="">
  <button id="lb-next" class="lb-arrow" onclick="lbNext()" aria-label="Next">▶</button>
  <div id="lb-counter"></div>
</div>

<div id="bookModal" onclick="if(event.target===this)closeBook()">
  <div class="book-card">
    <h3>BOOK</h3>
    <div class="when" id="bm-when"></div>
    <div class="price" id="bm-price"></div>
    <div id="bm-flash"></div>

    <label data-i18n="pf.tattooSize">Tattoo size *</label>
    <div class="size-grid" id="bm-sizes"></div>

    <label data-i18n="pf.start">Start *</label>
    <div class="start-options" id="bm-starts"></div>

    <label data-i18n="pf.tattooDesc">Tattoo description *</label>
    <textarea id="bm-note" placeholder="Placement on body, motif, size (approx cm), references / inspiration, last tattoo date…"></textarea>

    <label style="display:flex;align-items:flex-start;gap:10px;margin-top:14px;text-transform:none;letter-spacing:0.04em;color:var(--txt2);font-size:12px;cursor:pointer">
      <input type="checkbox" id="bm-payfull" style="margin-top:2px;width:auto;accent-color:var(--red2)" onchange="refreshDeposit()">
      <span><b style="color:var(--txt)" data-i18n="pf.payInFull">Pay in full now</b> — nothing on-site.<br>
      <span style="color:var(--txt3);font-size:11px">Otherwise pay just the deposit — settle the rest on-site (cash/card) or the artist sends a balance payment link via InkLink after the session.</span></span>
    </label>

    <!-- Promo code — volitelné. Live preview validation přes /api/discounts/preview -->
    <label style="margin-top:14px"><span data-i18n="pf.promoCode">Promo code</span> <span style="color:var(--txt3);font-weight:400;letter-spacing:0.02em;text-transform:none" data-i18n="pf.optional">(optional)</span></label>
    <div style="display:flex;gap:8px;align-items:stretch">
      <input type="text" id="bm-discount" data-i18n-attr="pf.promoPh:placeholder" placeholder="e.g. WELCOME" style="flex:1;background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-family:inherit;font-size:13px;padding:10px 12px;outline:none;text-transform:uppercase;letter-spacing:0.04em">
      <button type="button" class="btn muted" id="bm-discount-apply" onclick="applyDiscountPreview()" style="padding:0 18px" data-i18n="pf.apply">Apply</button>
    </div>
    <div id="bm-discount-msg" style="font-size:11px;letter-spacing:0.04em;margin-top:6px;min-height:14px"></div>

    <div class="deposit-info" id="bm-deposit"></div>
    <div class="actions">
      <button class="btn muted" onclick="closeBook()" data-i18n="pf.cancel">Cancel</button>
      <button class="btn" id="bm-submit" onclick="submitBook()" data-i18n="pf.confirmBooking">Confirm booking</button>
    </div>
  </div>
</div>

<script>
const username = location.pathname.replace(/^\/profile\//, '').split('/')[0] || '';
let me = null, profile = null;
const tr = k => window.InkLinkI18N ? window.InkLinkI18N.t(k) : k;
// Storno lhůty jsou per tatér (Sprint 2). Doplňujeme je do textu, ať
// klientovi neslibujeme cizí podmínky.
function cancelText(key) {
  return tr(key)
    .replace(/\{full\}/g, (profile && profile.cancel_full_hours) || 96)
    .replace(/\{half\}/g, (profile && profile.cancel_half_hours) || 48);
}
document.addEventListener('il-i18n-applied', () => { if (profile) load(); });

function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(iso) {
  try { const d = new Date(iso); return d.toLocaleDateString('cs-CZ', {day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('cs-CZ', {hour:'2-digit',minute:'2-digit'}); }
  catch { return iso; }
}
function fmtPrice(min, max, unit) {
  const suffix = unit === 'flat' ? ' CZK' : ' CZK/h';
  if (!min && !max) return tr('pf.priceAgreed');
  if (min && max && min !== max) return `${min.toLocaleString('cs-CZ')}–${max.toLocaleString('cs-CZ')}${suffix}`;
  return `${(min||max).toLocaleString('cs-CZ')}${suffix}`;
}

async function load() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);

  // pokud nemám /profile/<x> v URL a nejsem přihlášený, jdi domů
  if (!username && !me) { location.href = '/'; return; }

  const target = username || (me && me.username);
  if (!target) { document.getElementById('loading').textContent = tr('pf.nobodyToShow'); return; }

  const res = await fetch(`/api/profile/${encodeURIComponent(target)}`);
  if (!res.ok) {
    document.getElementById('loading').textContent = tr('pf.notFound');
    return;
  }
  profile = await res.json();
  render();

  // hash routing: /profile/<u>#book-<sketchId> → auto-open booking modal pro daný sketch
  const m = (location.hash || '').match(/^#book-(\d+)$/);
  if (m) {
    if (!me) {
      // Nepřihlášený → pošli na login a vrať zpátky
      sessionStorage.setItem('postLoginRedirect', location.pathname + location.hash);
      location.href = '/login';
      return;
    }
    const item = profile.portfolio.find(p => p.id === parseInt(m[1]));
    if (!item) {
      showBookFallback(tr('pf.sketchGone'), null);
    } else if (!item.price_kc || !item.estimated_hours) {
      // Sketch nemá kompletní data → nemůžeme rezervovat, ale dáme možnost napsat tatérovi
      const missing = !item.price_kc ? tr('pf.missingPrice') : tr('pf.missingHours');
      showBookFallback(
        tr('pf.cannotBookDirect').replace('{what}', missing),
        item
      );
    } else {
      const need = +item.estimated_hours;
      const fit = profile.slots.find(s => {
        const total = (new Date(s.end_at) - new Date(s.start_at)) / 36e5;
        const occ = (s.occupied || []).reduce((sum, o) => sum + (new Date(o.end_at) - new Date(o.start_at)) / 36e5, 0);
        return total - occ >= need - 0.01;
      });
      if (fit) {
        // klik na záložku Kalendář, aby uživatel viděl kontext
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelector('.tab[data-tab="slots"]')?.classList.add('active');
        document.getElementById('tab-portfolio').style.display = 'none';
        document.getElementById('tab-slots').style.display = 'block';
        setTimeout(() => bookSlot(fit.id, item), 100);
      } else {
        showBookFallback(
          tr('pf.noSlotLongEnough').replace('{h}', need),
          item
        );
      }
    }
    history.replaceState(null, '', location.pathname);
  }
}

function showBookFallback(messageHTML, item) {
  // Plain overlay modal — vysvětlí proč to nešlo a nabídne "Send message"
  const itemBlurb = item ? `<div style="margin:14px 0;padding:10px 12px;border:1px solid var(--border2);background:var(--bg3);font-size:11px;letter-spacing:0.04em;color:var(--txt2)"><b>${escapeHtml(item.caption || 'Sketch')}</b>${item.price_kc?` · ${(+item.price_kc).toLocaleString('cs-CZ')} Kč`:''}${item.estimated_hours?` · ${item.estimated_hours} h`:''}</div>` : '';
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,16,8,0.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;font-family:\'Helvetica Neue\',\'Helvetica\',\'Arial\',sans-serif';
  overlay.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border2);max-width:440px;width:100%;padding:28px">
      <div style="font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:22px;letter-spacing:0.12em;color:var(--txt);margin-bottom:12px" data-i18n="pf.cannotBook">Booking cannot be opened</div>
      <div style="font-size:13px;color:var(--txt2);line-height:1.6">${messageHTML}</div>
      ${itemBlurb}
      <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">
        <button class="btn" data-act="msg" style="flex:1" data-i18n="pf.sendMessage">Send message</button>
        <button class="btn" data-act="close" style="flex:1;background:transparent;border:1px solid var(--border3);color:var(--txt2)" data-i18n="pf.close">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => {
    const act = e.target?.dataset?.act;
    if (act === 'close' || e.target === overlay) { overlay.remove(); }
    if (act === 'msg') {
      overlay.remove();
      location.href = `/messages?user=${encodeURIComponent(profile.username)}`;
    }
  });
}

function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('profile').style.display = 'block';
  // dname + rating pill (pokud je tatér s aspoň jednou recenzí)
  const dnameEl = document.getElementById('dname');
  dnameEl.textContent = profile.display_name;
  if (profile.is_artist && profile.rating_count > 0) {
    const r = profile.rating_avg || 0;
    const stars = renderStarsStatic(r);
    const pill = document.createElement('span');
    pill.className = 'rating-pill';
    pill.innerHTML = `${stars} <span class="num">${r.toFixed(1)}</span> <span class="cnt">(${profile.rating_count})</span>`;
    dnameEl.appendChild(pill);
  }
  document.getElementById('uname').textContent = '@' + profile.username;
  // Recenze tab visibility — jen pro artisty (jinak nemají bookings)
  if (!profile.is_artist) document.getElementById('reviewsTab').style.display = 'none';

  const avatarEl = document.getElementById('avatar');
  if (profile.avatar_url) avatarEl.innerHTML = `<img src="${escapeHtml(profile.avatar_url)}" alt="">`;
  else avatarEl.textContent = profile.initials || '?';

  // Vlastní avatar: klik → upload nové fotky bez nutnosti edit profilu
  if (profile.is_own) {
    avatarEl.classList.add('avatar-editable');
    avatarEl.title = tr('pf.changeAvatar');
    avatarEl.onclick = () => document.getElementById('avatarUploadInput').click();
  }

  if (profile.city) { document.getElementById('city').textContent = profile.city; document.getElementById('cityRow').style.display = 'inline'; }
  if (profile.studio_link) {
    // Structured studio — render jako link na /studio/<slug>
    const el = document.getElementById('studio');
    el.innerHTML = `<a href="/studio/${encodeURIComponent(profile.studio_link.slug)}" style="color:var(--txt);text-decoration:underline;text-underline-offset:3px">${escapeHtml(profile.studio_link.name)}</a>`;
    document.getElementById('studioRow').style.display = 'inline';
  } else if (profile.studio) {
    document.getElementById('studio').textContent = profile.studio;
    document.getElementById('studioRow').style.display = 'inline';
  }
  if (profile.instagram) {
    const a = document.getElementById('insta');
    a.textContent = profile.instagram;
    a.href = 'https://instagram.com/' + encodeURIComponent(profile.instagram);
    document.getElementById('instaRow').style.display = 'inline';
  }

  if (profile.styles) {
    document.getElementById('stylesRow').innerHTML = profile.styles.split(',')
      .filter(Boolean).map(s => `<span class="style-chip">${escapeHtml(s.trim())}</span>`).join('');
  }
  if (profile.bio) document.getElementById('bio').textContent = profile.bio;

  // Trust signals — jen pro tatéry, a jen ty, co klientovi pomůžou
  // rozhodnout se. Vypuštěno schválně:
  //   "tetuje od <měsíc>" — platforma běží první rok, takže tenhle odznak
  //     z každého dělá nováčka; je to negativní signál v kabátě pozitivního,
  //   "N sledujících" — marnivá metrika, o kvalitě práce neříká nic.
  // Zbylé dva odpovídají na jediné dvě otázky, které klient před rezervací
  // má: udělal to už někdy, a můžu mu zaplatit?
  if (profile.is_artist) {
    const badges = [];
    if (profile.completed_count > 0) {
      badges.push(`<span class="trust-badge"><span class="icon">✓</span> <b>${profile.completed_count}</b> ${tr('pf.completedTattoos')}</span>`);
    }
    if (profile.can_book) {
      badges.push(`<span class="trust-badge verified"><span class="icon">⌗</span> ${tr('pf.onlinePayments')}</span>`);
    }
    document.getElementById('trustRow').innerHTML = badges.join('');

    // Similar artists block — načte se asynchronně, neblokuje hlavní render
    loadSimilar(profile.username);
  }

  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  if (profile.is_own) {
    let btns = `<a class="btn" href="/artist-setup" data-i18n="pf.editProfile">Edit profile</a>`;
    if (profile.is_artist) {
      btns += ` <button class="btn muted" type="button" onclick="shareMyLink('${profile.username.replace(/'/g, "\\'")}', this)" data-i18n="pf.shareLink">Share link</button>`;
    }
    actions.innerHTML = btns;
    document.getElementById('setupLink').style.display = 'flex';
  } else if (me) {
    actions.innerHTML = `
      <button class="btn" onclick="toggleFollow()" id="followBtn">${profile.is_following ? tr('pf.following') : tr('pf.follow')}</button>
      <a class="btn muted" href="/messages?to=${encodeURIComponent(profile.username)}" data-i18n="pf.message">Message</a>
    `;
  } else {
    actions.innerHTML = `<a class="btn" href="/login" data-i18n="pf.signInToBook">Sign in to book</a>`;
  }

  document.getElementById('portfolioCount').textContent = profile.portfolio_count;
  const grid = document.getElementById('grid');
  if (!profile.portfolio.length) {
    document.getElementById('portfolioEmpty').style.display = 'block';
  } else {
    grid.innerHTML = profile.portfolio.map((p, i) => {
      const fixedPrice = p.price_kc ? `${(+p.price_kc).toLocaleString('cs-CZ')} CZK` : '';
      const hoursTxt = p.estimated_hours ? ` · ~${(+p.estimated_hours).toString().replace(/\.0$/,'')} h` : '';
      const canBookThis = !profile.is_own && p.price_kc && p.estimated_hours && profile.slots.length > 0;
      const imgs = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
      return `
      <div class="tile" onclick="openLightbox(${i}, 0)">
        <img src="/uploads/${escapeHtml(p.image)}" alt="" loading="lazy">
        <div class="tile-kind">${p.kind === 'sketch' ? 'SKETCH' : 'HEALED'}</div>
        ${imgs.length > 1 ? `<div class="tile-imgs-badge">⧉ +${imgs.length - 1}</div>` : ''}
        ${fixedPrice ? `<div class="tile-price">${fixedPrice}${hoursTxt}</div>` : ''}
        <div class="tile-overlay">
          <div class="tile-meta">${escapeHtml(p.caption || '')}</div>
        </div>
        ${canBookThis ? `<button class="tile-bookbtn" onclick="event.stopPropagation();bookPortfolioItem(${p.id})" data-i18n="pf.bookThis">Book this design</button>` : ''}
      </div>`;
    }).join('');
  }

  if (!profile.is_artist) document.getElementById('slotsTab').style.display = 'none';
  else loadProfileEvents();
  document.getElementById('slotsCount').textContent = profile.slots.length;
  const slotsEl = document.getElementById('slots');
  if (!profile.slots.length) {
    document.getElementById('slotsEmpty').style.display = 'block';
  } else {
    slotsEl.innerHTML = profile.slots.map(s => {
      const totalH = (new Date(s.end_at) - new Date(s.start_at)) / 36e5;
      const occH   = (s.occupied || []).reduce((sum, o) => sum + (new Date(o.end_at) - new Date(o.start_at)) / 36e5, 0);
      const freeH  = Math.max(0, totalH - occH);
      const totalH_disp = totalH.toFixed(1).replace(/\.0$/,'');
      const freeH_disp  = freeH.toFixed(1).replace(/\.0$/,'');
      const isFull = freeH < (s.min_duration_hours || 1) - 0.01;
      const occBadge = occH > 0
        ? `<span class="slot-deposit">${freeH_disp}/${totalH_disp} h ${tr('pf.freeHours')}${isFull?' · ' + tr('pf.fullyBooked'):''}</span>`
        : `<span class="slot-deposit">${totalH_disp} h blok</span>`;
      return `
      <div class="slot-row">
        <div class="slot-date">${fmtDate(s.start_at)}</div>
        <div class="slot-meta">
          <span class="slot-price">${fmtPrice(s.price_min, s.price_max, s.price_unit)} · deposit ${s.deposit_pct}%</span>
          ${occBadge}
          ${s.note ? `<span class="slot-note">${escapeHtml(s.note)}</span>` : ''}
        </div>
        <div class="slot-book">
          ${profile.is_own
            ? `<button class="btn muted" onclick="deleteSlot(${s.id})" data-i18n="pf.delete">Delete</button>`
            : `<button class="btn" ${(profile.can_book || true) && !isFull ? '' : 'disabled'} ${isFull?'title="Blok je plně obsazený"':''} onclick="bookSlot(${s.id})">${isFull ? tr('pf.taken') : 'Book'}</button>`}
        </div>
      </div>`;
    }).join('');
  }
}

// Akce tatéra (guest spoty, konvence, flash days). Veřejné — endpoint
// nevyžaduje přihlášení, takže je vidí i nepřihlášený návštěvník profilu.
async function loadProfileEvents() {
  try {
    const r = await fetch('/api/profile/' + encodeURIComponent(profile.username) + '/events');
    if (!r.ok) return;
    const upcoming = (await r.json()).filter(e => !e.past).slice(0, 6);
    if (!upcoming.length) return;
    document.getElementById('profileEventsList').innerHTML = upcoming.map(e => `
      <a href="/events" class="slot-row" style="border-left:3px solid #af52de;text-decoration:none">
        <div class="slot-date">${escapeHtml(fmtEventDate(e.date))}${e.time ? ' · ' + escapeHtml(e.time.slice(0,5)) : ''}</div>
        <div class="slot-meta">
          <span class="slot-price">${escapeHtml(e.title)}</span>
          ${e.genre ? `<span class="slot-deposit">${escapeHtml(e.genre)}</span>` : ''}
          ${(e.venue || e.city) ? `<span class="slot-note">${escapeHtml([e.venue, e.city].filter(Boolean).join(' · '))}</span>` : ''}
        </div>
      </a>`).join('');
    document.getElementById('profileEvents').style.display = 'block';
  } catch (_) { /* akce jsou doplněk, jejich výpadek nesmí shodit profil */ }
}

// events.date je 'YYYY-MM-DD' bez času; new Date() by to vzalo jako UTC
// půlnoc a v kladném offsetu ukázalo předchozí den.
function fmtEventDate(d) {
  const [y, m, day] = (d || '').split('-').map(Number);
  if (!y) return d || '';
  const MON = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
  return `${day}. ${MON[m - 1]} ${y}`;
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const tab = t.dataset.tab;
  document.getElementById('tab-portfolio').style.display = tab === 'portfolio' ? 'block' : 'none';
  document.getElementById('tab-slots').style.display = tab === 'slots' ? 'block' : 'none';
  document.getElementById('tab-reviews').style.display = tab === 'reviews' ? 'block' : 'none';
  if (tab === 'reviews' && !window._reviewsLoaded) loadReviews();
}));

async function loadSimilar(username) {
  try {
    const r = await fetch('/api/artists/similar/' + encodeURIComponent(username));
    if (!r.ok) return;
    const list = await r.json();
    if (!list.length) return;
    const wrap = document.getElementById('similarList');
    wrap.innerHTML = list.map(a => {
      const av = a.avatar_url
        ? `<img src="${escapeHtml(a.avatar_url)}" alt="">`
        : escapeHtml(a.initials || '?');
      const meta = [a.studio, a.city].filter(Boolean).map(escapeHtml).join(' · ') || 'artist';
      const rating = a.rating_count > 0
        ? `<div class="similar-rating">★ ${a.rating_avg.toFixed(1)} <span style="color:var(--txt3)">(${a.rating_count})</span></div>`
        : '';
      return `<a class="similar-card" href="/profile/${escapeHtml(a.username)}">
        <div class="similar-avatar">${av}</div>
        <div class="similar-name">${escapeHtml(a.display_name)}</div>
        <div class="similar-meta">${meta}</div>
        ${rating}
      </a>`;
    }).join('');
    document.getElementById('similarBlock').style.display = 'block';
  } catch {}
}

function renderStarsStatic(rating) {
  const r = Math.round(rating);
  let s = '<span class="star-static">';
  for (let i = 1; i <= 5; i++) s += `<span${i > r ? ' class="empty"' : ''}>★</span>`;
  return s + '</span>';
}

async function loadReviews() {
  const target = profile.username;
  const r = await fetch('/api/profile/' + encodeURIComponent(target) + '/reviews');
  if (!r.ok) return;
  const d = await r.json();
  window._reviewsLoaded = true;
  document.getElementById('reviewsCount').textContent = d.count;
  const head = document.getElementById('reviewsHead');
  if (d.count > 0) {
    head.innerHTML = `<b style="font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:32px;letter-spacing:0.04em;color:var(--red2)">${d.avg.toFixed(1)}</b>
      <span style="margin-left:8px">${renderStarsStatic(d.avg)}</span>
      <span style="margin-left:6px;color:var(--txt3);font-size:12px">${tr('pf.fromReviews').replace('{n}', d.count)}</span>`;
  } else {
    head.innerHTML = '';
  }

  const list = document.getElementById('reviews');
  if (!d.reviews.length) {
    document.getElementById('reviewsEmpty').style.display = 'block';
    list.innerHTML = '';
    return;
  }
  document.getElementById('reviewsEmpty').style.display = 'none';
  list.innerHTML = d.reviews.map(rv => {
    const av = rv.client && rv.client.avatar_url
      ? `<img src="${escapeHtml(rv.client.avatar_url)}" alt="">`
      : escapeHtml((rv.client && rv.client.initials) || '?');
    const date = rv.created_at ? new Date(rv.created_at).toLocaleDateString('cs-CZ', {day:'numeric',month:'long',year:'numeric'}) : '';
    const canReport = me && rv.client && me.id !== rv.client.id;
    return `
      <div class="review-item">
        <div class="review-head">
          <div class="review-avatar">${av}</div>
          <div class="review-who">
            <div><b>${escapeHtml(rv.client && rv.client.display_name || '?')}</b></div>
            <div class="meta">${escapeHtml(date)}${rv.when ? ' · sezení ' + new Date(rv.when).toLocaleDateString('cs-CZ',{day:'numeric',month:'short'}) : ''}</div>
          </div>
          <div class="review-rating">${renderStarsStatic(rv.rating)} <b style="color:var(--txt);margin-left:4px">${rv.rating}/5</b></div>
        </div>
        ${rv.text ? `<div class="review-text">${escapeHtml(rv.text)}</div>` : ''}
        ${rv.response ? `<div class="review-resp"><b data-i18n="pf.artistReply">Artist reply:</b> ${escapeHtml(rv.response)}</div>` : ''}
        ${canReport ? `<button class="review-report-btn" onclick="reportReview(${rv.id}, this)" title="${tr('pf.reportTitle')}">⚐ ${tr('pf.report')}</button>` : ''}
      </div>
    `;
  }).join('');
}

async function reportReview(rid, btn) {
  const reasons = [
    {key:'spam', label:tr('pf.reportSpam')},
    {key:'offensive', label:tr('pf.reportOffensive')},
    {key:'false', label:tr('pf.reportFake')},
    {key:'private', label:tr('pf.reportPrivate')},
    {key:'other', label:tr('pf.reportOther')},
  ];
  const promptText = tr('pf.reportReason') +
    reasons.map((r, i) => `${i + 1}) ${r.label}`).join('\n');
  const choice = prompt(promptText, '1');
  if (!choice) return;
  const idx = parseInt(choice, 10) - 1;
  if (isNaN(idx) || idx < 0 || idx >= reasons.length) {
    alert(tr('pf.invalidChoice'));
    return;
  }
  const note = prompt(tr('pf.optionalNote'), '') || '';
  btn.disabled = true;
  try {
    const r = await fetch(`/api/reviews/${rid}/report`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({reason: reasons[idx].key, note}),
    });
    const d = await r.json();
    if (d.ok) {
      btn.textContent = d.duplicate ? '⚐ ' + tr('pf.alreadyReported') : '⚐ ' + tr('pf.reported');
      btn.style.color = 'var(--txt3)';
    } else {
      btn.disabled = false;
      alert(d.error || tr('pf.reportFailed'));
    }
  } catch {
    btn.disabled = false;
    alert(tr('pf.netError'));
  }
}

async function uploadAvatar(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { alert(tr('pf.fileTooBig')); return; }
  const avatarEl = document.getElementById('avatar');
  avatarEl.classList.add('uploading');
  const fd = new FormData();
  fd.append('avatar', f);
  try {
    const r = await fetch('/api/profile/avatar', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) { alert(d.error || tr('pf.uploadFailed')); return; }
    // Cache-bust pomocí query string
    avatarEl.innerHTML = `<img src="${d.avatar_url}?t=${Date.now()}" alt="">`;
  } catch (e) {
    alert(tr('pf.netErrorRetry'));
  } finally {
    avatarEl.classList.remove('uploading');
    ev.target.value = ''; // reset, ať jde nahrát stejný soubor znovu
  }
}

async function shareMyLink(username, btn) {
  const url = location.origin + '/@' + username;
  const opts = { title: tr('pf.tattooTitle'), text: tr('pf.myInkLink'), url };
  // Native share (Capacitor iOS/Android)
  if (window.InkLinkNative && window.InkLinkNative.isNative && window.InkLinkNative.share) {
    try { const r = await window.InkLinkNative.share(opts); if (r) return; } catch (e) {}
  }
  // Web Share API (mobile browser)
  if (navigator.share) {
    try { await navigator.share(opts); return; } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  // Fallback — clipboard
  try {
    await navigator.clipboard.writeText(url);
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = tr('pf.copied');
      btn.disabled = true;
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1800);
    }
  } catch (e) {
    prompt(tr('pf.copyLink'), url);
  }
}

let pendingSlot = null;
let pendingSize = null;     // {key, hours, label}
let pendingStart = null;    // ISO string
let pendingPortfolioItem = null;   // null nebo {id, price_kc, estimated_hours, caption}
let SIZE_PRESETS = [];

async function loadSizes() {
  if (SIZE_PRESETS.length) return;
  SIZE_PRESETS = await fetch('/api/sizes').then(r => r.json()).catch(() => []);
}

function fmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString('cs-CZ', {hour:'2-digit',minute:'2-digit'}); }
  catch { return iso; }
}

/** Naive local ISO bez 'Z' (matchuje formát co server používá v DB). */
function localIso(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T`
       + `${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
}

/** Vrací volné start-časy v rámci slotu pro zvolenou délku (v h),
 *  vyhýbá se obsazeným sub-rangům. Krok = 30 min. */
function freeStartTimes(slot, durationH) {
  const out = [];
  const slotStart = new Date(slot.start_at);
  const slotEnd   = new Date(slot.end_at);
  const stepMs    = 30 * 60 * 1000;
  const durMs     = durationH * 60 * 60 * 1000;
  const occ = (slot.occupied || []).map(o => [new Date(o.start_at).getTime(), new Date(o.end_at).getTime()]);
  const now = Date.now();

  for (let t = slotStart.getTime(); t + durMs <= slotEnd.getTime() + 1; t += stepMs) {
    if (t < now) continue;                                    // ne v minulosti
    const tEnd = t + durMs;
    const overlap = occ.some(([os, oe]) => t < oe && os < tEnd);
    if (!overlap) out.push(localIso(new Date(t)));            // naive local ISO
    if (out.length >= 24) break;
  }
  return out;
}

function freeHoursTotal(slot) {
  // hrubý odhad zbývajících hours v bloku (pro UI badge)
  const total = (new Date(slot.end_at) - new Date(slot.start_at)) / 36e5;
  const occ = (slot.occupied || []).reduce((sum, o) =>
    sum + (new Date(o.end_at) - new Date(o.start_at)) / 36e5, 0);
  return Math.max(0, total - occ);
}

async function bookSlot(id, portfolioItem = null) {
  if (!me) { location.href = '/login'; return; }
  const slot = profile.slots.find(s => s.id === id);
  if (!slot) return;
  await loadSizes();
  pendingSlot = slot;
  pendingSize = null;
  pendingStart = null;
  pendingPortfolioItem = portfolioItem;

  const totalH = ((new Date(slot.end_at) - new Date(slot.start_at)) / 36e5).toFixed(1).replace(/\.0$/,'');
  document.getElementById('bm-when').textContent =
    `${fmtDate(slot.start_at)} – ${fmtTime(slot.end_at)} (${totalH} h blok) u ${profile.display_name}`;

  const unit = slot.price_unit === 'flat' ? 'celkem' : '/h';
  document.getElementById('bm-price').textContent =
    (slot.price_min || slot.price_max)
      ? `Sazba ${(slot.price_min||0).toLocaleString('cs-CZ')}–${(slot.price_max||0).toLocaleString('cs-CZ')} Kč${unit} · záloha ${slot.deposit_pct}%`
      : tr('pf.priceOnRequest').replace('{pct}', slot.deposit_pct);

  const sizesEl = document.getElementById('bm-sizes');
  const minDur = slot.min_duration_hours || 1;
  const free = freeHoursTotal(slot);

  if (portfolioItem) {
    // Portfolio fixed mode — délka je daná, velikost je "návrh", ukážeme banner
    const lockedH = +portfolioItem.estimated_hours;
    pendingSize = {key: 'fixed', hours: lockedH};
    sizesEl.innerHTML = `
      <div style="grid-column:1/-1;padding:14px;border:1px solid var(--red2);background:var(--bg3);font-size:12px;color:var(--txt);letter-spacing:0.04em;line-height:1.5">
        <div style="font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:14px;letter-spacing:0.15em;color:var(--red2);margin-bottom:6px">📌 REZERVUJEŠ KONKRÉTNÍ NÁVRH</div>
        <b>${escapeHtml(portfolioItem.caption || tr('pf.design'))}</b><br>
        Délka: <b>${lockedH} h</b> · Cena: <b>${(+portfolioItem.price_kc).toLocaleString('cs-CZ')} Kč fixně</b> (přepíše hoursovou sazbu)
      </div>`;
    document.getElementById('bm-note').value = tr('pf.bookingForDesign') + ' ' + (portfolioItem.caption || '') + '\n\n';
    if (lockedH > free + 0.01) {
      document.getElementById('bm-starts').innerHTML = `<span class="no-slots">${tr('pf.notEnoughRoom')}</span>`;
    } else {
      renderStartOptions();
    }
  } else {
    // standardní size picker
    sizesEl.innerHTML = SIZE_PRESETS.map(s => {
      const disabled = s.hours < minDur || s.hours > totalH || s.hours > free + 0.01;
      return `<div class="size-pill ${disabled?'disabled':''}" data-key="${s.key}" data-hours="${s.hours}"
                   ${disabled ? 'style="opacity:0.35;cursor:not-allowed"' : ''}>
                <div class="h">${s.hours} h</div>
                <div class="lbl">${escapeHtml(s.label)}</div>
              </div>`;
    }).join('');
    document.querySelectorAll('#bm-sizes .size-pill').forEach(p => p.addEventListener('click', () => {
      if (p.classList.contains('disabled')) return;
      document.querySelectorAll('#bm-sizes .size-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      pendingSize = {key: p.dataset.key, hours: parseFloat(p.dataset.hours)};
      pendingStart = null;
      renderStartOptions();
      refreshDeposit();
    }));
    document.getElementById('bm-starts').innerHTML = `<span class="no-slots">${tr('pf.pickSizeFirst')}</span>`;
    document.getElementById('bm-note').value = '';
  }

  document.getElementById('bm-flash').innerHTML = '';
  document.getElementById('bm-submit').disabled = false;
  // Reset checkboxu — pokud tatér preferuje 'full', zaškrtni defaultně
  const cb = document.getElementById('bm-payfull');
  if (cb) cb.checked = (profile.default_payment_mode === 'full');
  refreshDeposit();
  document.getElementById('bookModal').classList.add('show');
}

/** Quick-book z portfolio tile — najdi první vhodný blok */
function bookPortfolioItem(itemId) {
  if (!me) { location.href = '/login'; return; }
  const item = profile.portfolio.find(p => p.id === itemId);
  if (!item) return;
  if (!item.price_kc || !item.estimated_hours) {
    const missing = !item.price_kc ? tr('pf.missingPrice') : tr('pf.missingHours');
    showBookFallback(tr('pf.cannotBookDirect').replace('{what}', missing), item);
    return;
  }
  // najdi blok s dostatečným volným časem
  const need = +item.estimated_hours;
  const fit = profile.slots.find(s => freeHoursTotal(s) >= need - 0.01);
  if (!fit) {
    showBookFallback(tr('pf.noSlotLongEnough').replace('{h}', need), item);
    return;
  }
  bookSlot(fit.id, item);
}

function renderStartOptions() {
  if (!pendingSize) return;
  const opts = freeStartTimes(pendingSlot, pendingSize.hours);
  const el = document.getElementById('bm-starts');
  if (!opts.length) {
    el.innerHTML = `<span class="no-slots">${tr('pf.noRoomShorter')}</span>`;
    pendingStart = null; return;
  }
  el.innerHTML = opts.map(iso => {
    const endIso = localIso(new Date(new Date(iso).getTime() + pendingSize.hours*36e5));
    return `<div class="start-pill" data-iso="${iso}">${fmtTime(iso)}–${fmtTime(endIso)}</div>`;
  }).join('');
  el.querySelectorAll('.start-pill').forEach(p => p.addEventListener('click', () => {
    el.querySelectorAll('.start-pill').forEach(x => x.classList.remove('on'));
    p.classList.add('on');
    pendingStart = p.dataset.iso;
    refreshDeposit();
  }));
  // auto-pick první volný
  el.querySelector('.start-pill').click();
}

function refreshDeposit() {
  const dep = document.getElementById('bm-deposit');
  if (!pendingSize) { dep.innerHTML = tr('pf.pickBoth'); return; }
  // pokud rezervujeme konkrétní portfolio sketch, cena je fixní
  let total;
  if (pendingPortfolioItem && pendingPortfolioItem.price_kc) {
    total = +pendingPortfolioItem.price_kc;
  } else {
    const avgRate = pendingSlot.price_min && pendingSlot.price_max
      ? (pendingSlot.price_min + pendingSlot.price_max) / 2
      : (pendingSlot.price_min || pendingSlot.price_max || 0);
    total = pendingSlot.price_unit === 'flat' ? avgRate : avgRate * pendingSize.hours;
  }
  const depPct  = pendingSlot.deposit_pct || 30;
  const payFull = document.getElementById('bm-payfull')?.checked;
  const totalKc = Math.round(total);
  const chargedKc = payFull ? totalKc : Math.round(total * depPct / 100);
  const remainingKc = totalKc - chargedKc;

  if (!total) {
    dep.innerHTML = payFull
      ? tr('pf.agreedNoPrepay')
      : tr('pf.agreedDeposit').replace('{pct}', depPct) + '<br>' + cancelText('pf.cancelPolicy');
    return;
  }
  if (payFull) {
    dep.innerHTML = `
      Délka: <b>${pendingSize.hours} h</b> · Cena: <b>${totalKc.toLocaleString('cs-CZ')} Kč</b><br>
      <b>Platíš teď celé: ${totalKc.toLocaleString('cs-CZ')} Kč</b> · na místě už nic.<br>
      ${cancelText('pf.cancelPolicyRefund')}
    `;
  } else {
    dep.innerHTML = `
      Délka: <b>${pendingSize.hours} h</b> · Cena: <b>${totalKc.toLocaleString('cs-CZ')} Kč</b><br>
      Záloha (${depPct}%) <b>${chargedKc.toLocaleString('cs-CZ')} Kč</b> teď přes InkLink.<br>
      Zbytek <b>${remainingKc.toLocaleString('cs-CZ')} Kč</b> doplatíš na místě (hotově / kartou)
      ${tr('pf.balanceLater')}<br>
      ${cancelText('pf.cancelPolicy')}
    `;
  }
}

function closeBook() {
  document.getElementById('bookModal').classList.remove('show');
  pendingSlot = pendingSize = pendingStart = null;
  pendingPortfolioItem = null;
}

// ── Discount preview — volá /api/discounts/preview a ukazuje výsledek ────
async function applyDiscountPreview() {
  const code = (document.getElementById('bm-discount').value || '').trim().toUpperCase();
  const msg = document.getElementById('bm-discount-msg');
  if (!code) { msg.innerHTML = ''; return; }

  // Compute current gross price the same way refreshDeposit() does
  if (!pendingSize) {
    msg.innerHTML = `<span style="color:#e58787">${tr('pf.pickSizeFirst')}</span>`; return;
  }
  let total;
  if (pendingPortfolioItem && pendingPortfolioItem.price_kc) {
    total = +pendingPortfolioItem.price_kc;
  } else {
    const avgRate = pendingSlot.price_min && pendingSlot.price_max
      ? (pendingSlot.price_min + pendingSlot.price_max) / 2
      : (pendingSlot.price_min || pendingSlot.price_max || 0);
    total = avgRate * pendingSize.hours;
  }
  if (!total) {
    msg.innerHTML = `<span style="color:#e58787">${tr('pf.noPrice')}</span>`; return;
  }

  const btn = document.getElementById('bm-discount-apply');
  btn.disabled = true;
  msg.innerHTML = `<span style="color:var(--txt3)">${tr('pf.verifying')}</span>`;
  try {
    const r = await fetch('/api/discounts/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        code: code,
        gross_price_czk: Math.round(total),
        artist_id: profile.id,
      })
    });
    const d = await r.json();
    if (!r.ok) {
      msg.innerHTML = `<span style="color:#e58787">${escapeHtml(d.error || tr('pf.error'))}</span>`;
      return;
    }
    if (d.valid) {
      msg.innerHTML = `<span style="color:#7fd391">${tr('pf.discountApplied').replace('{amount}', d.amount_czk).replace('{type}', d.discount_type)}</span>`;
    } else {
      const map = {
        'DISCOUNT_TOO_LARGE':    tr('pf.codeTooLarge'),
        'DISCOUNT_NOT_ELIGIBLE': tr('pf.codeNotEligible'),
        'DISCOUNT_ALREADY_USED': tr('pf.codeUsed'),
        'UNKNOWN_CODE':          tr('pf.codeUnknown'),
        'EXPIRED':               tr('pf.codeExpired'),
        'EXHAUSTED':             tr('pf.codeExhausted'),
      };
      const human = map[d.error_code] || d.message || tr('pf.codeInvalid');
      msg.innerHTML = `<span style="color:#e58787">${escapeHtml(human)}</span>`;
    }
  } catch (e) {
    msg.innerHTML = `<span style="color:#e58787">${tr('pf.netError')}</span>`;
  } finally {
    btn.disabled = false;
  }
}

async function submitBook() {
  const note = document.getElementById('bm-note').value.trim();
  if (!pendingSize) {
    document.getElementById('bm-flash').innerHTML = `<div class="flash-modal err">${tr('pf.pickSize')}</div>`; return;
  }
  if (!pendingStart && pendingSlot.price_unit !== 'flat') {
    document.getElementById('bm-flash').innerHTML = `<div class="flash-modal err">${tr('pf.pickStart')}</div>`; return;
  }
  if (!note) {
    document.getElementById('bm-flash').innerHTML = '<div class="flash-modal err">Write what you have in mind.</div>'; return;
  }
  const btn = document.getElementById('bm-submit');
  btn.disabled = true;
  const payFull = document.getElementById('bm-payfull')?.checked || false;
  const discountCode = (document.getElementById('bm-discount')?.value || '').trim().toUpperCase();
  const r = await fetch('/api/bookings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      slot_id: pendingSlot.id,
      design_note: note,
      size_label: pendingSize.key,
      booking_start_at: pendingStart,
      portfolio_item_id: pendingPortfolioItem ? pendingPortfolioItem.id : null,
      pay_full: payFull,
      discount_code: discountCode || null,
    }),
  });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    const msg = escapeHtml(j.error || tr('pf.bookingFailed'));
    const username = profile && profile.username ? escapeHtml(profile.username) : '';
    document.getElementById('bm-flash').innerHTML =
      `<div class="flash-modal err" style="line-height:1.6">
        <div style="margin-bottom:8px"><b>${msg}</b></div>
        <div style="font-size:11px;color:var(--txt2);margin-bottom:10px">${tr('pf.tryOtherPayment')}</div>
        ${username ? `<a href="/messages?user=${username}" style="display:inline-block;padding:6px 12px;border:1px solid var(--red2);color:var(--red2);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none" data-i18n="pf.messageArtist">Message the artist →</a>` : ''}
      </div>`;
    btn.disabled = false;
    return;
  }
  const j = await r.json();
  // Live mode with deposit PI ready → redirect to Stripe Elements page
  if (j.payment && j.payment.mode === 'live' && j.payment.payment_url) {
    document.getElementById('bm-flash').innerHTML =
      `<div class="flash-modal ok">${tr('pf.bookingCreated')}</div>`;
    setTimeout(() => location.href = j.payment.payment_url, 600);
    return;
  }
  // Demo mode or live without PI (legacy)
  document.getElementById('bm-flash').innerHTML =
    `<div class="flash-modal ok">${tr('pf.bookingCreated')} ${j.demo_mode ? tr('pf.demoMode') : ''}</div>`;
  setTimeout(() => location.href = '/my-bookings', 900);
}

let _lbImages = [];
let _lbIdx = 0;

function openLightbox(itemIdx, photoIdx) {
  // backward-compat: pokud první arg je string (URL), použij ho jako single image
  if (typeof itemIdx === 'string') {
    _lbImages = [itemIdx.replace(/^\/uploads\//, '')];
    _lbIdx = 0;
  } else {
    const p = profile.portfolio[itemIdx];
    if (!p) return;
    _lbImages = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
    _lbIdx = photoIdx || 0;
  }
  _lbRender();
  document.getElementById('lightbox').classList.add('show');
}

function _lbRender() {
  if (!_lbImages[_lbIdx]) return;
  document.getElementById('lightbox-img').src = '/uploads/' + _lbImages[_lbIdx];
  const counter = document.getElementById('lb-counter');
  const prev = document.getElementById('lb-prev');
  const next = document.getElementById('lb-next');
  if (_lbImages.length > 1) {
    counter.textContent = `${_lbIdx + 1} / ${_lbImages.length}`;
    counter.classList.add('show');
    prev.classList.add('show');
    next.classList.add('show');
  } else {
    counter.classList.remove('show');
    prev.classList.remove('show');
    next.classList.remove('show');
  }
}

function lbNext() {
  if (_lbImages.length < 2) return;
  _lbIdx = (_lbIdx + 1) % _lbImages.length;
  _lbRender();
}
function lbPrev() {
  if (_lbImages.length < 2) return;
  _lbIdx = (_lbIdx - 1 + _lbImages.length) % _lbImages.length;
  _lbRender();
}

function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

window.addEventListener('keydown', e => {
  const lbOpen = document.getElementById('lightbox').classList.contains('show');
  if (e.key === 'Escape') { closeLightbox(); closeBook(); return; }
  if (!lbOpen) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); lbNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); lbPrev(); }
});

// Touch swipe na lightbox img — mobile-friendly nav
(function attachSwipe() {
  const el = document.getElementById('lightbox');
  if (!el) return;
  let touchX = 0;
  el.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e => {
    if (_lbImages.length < 2) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (dx > 50) lbPrev();
    else if (dx < -50) lbNext();
  }, {passive:true});
})();
