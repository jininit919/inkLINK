<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--bg2:#080808;--bg3:#101010;--bg4:#181818;
  --red:#333;--red2:#e8e8e8;--red3:#fff;
  --txt:#e8e8e8;--txt2:#aaa;--txt3:#777;
  --border:#1a1a1a;--border2:#222;
}
body{background:var(--bg);color:var(--txt);font-family:'DM Mono',monospace;min-height:100vh}
a{color:inherit;text-decoration:none}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:54px;gap:12px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.2em;color:var(--red2);flex:1}
.nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);border-radius:2px;font-size:14px}
.nav-icon:hover{color:var(--red2);background:var(--bg3)}

.wrap{max-width:960px;margin:0 auto;padding:84px 24px 80px}

.head{display:flex;gap:24px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:24px}
.avatar{width:120px;height:120px;border-radius:50%;background:var(--bg4);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--red2);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.head-info{flex:1;min-width:0}
.dname{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:0.05em;line-height:1.1}
.uname{color:var(--txt3);font-size:13px;letter-spacing:0.06em;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:14px;font-size:12px;color:var(--txt2);letter-spacing:0.04em}
.meta b{color:var(--txt);font-weight:400}
.bio{margin-top:14px;font-size:13px;color:var(--txt2);line-height:1.5;white-space:pre-wrap;max-width:560px}
.styles{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.style-chip{font-size:11px;padding:3px 10px;border:1px solid var(--border2);color:var(--txt2);letter-spacing:0.05em}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;padding:8px 16px;background:transparent;border:1px solid var(--red2);color:var(--red2);cursor:pointer;text-transform:uppercase}
.btn:hover{background:var(--red2);color:var(--bg)}
.btn.muted{border-color:var(--border2);color:var(--txt3)}
.btn.muted:hover{background:transparent;color:var(--txt2);border-color:var(--txt3)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border:1px solid var(--red);color:var(--red2);letter-spacing:0.1em;margin-left:8px;vertical-align:middle}

.rating-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--border2);font-size:11px;color:var(--txt2);letter-spacing:0.04em;margin-left:8px;vertical-align:middle}
.rating-pill .stars{color:#e8c87f;font-size:12px;letter-spacing:0.02em;line-height:1}
.rating-pill .num{color:var(--txt);font-weight:400}
.rating-pill .cnt{color:var(--txt3);font-size:10px}
.star-static{display:inline-flex;gap:1px;font-size:13px;color:#e8c87f;letter-spacing:0.02em;line-height:1}
.star-static .empty{color:var(--border2)}

.review-list{display:flex;flex-direction:column;gap:14px}
.review-item{padding:16px;background:var(--bg3);border:1px solid var(--border2)}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.review-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg4);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--red2);overflow:hidden;flex-shrink:0}
.review-avatar img{width:100%;height:100%;object-fit:cover}
.review-who{font-size:12px;color:var(--txt);flex:1}
.review-who .meta{color:var(--txt3);font-size:10px;letter-spacing:0.05em;margin-top:2px}
.review-rating{font-size:12px;color:#e8c87f}
.review-text{font-size:13px;color:var(--txt2);line-height:1.6;letter-spacing:0.02em;white-space:pre-wrap;word-break:break-word}
.review-resp{margin-top:12px;padding:10px 12px;background:var(--bg2);border-left:2px solid var(--red);font-size:12px;color:var(--txt2);line-height:1.5;letter-spacing:0.02em}
.review-resp b{color:var(--txt);font-weight:400}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.18em;padding:12px 20px;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--red2);border-bottom-color:var(--red2)}
.tab:hover{color:var(--txt)}
@media(max-width:560px){
  .wrap{padding:74px 14px 80px !important}
  .head{flex-direction:column;gap:14px}
  .avatar{width:88px;height:88px;font-size:32px}
  .dname{font-size:28px !important}
}
.empty{text-align:center;padding:60px 20px;color:var(--txt3);font-size:13px;letter-spacing:0.05em}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{aspect-ratio:1;background:var(--bg3);position:relative;cursor:pointer;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s}
.tile:hover img{transform:scale(1.04)}
.tile-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;opacity:0;transition:opacity 0.2s;background:linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%)}
.tile:hover .tile-overlay{opacity:1}
.tile-meta{font-size:11px;color:#fff;letter-spacing:0.04em}
.tile-kind{position:absolute;top:6px;left:6px;font-size:9px;letter-spacing:0.15em;padding:2px 6px;background:rgba(0,0,0,0.7);color:#fff}
.tile-price{position:absolute;top:6px;right:6px;font-size:10px;letter-spacing:0.06em;padding:3px 8px;background:var(--red2);color:var(--bg);font-family:'Bebas Neue',sans-serif;font-size:13px;line-height:1}
.tile-bookbtn{position:absolute;bottom:6px;left:6px;right:6px;padding:6px 10px;background:var(--red2);color:var(--bg);border:none;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity 0.15s}
.tile:hover .tile-bookbtn{opacity:0.95}
.tile-bookbtn:hover{opacity:1!important}

.slots-list{display:flex;flex-direction:column;gap:8px}
.slot-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg3);border:1px solid var(--border2)}
.slot-date{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.06em;min-width:140px}
.slot-meta{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--txt2)}
.slot-price{color:var(--txt);font-weight:400}
.slot-deposit{color:var(--txt3);font-size:11px}
.slot-note{font-size:11px;color:var(--txt3);font-style:italic;margin-top:2px}
.slot-book{margin-left:auto}
@media(max-width:560px){.slot-row{flex-direction:column;align-items:flex-start;gap:8px}.slot-book{margin-left:0;width:100%}.slot-book .btn{width:100%}}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:80vh;object-fit:contain}
#lightbox-close{position:absolute;top:16px;right:16px;color:#fff;font-size:24px;cursor:pointer;background:none;border:none}

#bookModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#bookModal.show{display:flex}
.book-card{max-width:560px;width:100%;background:var(--bg2);border:1px solid var(--border);padding:28px;max-height:90vh;overflow-y:auto}
@media(max-width:560px){#bookModal{padding:0}.book-card{max-height:100vh;height:100vh;padding:18px;border:none}}
.book-card h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.12em;margin-bottom:8px}
.book-card .when{color:var(--txt2);font-size:13px;margin-bottom:6px}
.book-card .price{color:var(--txt3);font-size:12px;letter-spacing:0.05em;margin-bottom:18px}
.book-card label{display:block;font-size:11px;letter-spacing:0.1em;color:var(--txt3);margin-bottom:6px;text-transform:uppercase;margin-top:14px}
.book-card label:first-of-type{margin-top:0}
.book-card textarea, .book-card select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-family:'DM Mono',monospace;font-size:13px;padding:10px 12px;outline:none}
.book-card textarea{min-height:100px;resize:vertical}
.book-card textarea:focus, .book-card select:focus{border-color:var(--red2)}

.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(max-width:560px){.size-grid{grid-template-columns:repeat(2,1fr)}}
.size-pill{padding:10px 6px;border:1px solid var(--border2);text-align:center;cursor:pointer;background:var(--bg3);transition:all 0.15s}
.size-pill:hover{border-color:var(--txt3)}
.size-pill.on{border-color:var(--red2);background:var(--bg4)}
.size-pill .h{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.1em;color:var(--red2);line-height:1}
.size-pill .lbl{font-size:9px;color:var(--txt3);letter-spacing:0.04em;margin-top:4px;line-height:1.3}
.size-pill.on .lbl{color:var(--txt2)}

.start-options{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.start-pill{padding:6px 12px;border:1px solid var(--border2);background:var(--bg3);font-size:12px;letter-spacing:0.04em;cursor:pointer;color:var(--txt2)}
.start-pill:hover{border-color:var(--txt3)}
.start-pill.on{border-color:var(--red2);color:var(--red2);background:var(--bg4)}
.no-slots{font-size:11px;color:#e58787;letter-spacing:0.04em;padding:8px 0}

.book-card .deposit-info{margin:14px 0 0;padding:12px 14px;background:var(--bg3);border-left:2px solid var(--red2);font-size:11px;color:var(--txt2);letter-spacing:0.04em;line-height:1.6}
.book-card .deposit-info b{color:var(--txt);font-weight:400}
.book-card .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.flash-modal{padding:10px 14px;margin:10px 0;font-size:12px;letter-spacing:0.04em}
.flash-modal.err{background:rgba(204,68,68,0.1);color:#e58787;border:1px solid rgba(204,68,68,0.3)}
.flash-modal.ok{background:rgba(76,175,80,0.1);color:#7fd391;border:1px solid rgba(76,175,80,0.3)}
</style>
</head>

<script>
const username = location.pathname.replace(/^\/profile\//, '').split('/')[0] || '';
let me = null, profile = null;

function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(iso) {
  try { const d = new Date(iso); return d.toLocaleDateString('cs-CZ', {day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('cs-CZ', {hour:'2-digit',minute:'2-digit'}); }
  catch { return iso; }
}
function fmtPrice(min, max, unit) {
  const suffix = unit === 'flat' ? ' Kč' : ' Kč/h';
  if (!min && !max) return 'cena dohodou';
  if (min && max && min !== max) return `${min.toLocaleString('cs-CZ')}–${max.toLocaleString('cs-CZ')}${suffix}`;
  return `${(min||max).toLocaleString('cs-CZ')}${suffix}`;
}

async function load() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);

  // pokud nemám /profile/<x> v URL a nejsem přihlášený, jdi domů
  if (!username && !me) { location.href = '/'; return; }

  const target = username || (me && me.username);
  if (!target) { document.getElementById('loading').textContent = 'Není koho zobrazit'; return; }

  const res = await fetch(`/api/profile/${encodeURIComponent(target)}`);
  if (!res.ok) {
    document.getElementById('loading').textContent = 'Profil nenalezen';
    return;
  }
  profile = await res.json();
  render();

  // hash routing: /profile/<u>#book-<sketchId> → auto-open booking modal pro daný sketch
  const m = (location.hash || '').match(/^#book-(\d+)$/);
  if (m && me) {
    const item = profile.portfolio.find(p => p.id === parseInt(m[1]));
    if (item && item.price_kc && item.estimated_hours) {
      // simulace bookPortfolioItem ale bez double-fetch
      const need = +item.estimated_hours;
      const fit = profile.slots.find(s => {
        const total = (new Date(s.end_at) - new Date(s.start_at)) / 36e5;
        const occ = (s.occupied || []).reduce((sum, o) => sum + (new Date(o.end_at) - new Date(o.start_at)) / 36e5, 0);
        return total - occ >= need - 0.01;
      });
      if (fit) {
        // klik na záložku Kalendář, aby uživatel viděl kontext
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelector('.tab[data-tab="slots"]')?.classList.add('active');
        document.getElementById('tab-portfolio').style.display = 'none';
        document.getElementById('tab-slots').style.display = 'block';
        setTimeout(() => bookSlot(fit.id, item), 100);
      } else {
        alert('Tatér zatím nemá dost volného času pro tento návrh.');
      }
    }
    history.replaceState(null, '', location.pathname);
  }
}

function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('profile').style.display = 'block';
  // dname + rating pill (pokud je tatér s aspoň jednou recenzí)
  const dnameEl = document.getElementById('dname');
  dnameEl.textContent = profile.display_name;
  if (profile.is_artist && profile.rating_count > 0) {
    const r = profile.rating_avg || 0;
    const stars = renderStarsStatic(r);
    const pill = document.createElement('span');
    pill.className = 'rating-pill';
    pill.innerHTML = `${stars} <span class="num">${r.toFixed(1)}</span> <span class="cnt">(${profile.rating_count})</span>`;
    dnameEl.appendChild(pill);
  }
  document.getElementById('uname').textContent = '@' + profile.username;
  if (profile.is_artist) document.getElementById('artistBadge').style.display = 'inline-block';
  // Recenze tab visibility — jen pro artisty (jinak nemají bookings)
  if (!profile.is_artist) document.getElementById('reviewsTab').style.display = 'none';

  if (profile.avatar_url) document.getElementById('avatar').innerHTML = `<img src="${escapeHtml(profile.avatar_url)}" alt="">`;
  else document.getElementById('avatar').textContent = profile.initials || '?';

  if (profile.city) { document.getElementById('city').textContent = profile.city; document.getElementById('cityRow').style.display = 'inline'; }
  if (profile.studio) { document.getElementById('studio').textContent = profile.studio; document.getElementById('studioRow').style.display = 'inline'; }
  if (profile.instagram) {
    const a = document.getElementById('insta');
    a.textContent = profile.instagram;
    a.href = 'https://instagram.com/' + encodeURIComponent(profile.instagram);
    document.getElementById('instaRow').style.display = 'inline';
  }

  if (profile.styles) {
    document.getElementById('stylesRow').innerHTML = profile.styles.split(',')
      .filter(Boolean).map(s => `<span class="style-chip">${escapeHtml(s.trim())}</span>`).join('');
  }
  if (profile.bio) document.getElementById('bio').textContent = profile.bio;

  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  if (profile.is_own) {
    actions.innerHTML = `<a class="btn" href="/artist-setup">Editovat profil</a>`;
    document.getElementById('setupLink').style.display = 'flex';
  } else if (me) {
    actions.innerHTML = `
      <button class="btn" onclick="toggleFollow()" id="followBtn">${profile.is_following ? 'Sleduješ' : 'Sledovat'}</button>
      <a class="btn muted" href="/messages?to=${encodeURIComponent(profile.username)}">Zpráva</a>
    `;
  } else {
    actions.innerHTML = `<a class="btn" href="/login">Přihlas se pro rezervaci</a>`;
  }

  document.getElementById('portfolioCount').textContent = profile.portfolio_count;
  const grid = document.getElementById('grid');
  if (!profile.portfolio.length) {
    document.getElementById('portfolioEmpty').style.display = 'block';
  } else {
    grid.innerHTML = profile.portfolio.map(p => {
      const fixedPrice = p.price_kc ? `${(+p.price_kc).toLocaleString('cs-CZ')} Kč` : '';
      const hoursTxt = p.estimated_hours ? ` · ~${(+p.estimated_hours).toString().replace(/\.0$/,'')} h` : '';
      const canBookThis = !profile.is_own && p.price_kc && p.estimated_hours && profile.slots.length > 0;
      return `
      <div class="tile" onclick="openLightbox('/uploads/${escapeHtml(p.image)}', ${p.id})">
        <img src="/uploads/${escapeHtml(p.image)}" alt="" loading="lazy">
        <div class="tile-kind">${p.kind === 'sketch' ? 'SKICA' : 'HOTOVÉ'}</div>
        ${fixedPrice ? `<div class="tile-price">${fixedPrice}${hoursTxt}</div>` : ''}
        <div class="tile-overlay">
          <div class="tile-meta">${escapeHtml(p.caption || '')}</div>
        </div>
        ${canBookThis ? `<button class="tile-bookbtn" onclick="event.stopPropagation();bookPortfolioItem(${p.id})">Rezervovat tento návrh</button>` : ''}
      </div>`;
    }).join('');
  }

  if (!profile.is_artist) document.getElementById('slotsTab').style.display = 'none';
  document.getElementById('slotsCount').textContent = profile.slots.length;
  const slotsEl = document.getElementById('slots');
  if (!profile.slots.length) {
    document.getElementById('slotsEmpty').style.display = 'block';
  } else {
    slotsEl.innerHTML = profile.slots.map(s => {
      const totalH = (new Date(s.end_at) - new Date(s.start_at)) / 36e5;
      const occH   = (s.occupied || []).reduce((sum, o) => sum + (new Date(o.end_at) - new Date(o.start_at)) / 36e5, 0);
      const freeH  = Math.max(0, totalH - occH);
      const totalH_disp = totalH.toFixed(1).replace(/\.0$/,'');
      const freeH_disp  = freeH.toFixed(1).replace(/\.0$/,'');
      const isFull = freeH < (s.min_duration_hours || 1) - 0.01;
      const occBadge = occH > 0
        ? `<span class="slot-deposit">${freeH_disp}/${totalH_disp} h volné${isFull?' · OBSAZENO':''}</span>`
        : `<span class="slot-deposit">${totalH_disp} h blok</span>`;
      return `
      <div class="slot-row">
        <div class="slot-date">${fmtDate(s.start_at)}</div>
        <div class="slot-meta">
          <span class="slot-price">${fmtPrice(s.price_min, s.price_max, s.price_unit)} · záloha ${s.deposit_pct}%</span>
          ${occBadge}
          ${s.note ? `<span class="slot-note">${escapeHtml(s.note)}</span>` : ''}
        </div>
        <div class="slot-book">
          ${profile.is_own
            ? `<button class="btn muted" onclick="deleteSlot(${s.id})">Smazat</button>`
            : `<button class="btn" ${(profile.can_book || true) && !isFull ? '' : 'disabled'} ${isFull?'title="Blok je plně obsazený"':''} onclick="bookSlot(${s.id})">${isFull ? 'Obsazeno' : 'Rezervovat'}</button>`}
        </div>
      </div>`;
    }).join('');
  }
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const tab = t.dataset.tab;
  document.getElementById('tab-portfolio').style.display = tab === 'portfolio' ? 'block' : 'none';
  document.getElementById('tab-slots').style.display = tab === 'slots' ? 'block' : 'none';
  document.getElementById('tab-reviews').style.display = tab === 'reviews' ? 'block' : 'none';
  if (tab === 'reviews' && !window._reviewsLoaded) loadReviews();
}));

function renderStarsStatic(rating) {
  const r = Math.round(rating);
  let s = '<span class="star-static">';
  for (let i = 1; i <= 5; i++) s += `<span${i > r ? ' class="empty"' : ''}>★</span>`;
  return s + '</span>';
}

async function loadReviews() {
  const target = profile.username;
  const r = await fetch('/api/profile/' + encodeURIComponent(target) + '/reviews');
  if (!r.ok) return;
  const d = await r.json();
  window._reviewsLoaded = true;
  document.getElementById('reviewsCount').textContent = d.count;
  const head = document.getElementById('reviewsHead');
  if (d.count > 0) {
    head.innerHTML = `<b style="font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:0.04em;color:var(--red2)">${d.avg.toFixed(1)}</b>
      <span style="margin-left:8px">${renderStarsStatic(d.avg)}</span>
      <span style="margin-left:6px;color:var(--txt3);font-size:12px">z ${d.count} recenz${d.count===1?'e':d.count<5?'í':'í'}</span>`;
  } else {
    head.innerHTML = '';
  }

  const list = document.getElementById('reviews');
  if (!d.reviews.length) {
    document.getElementById('reviewsEmpty').style.display = 'block';
    list.innerHTML = '';
    return;
  }
  document.getElementById('reviewsEmpty').style.display = 'none';
  list.innerHTML = d.reviews.map(rv => {
    const av = rv.client && rv.client.avatar_url
      ? `<img src="${escapeHtml(rv.client.avatar_url)}" alt="">`
      : escapeHtml((rv.client && rv.client.initials) || '?');
    const date = rv.created_at ? new Date(rv.created_at).toLocaleDateString('cs-CZ', {day:'numeric',month:'long',year:'numeric'}) : '';
    return `
      <div class="review-item">
        <div class="review-head">
          <div class="review-avatar">${av}</div>
          <div class="review-who">
            <div><b>${escapeHtml(rv.client && rv.client.display_name || '?')}</b></div>
            <div class="meta">${escapeHtml(date)}${rv.when ? ' · sezení ' + new Date(rv.when).toLocaleDateString('cs-CZ',{day:'numeric',month:'short'}) : ''}</div>
          </div>
          <div class="review-rating">${renderStarsStatic(rv.rating)} <b style="color:var(--txt);margin-left:4px">${rv.rating}/5</b></div>
        </div>
        ${rv.text ? `<div class="review-text">${escapeHtml(rv.text)}</div>` : ''}
        ${rv.response ? `<div class="review-resp"><b>Odpověď tatéra:</b> ${escapeHtml(rv.response)}</div>` : ''}
      </div>
    `;
  }).join('');
}

async function toggleFollow() {
  const r = await fetch(`/api/follow/${profile.id}`, {method:'POST'}).then(r=>r.json()).catch(()=>null);
  if (r) {
    profile.is_following = r.following;
    document.getElementById('followBtn').textContent = r.following ? 'Sleduješ' : 'Sledovat';
  }
}

async function deleteSlot(id) {
  if (!confirm('Smazat termín?')) return;
  const r = await fetch(`/api/slots/${id}`, {method:'DELETE'});
  if (r.ok) { profile.slots = profile.slots.filter(s => s.id !== id); render(); }
  else { alert((await r.json()).error || 'Nepodařilo se smazat'); }
}

let pendingSlot = null;
let pendingSize = null;     // {key, hours, label}
let pendingStart = null;    // ISO string
let pendingPortfolioItem = null;   // null nebo {id, price_kc, estimated_hours, caption}
let SIZE_PRESETS = [];

async function loadSizes() {
  if (SIZE_PRESETS.length) return;
  SIZE_PRESETS = await fetch('/api/sizes').then(r => r.json()).catch(() => []);
}

function fmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString('cs-CZ', {hour:'2-digit',minute:'2-digit'}); }
  catch { return iso; }
}

/** Naive local ISO bez 'Z' (matchuje formát co server používá v DB). */
function localIso(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T`
       + `${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
}

/** Vrací volné start-časy v rámci slotu pro zvolenou délku (v h),
 *  vyhýbá se obsazeným sub-rangům. Krok = 30 min. */
function freeStartTimes(slot, durationH) {
  const out = [];
  const slotStart = new Date(slot.start_at);
  const slotEnd   = new Date(slot.end_at);
  const stepMs    = 30 * 60 * 1000;
  const durMs     = durationH * 60 * 60 * 1000;
  const occ = (slot.occupied || []).map(o => [new Date(o.start_at).getTime(), new Date(o.end_at).getTime()]);
  const now = Date.now();

  for (let t = slotStart.getTime(); t + durMs <= slotEnd.getTime() + 1; t += stepMs) {
    if (t < now) continue;                                    // ne v minulosti
    const tEnd = t + durMs;
    const overlap = occ.some(([os, oe]) => t < oe && os < tEnd);
    if (!overlap) out.push(localIso(new Date(t)));            // naive local ISO
    if (out.length >= 24) break;
  }
  return out;
}

function freeHoursTotal(slot) {
  // hrubý odhad zbývajících hodin v bloku (pro UI badge)
  const total = (new Date(slot.end_at) - new Date(slot.start_at)) / 36e5;
  const occ = (slot.occupied || []).reduce((sum, o) =>
    sum + (new Date(o.end_at) - new Date(o.start_at)) / 36e5, 0);
  return Math.max(0, total - occ);
}

async function bookSlot(id, portfolioItem = null) {
  if (!me) { location.href = '/login'; return; }
  const slot = profile.slots.find(s => s.id === id);
  if (!slot) return;
  await loadSizes();
  pendingSlot = slot;
  pendingSize = null;
  pendingStart = null;
  pendingPortfolioItem = portfolioItem;

  const totalH = ((new Date(slot.end_at) - new Date(slot.start_at)) / 36e5).toFixed(1).replace(/\.0$/,'');
  document.getElementById('bm-when').textContent =
    `${fmtDate(slot.start_at)} – ${fmtTime(slot.end_at)} (${totalH} h blok) u ${profile.display_name}`;

  const unit = slot.price_unit === 'flat' ? 'celkem' : '/h';
  document.getElementById('bm-price').textContent =
    (slot.price_min || slot.price_max)
      ? `Sazba ${(slot.price_min||0).toLocaleString('cs-CZ')}–${(slot.price_max||0).toLocaleString('cs-CZ')} Kč${unit} · záloha ${slot.deposit_pct}%`
      : `Cena dohodou · záloha ${slot.deposit_pct}%`;

  const sizesEl = document.getElementById('bm-sizes');
  const minDur = slot.min_duration_hours || 1;
  const free = freeHoursTotal(slot);

  if (portfolioItem) {
    // Portfolio fixed mode — délka je daná, velikost je "návrh", ukážeme banner
    const lockedH = +portfolioItem.estimated_hours;
    pendingSize = {key: 'fixed', hours: lockedH};
    sizesEl.innerHTML = `
      <div style="grid-column:1/-1;padding:14px;border:1px solid var(--red2);background:var(--bg3);font-size:12px;color:var(--txt);letter-spacing:0.04em;line-height:1.5">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.15em;color:var(--red2);margin-bottom:6px">📌 REZERVUJEŠ KONKRÉTNÍ NÁVRH</div>
        <b>${escapeHtml(portfolioItem.caption || 'Návrh')}</b><br>
        Délka: <b>${lockedH} h</b> · Cena: <b>${(+portfolioItem.price_kc).toLocaleString('cs-CZ')} Kč fixně</b> (přepíše hodinovou sazbu)
      </div>`;
    document.getElementById('bm-note').value = `Rezervace na návrh: ${portfolioItem.caption || ''}\n\n`;
    if (lockedH > free + 0.01) {
      document.getElementById('bm-starts').innerHTML = '<span class="no-slots">Pro tento návrh není v bloku dost volného místa.</span>';
    } else {
      renderStartOptions();
    }
  } else {
    // standardní size picker
    sizesEl.innerHTML = SIZE_PRESETS.map(s => {
      const disabled = s.hours < minDur || s.hours > totalH || s.hours > free + 0.01;
      return `<div class="size-pill ${disabled?'disabled':''}" data-key="${s.key}" data-hours="${s.hours}"
                   ${disabled ? 'style="opacity:0.35;cursor:not-allowed"' : ''}>
                <div class="h">${s.hours} h</div>
                <div class="lbl">${escapeHtml(s.label)}</div>
              </div>`;
    }).join('');
    document.querySelectorAll('#bm-sizes .size-pill').forEach(p => p.addEventListener('click', () => {
      if (p.classList.contains('disabled')) return;
      document.querySelectorAll('#bm-sizes .size-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      pendingSize = {key: p.dataset.key, hours: parseFloat(p.dataset.hours)};
      pendingStart = null;
      renderStartOptions();
      refreshDeposit();
    }));
    document.getElementById('bm-starts').innerHTML = '<span class="no-slots">Vyber nejdřív velikost.</span>';
    document.getElementById('bm-note').value = '';
  }

  document.getElementById('bm-flash').innerHTML = '';
  document.getElementById('bm-submit').disabled = false;
  // Reset checkboxu — pokud tatér preferuje 'full', zaškrtni defaultně
  const cb = document.getElementById('bm-payfull');
  if (cb) cb.checked = (profile.default_payment_mode === 'full');
  refreshDeposit();
  document.getElementById('bookModal').classList.add('show');
}

/** Quick-book z portfolio tile — najdi první vhodný blok */
function bookPortfolioItem(itemId) {
  if (!me) { location.href = '/login'; return; }
  const item = profile.portfolio.find(p => p.id === itemId);
  if (!item) return;
  if (!item.price_kc || !item.estimated_hours) {
    alert('Tento návrh nemá nastavenou cenu / délku.'); return;
  }
  // najdi blok s dostatečným volným časem
  const need = +item.estimated_hours;
  const fit = profile.slots.find(s => freeHoursTotal(s) >= need - 0.01);
  if (!fit) {
    alert(`Žádný volný blok ${need} h+ — tatér zatím nenabízí dost volného času pro tento návrh.`);
    return;
  }
  bookSlot(fit.id, item);
}

function renderStartOptions() {
  if (!pendingSize) return;
  const opts = freeStartTimes(pendingSlot, pendingSize.hours);
  const el = document.getElementById('bm-starts');
  if (!opts.length) {
    el.innerHTML = '<span class="no-slots">Pro tuto délku není volný čas v bloku — zkus kratší velikost.</span>';
    pendingStart = null; return;
  }
  el.innerHTML = opts.map(iso => {
    const endIso = localIso(new Date(new Date(iso).getTime() + pendingSize.hours*36e5));
    return `<div class="start-pill" data-iso="${iso}">${fmtTime(iso)}–${fmtTime(endIso)}</div>`;
  }).join('');
  el.querySelectorAll('.start-pill').forEach(p => p.addEventListener('click', () => {
    el.querySelectorAll('.start-pill').forEach(x => x.classList.remove('on'));
    p.classList.add('on');
    pendingStart = p.dataset.iso;
    refreshDeposit();
  }));
  // auto-pick první volný
  el.querySelector('.start-pill').click();
}

function refreshDeposit() {
  const dep = document.getElementById('bm-deposit');
  if (!pendingSize) { dep.innerHTML = 'Vyber velikost a začátek pro výpočet zálohy.'; return; }
  // pokud rezervujeme konkrétní portfolio sketch, cena je fixní
  let total;
  if (pendingPortfolioItem && pendingPortfolioItem.price_kc) {
    total = +pendingPortfolioItem.price_kc;
  } else {
    const avgRate = pendingSlot.price_min && pendingSlot.price_max
      ? (pendingSlot.price_min + pendingSlot.price_max) / 2
      : (pendingSlot.price_min || pendingSlot.price_max || 0);
    total = pendingSlot.price_unit === 'flat' ? avgRate : avgRate * pendingSize.hours;
  }
  const depPct  = pendingSlot.deposit_pct || 30;
  const payFull = document.getElementById('bm-payfull')?.checked;
  const totalKc = Math.round(total);
  const chargedKc = payFull ? totalKc : Math.round(total * depPct / 100);
  const remainingKc = totalKc - chargedKc;

  if (!total) {
    dep.innerHTML = payFull
      ? `Cena dohodou — předem nelze zaplatit (neznáme částku). Odškrtni "Zaplatit celé předem" nebo se domluv s tatérem.`
      : `Cena dohodou. Záloha bude ${depPct}% z dohodnuté ceny.<br>Storno: zdarma 96+ h předem · 50% mezi 96–48 h · 0% pod 48 h.`;
    return;
  }
  if (payFull) {
    dep.innerHTML = `
      Délka: <b>${pendingSize.hours} h</b> · Cena: <b>${totalKc.toLocaleString('cs-CZ')} Kč</b><br>
      <b>Platíš teď celé: ${totalKc.toLocaleString('cs-CZ')} Kč</b> · na místě už nic.<br>
      Storno: zdarma 96+ h předem · 50% mezi 96–48 h · 0% pod 48 h (refund se počítá ze zaplacené částky).
    `;
  } else {
    dep.innerHTML = `
      Délka: <b>${pendingSize.hours} h</b> · Cena: <b>${totalKc.toLocaleString('cs-CZ')} Kč</b><br>
      Záloha (${depPct}%) <b>${chargedKc.toLocaleString('cs-CZ')} Kč</b> teď přes InkLink.<br>
      Zbytek <b>${remainingKc.toLocaleString('cs-CZ')} Kč</b> doplatíš na místě (hotově / kartou)
      nebo ti tatér po sezení pošle link na doplatek přes InkLink.<br>
      Storno: zdarma 96+ h předem · 50% mezi 96–48 h · 0% pod 48 h.
    `;
  }
}

function closeBook() {
  document.getElementById('bookModal').classList.remove('show');
  pendingSlot = pendingSize = pendingStart = null;
  pendingPortfolioItem = null;
}

async function submitBook() {
  const note = document.getElementById('bm-note').value.trim();
  if (!pendingSize) {
    document.getElementById('bm-flash').innerHTML = '<div class="flash-modal err">Vyber velikost tetování.</div>'; return;
  }
  if (!pendingStart && pendingSlot.price_unit !== 'flat') {
    document.getElementById('bm-flash').innerHTML = '<div class="flash-modal err">Vyber čas začátku.</div>'; return;
  }
  if (!note) {
    document.getElementById('bm-flash').innerHTML = '<div class="flash-modal err">Napiš tatérovi co chceš.</div>'; return;
  }
  const btn = document.getElementById('bm-submit');
  btn.disabled = true;
  const payFull = document.getElementById('bm-payfull')?.checked || false;
  const r = await fetch('/api/bookings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      slot_id: pendingSlot.id,
      design_note: note,
      size_label: pendingSize.key,
      booking_start_at: pendingStart,
      portfolio_item_id: pendingPortfolioItem ? pendingPortfolioItem.id : null,
      pay_full: payFull,
    }),
  });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    document.getElementById('bm-flash').innerHTML =
      `<div class="flash-modal err">${escapeHtml(j.error || 'Rezervace selhala')}</div>`;
    btn.disabled = false;
    return;
  }
  const j = await r.json();
  document.getElementById('bm-flash').innerHTML =
    `<div class="flash-modal ok">Rezervace vytvořena ✓ ${j.demo_mode ? '(demo režim — bez reálné platby)' : ''}</div>`;
  setTimeout(() => location.href = '/my-bookings', 900);
}

function openLightbox(src, _itemId) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
window.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeBook(); } });

load();
</script>
