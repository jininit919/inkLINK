<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#faf8f3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="InkLink">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>InkLink — Obnova hesla</title>
<script>document.documentElement.dataset.theme='paper';try{localStorage.setItem('hmo_theme','paper')}catch(e){}</script>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;--red3: #000;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

.brand{display:block;height:70px;width:auto;margin:0 auto 6px;object-fit:contain}
.brand-sub{font-size:10px;color:var(--txt3);letter-spacing:0.15em;text-align:center;margin-bottom:40px}

.card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border2);padding:32px}
.card-title{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:20px;letter-spacing:0.15em;margin-bottom:8px}
.card-sub{font-size:11px;color:var(--txt2);letter-spacing:0.04em;line-height:1.6;margin-bottom:28px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--txt3)}
.field input{background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:12px;padding:10px 14px;letter-spacing:0.05em;outline:none;transition:border-color 0.2s;width:100%}
.field input::placeholder{color:var(--txt3)}
.field input:focus{border-color:var(--red)}

.submit-btn{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:15px;letter-spacing:0.15em;padding:14px;background:var(--red2);color:var(--bg);border:none;cursor:pointer;transition:all 0.15s;width:100%;margin-top:4px}
.submit-btn:hover{background:var(--red3)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}

.msg{font-size:11px;letter-spacing:0.04em;padding:10px 14px;margin-bottom:16px;display:none}
.msg.error{color:#e58787;background:rgba(204,68,68,0.1);border:1px solid rgba(204,68,68,0.3)}
.msg.success{color:#7fd391;background:rgba(127,211,145,0.08);border:1px solid rgba(127,211,145,0.3)}
.msg.visible{display:block}

.back{font-size:10px;color:var(--txt3);letter-spacing:0.08em;text-align:center;margin-top:20px}
.back a{color:var(--txt3);text-decoration:none}
.back a:hover{color:var(--txt2)}
</style>
</head>
<body>

<img class="brand" src="/img/inklink-logo.png" alt="inklink">
<div class="brand-sub">Tattoo Booking Network</div>

<!-- Step 1: request reset -->
<div class="card" id="stepRequest">
  <div class="card-title">Obnova hesla</div>
  <div class="card-sub">Zadej e-mail, kterým jsi se registroval(a). Pošleme ti link na nastavení nového hesla.</div>
  <div class="msg" id="reqMsg"></div>
  <form onsubmit="requestReset(event)">
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="reqEmail" placeholder="tvuj@email.cz" autocomplete="email" required>
    </div>
    <button class="submit-btn" type="submit" id="reqBtn">POSLAT LINK</button>
  </form>
  <div class="back"><a href="/login"><svg class="icon icon-sm" style="vertical-align:-2px;margin-right:5px"><use href="#i-arrow-left"/></svg>Zpět na přihlášení</a></div>
</div>

<!-- Step 2: set new password -->
<div class="card" id="stepReset" style="display:none">
  <div class="card-title">Nové heslo</div>
  <div class="card-sub">Zadej nové heslo pro svůj účet.</div>
  <div class="msg" id="resetMsg"></div>
  <form onsubmit="submitReset(event)">
    <div class="field">
      <label>Nové heslo (min. 6 znaků)</label>
      <input type="password" id="newPassword" placeholder="••••••" autocomplete="new-password" minlength="6" required>
    </div>
    <div class="field">
      <label>Heslo ještě jednou</label>
      <input type="password" id="newPassword2" placeholder="••••••" autocomplete="new-password" minlength="6" required>
    </div>
    <button class="submit-btn" type="submit" id="resetBtn">ULOŽIT HESLO</button>
  </form>
  <div class="back"><a href="/login"><svg class="icon icon-sm" style="vertical-align:-2px;margin-right:5px"><use href="#i-arrow-left"/></svg>Zpět na přihlášení</a></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');

if (token) {
  document.getElementById('stepRequest').style.display = 'none';
  document.getElementById('stepReset').style.display   = 'block';
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type + ' visible';
}

async function requestReset(e) {
  e.preventDefault();
  const btn   = document.getElementById('reqBtn');
  const email = document.getElementById('reqEmail').value;
  btn.disabled = true; btn.textContent = 'POSÍLÁM…';
  const res  = await fetch('/api/forgot-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email})
  });
  const data = await res.json();
  if (data.ok) {
    showMsg('reqMsg', 'Pokud účet s tímto e-mailem existuje, link jsme poslali. Zkontroluj i spam.', 'success');
    document.getElementById('reqEmail').disabled = true;
    btn.textContent = 'ODESLÁNO';
  } else {
    showMsg('reqMsg', data.error || 'Něco se pokazilo', 'error');
    btn.disabled = false; btn.textContent = 'POSLAT LINK';
  }
}

async function submitReset(e) {
  e.preventDefault();
  const btn  = document.getElementById('resetBtn');
  const pw   = document.getElementById('newPassword').value;
  const pw2  = document.getElementById('newPassword2').value;
  if (pw !== pw2) { showMsg('resetMsg', 'Hesla se neshodují', 'error'); return; }
  btn.disabled = true; btn.textContent = 'UKLÁDÁM…';
  const res  = await fetch('/api/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token, password: pw})
  });
  const data = await res.json();
  if (data.ok) {
    showMsg('resetMsg', 'Heslo uloženo. Přesměrováváme…', 'success');
    btn.textContent = 'ULOŽENO';
    setTimeout(() => window.location.href = '/login', 2000);
  } else {
    showMsg('resetMsg', data.error || 'Něco se pokazilo', 'error');
    btn.disabled = false; btn.textContent = 'ULOŽIT HESLO';
  }
}
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
<script src="/icons.js?v=2"></script>
<script src="/icons.js?v=2"></script>
<script src="/ink-trail.js?v=1"></script>
<script src="/cookie-consent.js?v=1"></script>
<script src="/native.js?v=1"></script>
</body>
</html>
