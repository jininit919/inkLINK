<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<style>html,body{background:#faf8f3;margin:0}</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#faf8f3">
<meta name="apple-mobile-web-app-title" content="InkLink — Deposit">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pay deposit — InkLink</title>
<meta name="robots" content="noindex">
<script>document.documentElement.dataset.theme='paper';try{localStorage.setItem('hmo_theme','paper')}catch(e){}</script>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #faf8f3;--bg2: #f5f1e8;--bg3: #ede8db;--bg4: #e3ddca;
  --red: #1a1a1a;--red2: #0a0a0a;
  --txt: #0a0a0a;--txt2: #2a2a2a;--txt3: #5a5a5a;
  --border: #d4cfbf;--border2: #a8a399;
  --ok:#7fd391;--err:#e58787;--warn:#e8c87f;--accent:#c62828;
}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px}
.brand{display:block;height:56px;width:auto;margin:24px auto 4px;object-fit:contain}
.brand-sub{font-size:10px;color:var(--txt3);letter-spacing:0.15em;text-align:center;margin-bottom:36px}

.card{width:100%;max-width:440px;background:var(--bg2);border:1px solid var(--border)}
.card-head{padding:24px;border-bottom:1px solid var(--border)}
.card-head h1{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:22px;letter-spacing:0.12em;margin-bottom:6px}
.card-head .sub{font-size:11px;color:var(--txt3);letter-spacing:0.06em}
.card-body{padding:22px}

.who{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--red2);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.who-info{flex:1;min-width:0}
.who-info .n{font-size:14px;color:var(--txt);font-weight:600;letter-spacing:0.02em}
.who-info .s{font-size:11px;color:var(--txt3);letter-spacing:0.04em;margin-top:2px}

.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:12px;letter-spacing:0.03em}
.kv .k{color:var(--txt3);text-transform:uppercase;letter-spacing:0.1em;font-size:10px}
.kv .v{color:var(--txt);font-weight:500}

.note{margin:10px 0;padding:10px 12px;background:var(--bg3);border-left:2px solid var(--border2);font-size:12px;color:var(--txt2);line-height:1.5;white-space:pre-wrap;word-break:break-word}

.amount{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:36px;color:var(--accent);text-align:center;letter-spacing:0.04em;margin:18px 0 6px}
.amount-sub{text-align:center;font-size:10px;color:var(--txt3);letter-spacing:0.1em;margin-bottom:18px}

.element-wrap{background:var(--bg);border:1px solid var(--border2);padding:13px 14px;margin:10px 0 14px;min-height:46px}
.element-wrap.focused{border-color:var(--red2)}
.element-wrap.invalid{border-color:var(--err)}

.btn{font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;font-size:13px;letter-spacing:0.15em;text-transform:uppercase;padding:14px 18px;background:var(--red2);color:var(--bg);border:none;cursor:pointer;width:100%;transition:background 0.15s}
.btn:hover:not(:disabled){background:var(--red)}
.btn:disabled{opacity:0.55;cursor:wait}

.flash{margin-top:14px;padding:10px 12px;font-size:11px;letter-spacing:0.04em;line-height:1.5}
.flash.err{background:rgba(229,135,135,0.12);border:1px solid rgba(229,135,135,0.4);color:#9b3636}
.flash.ok{background:rgba(127,211,145,0.12);border:1px solid rgba(127,211,145,0.4);color:#2e7d4f}

.terms-hint{font-size:10px;color:var(--txt3);letter-spacing:0.04em;line-height:1.6;margin-top:14px}
.terms-hint a{color:var(--accent);border-bottom:1px solid currentColor}

.foot-link{margin-top:28px;font-size:11px;letter-spacing:0.08em}
.foot-link a{color:var(--txt3)}
.foot-link a:hover{color:var(--accent)}

.success-banner{background:rgba(127,211,145,0.12);border:1px solid rgba(127,211,145,0.4);padding:14px;color:#2e7d4f;text-align:center;letter-spacing:0.04em;font-size:13px;margin-bottom:14px}

.error-card{padding:24px;color:var(--err);text-align:center;font-size:13px;letter-spacing:0.04em}
</style>
</head>
<body>

<img class="brand" src="/img/inklink-logo.png" alt="inklink">
<div class="brand-sub">Booking deposit</div>

<div class="card" id="card">
  <div class="il-loading-row" style="padding:24px"><span class="il-spinner"></span> Loading…</div>
</div>

<div class="foot-link">
  <a href="/"><svg class="icon icon-sm" style="vertical-align:-2px;margin-right:5px"><use href="#i-arrow-left"/></svg>Back to InkLink</a>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
const bid = parseInt(location.pathname.replace(/^\/pay\//, '').split('/')[0] || '0');
let stripe = null;
let cardElement = null;
let clientSecret = null;

function fmtKc(c) { return c ? `${(c/100).toLocaleString('cs-CZ')} CZK` : '0 CZK'; }
function fmtDt(iso){
  try { const d = new Date(iso);
    return d.toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'})
         + ' · ' + d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
  } catch { return iso || ''; }
}
function escapeHtml(s){return(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function load() {
  if (!bid) return showError('Missing booking ID in URL.');
  let r;
  try { r = await fetch('/api/pay/' + bid); }
  catch { return showError('Network error — please try again.'); }
  if (r.status === 410) {
    document.getElementById('card').innerHTML = `
      <div class="card-body">
        <div class="success-banner">✓ Booking already paid or cancelled.</div>
        <a href="/my-bookings" class="btn" style="display:block;text-align:center;text-decoration:none;background:transparent;border:1px solid var(--border2);color:var(--txt2)">My bookings</a>
      </div>`;
    return;
  }
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    return showError(j.error || 'Failed to load details.');
  }
  const d = await r.json();
  render(d);
}

function showError(msg) {
  document.getElementById('card').innerHTML = `<div class="error-card">${escapeHtml(msg)}</div>`;
}

function render(d) {
  if (!d.publishable_key) {
    return showError('Stripe is not configured (missing publishable key). Contact support.');
  }
  if (!d.client_secret) {
    return showError('Payment not ready. Click retry or contact the artist.');
  }
  clientSecret = d.client_secret;

  const ava = d.artist_avatar_url
    ? `<img src="${escapeHtml(d.artist_avatar_url)}" alt="">`
    : escapeHtml((d.artist_name || '?').slice(0,2).toUpperCase());

  document.getElementById('card').innerHTML = `
    <div class="card-head">
      <h1>PAY DEPOSIT</h1>
      <div class="sub">Booking #${d.id}${d.payment_attempts > 1 ? ' · pokus ' + d.payment_attempts : ''}</div>
    </div>
    <div class="card-body">
      <div class="who">
        <div class="avatar">${ava}</div>
        <div class="who-info">
          <div class="n">${escapeHtml(d.artist_name || '')}</div>
          <div class="s">${escapeHtml(d.artist_studio || 'artist')}</div>
        </div>
      </div>
      <div class="kv"><span class="k">Date</span><span class="v">${fmtDt(d.when)}</span></div>
      ${d.design_note ? `<div class="note">${escapeHtml(d.design_note)}</div>` : ''}
      <div class="amount">${fmtKc(d.amount_cents)}</div>
      <div class="amount-sub">DEPOSIT · SECURED BY STRIPE</div>

      <form id="payForm" onsubmit="pay(event)">
        <div id="card-element" class="element-wrap"></div>
        <button class="btn" id="payBtn" type="submit">Zaplatit ${fmtKc(d.amount_cents)}</button>
      </form>

      <div id="flash"></div>

      <div class="terms-hint">
        Deposit is non-refundable per <a href="/terms" target="_blank">cancellation policy</a>: 100% refund more than 96 h before appointment, 50% within 48 h, no refund after 48 h.
      </div>
    </div>
  `;

  // Mount Stripe Elements
  stripe = Stripe(d.publishable_key);
  const elements = stripe.elements({
    locale: 'cs',
    appearance: { theme: 'flat' },
  });
  cardElement = elements.create('card', {
    style: {
      base: {
        fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
        fontSize: '14px', color: '#0a0a0a',
        '::placeholder': { color: '#5a5a5a' },
      },
      invalid: { color: '#e58787' },
    },
    hidePostalCode: true,
  });
  cardElement.mount('#card-element');
  cardElement.on('focus', () => document.getElementById('card-element').classList.add('focused'));
  cardElement.on('blur',  () => document.getElementById('card-element').classList.remove('focused'));
  cardElement.on('change', (ev) => {
    const el = document.getElementById('card-element');
    if (ev.error) el.classList.add('invalid');
    else el.classList.remove('invalid');
  });
}

async function pay(ev) {
  ev.preventDefault();
  if (!stripe || !clientSecret) return;
  const btn = document.getElementById('payBtn');
  const flash = document.getElementById('flash');
  btn.disabled = true;
  btn.textContent = 'Processing…';
  flash.innerHTML = '';

  const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
    payment_method: { card: cardElement },
  });

  if (error) {
    flash.innerHTML = `<div class="flash err">${escapeHtml(error.message || 'Platba selhala.')}</div>`;
    btn.disabled = false;
    btn.textContent = 'Try again';
    // Offer retry endpoint if PI is in unrecoverable state
    if (error.payment_intent && ['requires_payment_method', 'canceled'].includes(error.payment_intent.status)) {
      flash.innerHTML += `<button class="btn" style="margin-top:10px;background:transparent;border:1px solid var(--border2);color:var(--txt2)" onclick="retryPayment()">Create new payment</button>`;
    }
    return;
  }
  if (paymentIntent && paymentIntent.status === 'succeeded') {
    flash.innerHTML = `<div class="flash ok">✓ Deposit paid. Redirecting…</div>`;
    setTimeout(() => location.href = '/my-bookings?paid=' + bid, 1200);
  } else {
    flash.innerHTML = `<div class="flash err">Payment status: ${paymentIntent ? paymentIntent.status : 'unknown'}. Try again or contact support.</div>`;
    btn.disabled = false;
    btn.textContent = 'Try again';
  }
}

async function retryPayment() {
  const flash = document.getElementById('flash');
  flash.innerHTML = `<div class="flash">Creating new payment…</div>`;
  const r = await fetch(`/api/bookings/${bid}/retry-payment-intent`, { method: 'POST' });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    flash.innerHTML = `<div class="flash err">${escapeHtml(j.error || 'Retry selhal.')}</div>`;
    return;
  }
  // Reload page to get fresh client_secret + re-mounted Elements
  location.reload();
}

load();
</script>
<script src="/icons.js?v=2"></script>
<script src="/ink-trail.js?v=1"></script>
<script src="/cookie-consent.js?v=1"></script>
<script src="/native.js?v=1"></script>
</body>
</html>
